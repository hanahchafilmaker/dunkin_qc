            stage2: (stage1Action && stage2Action) ? { action: stage2Action, location: fd.get('stage2Location') || fd.get('fromLocation'), days: Number(fd.get('stage2Days')) || 1 } : null
          };
        }
        function updateProductPreview() {
          var form = document.getElementById('productForm');
          if (!form) return;
          var draft = buildProductDraftFromForm(form);
          var box = document.getElementById('flowPreviewInner');
          if (box) { box.innerHTML = flowPreviewHtml(stepsFor(draft)); }

          var hasStage1 = !!(draft.stage1 && draft.stage1.action);
          var hasStage2 = !!(draft.stage2 && draft.stage2.action);
          var stage1DaysField = document.getElementById('stage1DaysField');
          if (stage1DaysField) { stage1DaysField.style.display = hasStage1 ? 'block' : 'none'; }
          if (stage2ActionSelect) {
            stage2ActionSelect.disabled = !hasStage1;
            if (!hasStage1) stage2ActionSelect.value = '';
          }
          var stage2LocationField = document.getElementById('stage2LocationField');
          var stage2DaysField = document.getElementById('stage2DaysField');
          if (stage2LocationField) { stage2LocationField.style.display = hasStage2 ? 'block' : 'none'; }
          if (stage2DaysField) { stage2DaysField.style.display = hasStage2 ? 'block' : 'none'; }
        }
        if (stage1ActionSelect) { stage1ActionSelect.addEventListener('change', updateProductPreview); }
        if (stage2ActionSelect) { stage2ActionSelect.addEventListener('change', updateProductPreview); }
        var fromLocSelect = document.querySelector('#productForm select[name="fromLocation"]');
        if (fromLocSelect) { fromLocSelect.addEventListener('change', updateProductPreview); }
        if (document.getElementById('flowPreviewInner')) updateProductPreview();

        var productForm = document.getElementById('productForm');
        if (productForm) {
          productForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            var barcode = (new FormData(productForm).get('barcode') || '').trim();
            if (!barcode) { showToast('바코드를 입력해주세요'); return; }
            var fd = new FormData(productForm);
            var draft = buildProductDraftFromForm(productForm);
            var p = {
              barcode: String(barcode),
              productName: (fd.get('productName') || '').trim(),
              storage: fd.get('storage'),
              fromLocation: draft.fromLocation,
              stage1: draft.stage1,
              stage2: draft.stage2
            };
            state.modal = null;
            await saveProduct(p);
            render();
          });
        }

        var csvInput = document.getElementById('csvInput');
        if (csvInput) {
          csvInput.addEventListener('input', function () {
            var res = parseCsvText(csvInput.value);
            var preview = document.getElementById('csvPreview');
            var msg = res.rows.length + '개 행 인식됨.';
            if (res.errors.length) msg += ' 오류 ' + res.errors.length + '건: ' + res.errors.slice(0, 5).join(' / ');
            preview.textContent = msg;
          });
        }
        var confirmImportBtn = overlay.querySelector('[data-action="confirm-import"]');
        var confirmPrintBtn = overlay.querySelector('[data-action="confirm-print"]');
        if (confirmPrintBtn) {
          confirmPrintBtn.addEventListener('click', async function () {
            var segments = state.modal.segments;
            state.modal = null;
            overlay.remove();
            await printSegments(segments);
          });
        }
        if (confirmImportBtn) {
          confirmImportBtn.addEventListener('click', async function () {
            var ta = document.getElementById('csvInput');
            var res = parseCsvText(ta ? ta.value : '');
            if (res.rows.length === 0) { showToast('가져올 수 있는 행이 없어요'); return; }
            if (res.errors.length > 0) {
              if (!confirm(res.errors.length + '건의 오류가 있어요. 오류가 없는 ' + res.rows.length + '건만 가져올까요?\n\n' + res.errors.slice(0, 8).join('\n'))) return;
            }
            state.modal = null;
            await importProducts(res.rows);
            render();
          });
        }
      }

      /* ============ listeners ============ */
      function attachTopbarListeners() {
        var app = document.getElementById('app');
        app.querySelectorAll('[data-nav]').forEach(function (el) {
          el.addEventListener('click', function () {
            var view = el.getAttribute('data-nav');
            if (view === 'location') { state.currentLocation = el.getAttribute('data-loc'); }
            state.view = view;
            render();
          });
        });
        var staffInput = document.getElementById('staffNameInput');
        if (staffInput) {
          staffInput.addEventListener('change', async function () {
            state.staffName = staffInput.value.trim();
            var saveResult = await saveKey('staffName', state.staffName);
            if (!saveResult.ok) {
              showToast('담당자 이름 저장 실패: ' + saveResult.error);
              return;
            }
            showToast('담당자 이름이 저장되었어요');
          });
        }
        var searchInput = document.getElementById('headerSearch');
        if (searchInput) {
          searchInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
              state.view = 'receive';
              state.receiveFilter = searchInput.value;
              render();
            }
          });
        }
        var connectPrinterBtn = app.querySelector('[data-action="connect-printer"]');
        if (connectPrinterBtn) {
          connectPrinterBtn.addEventListener('click', function () { connectPrinter(); });
        }
      }

      function attachViewListeners() {
        var app = document.getElementById('app');

        app.querySelectorAll('[data-action="advance"]').forEach(function (btn) {
          btn.addEventListener('click', async function () {
            var lot = state.inventory.find(function (l) { return l.lotId === btn.getAttribute('data-lot'); });
            if (!lot) return;
            var product = productByBarcode(lot.barcode);
            var steps = product ? stepsFor(product) : [];
            var idx = steps.findIndex(function (s) { return s.name === lot.status; });
            var next = steps[idx + 1];
            if (!next) return;
            if (next.name === '소진') {
              await consumeLot(lot);
              render();
              return;
            }
            state.modal = { type: 'advance-qty', lot: lot };
            render();
          });
        });
        app.querySelectorAll('[data-action="consume-lot"]').forEach(function (btn) {
          btn.addEventListener('click', async function () {
            var lot = state.inventory.find(function (l) { return l.lotId === btn.getAttribute('data-lot'); });
            if (lot) await consumeLot(lot);
            render();
          });
        });
        app.querySelectorAll('[data-action="edit-lot"]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var lot = state.inventory.find(function (l) { return l.lotId === btn.getAttribute('data-lot'); });
            if (lot) { state.modal = { type: 'edit-lot', lot: lot }; render(); }
          });
        });
        app.querySelectorAll('[data-action="print-lot"]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var lot = state.inventory.find(function (l) { return l.lotId === btn.getAttribute('data-lot'); });
            if (lot) {
              state.modal = { type: 'print-preview', title: lot.productName + ' 영수증', segments: buildLotReceiptSegments(lot) };
              render();
            }
          });
        });
        var printLocBtn = app.querySelector('[data-action="print-location"]');
        if (printLocBtn) {
          printLocBtn.addEventListener('click', function () {
            var loc = locOf(state.currentLocation);
            state.modal = { type: 'print-preview', title: (loc ? loc.name : '') + ' 재고현황', segments: buildLocationStatusSegments(state.currentLocation) };
            render();
          });
        }
        var printAllBtn = app.querySelector('[data-action="print-all-locations"]');
        if (printAllBtn) {
          printAllBtn.addEventListener('click', function () {
            state.modal = { type: 'print-preview', title: '전체 위치 재고현황', segments: buildAllLocationsStatusSegments() };
            render();
          });
        }

        // 입고 view
        var filterInput = document.getElementById('receiveFilterInput');
        if (filterInput) {
          var isComposing = false;
          filterInput.addEventListener('compositionstart', function () { isComposing = true; });
          filterInput.addEventListener('compositionend', function () {
            isComposing = false;
            state.receiveFilter = filterInput.value;
            render();
            var el = document.getElementById('receiveFilterInput');
            if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
          });
          filterInput.addEventListener('input', function (e) {
            if (isComposing || e.isComposing) return;
            state.receiveFilter = filterInput.value;
            render();
            var el = document.getElementById('receiveFilterInput');
            if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
          });
        }
        app.querySelectorAll('[data-action="open-receive"]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var product = productByBarcode(btn.getAttribute('data-barcode'));
            if (product) { state.modal = { type: 'receive', product: product }; render(); }
          });
        });
        app.querySelectorAll('[data-action="open-edit-product"]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var product = productByBarcode(btn.getAttribute('data-barcode'));
            if (product) { state.modal = { type: 'edit-product', product: Object.assign({}, product) }; render(); }
          });
        });
        var newProductBtn = app.querySelector('[data-action="open-new-product"]');
        if (newProductBtn) {
          newProductBtn.addEventListener('click', function () {
            state.modal = { type: 'edit-product', product: { barcode: '', productName: '', storage: 'OTHER', fromLocation: LOCATIONS[0].code, stage1: null, stage2: null } };
            render();
          });
        }
        var importBtn = app.querySelector('[data-action="open-import"]');
        if (importBtn) {
          importBtn.addEventListener('click', function () { state.modal = { type: 'import' }; render(); });
        }
        var printBackorderBtn = app.querySelector('[data-action="print-backorder"]');
        if (printBackorderBtn) {
          printBackorderBtn.addEventListener('click', function () {
            state.modal = { type: 'print-preview', title: '발주 리스트', segments: buildBackorderReceiptSegments() };
            render();
          });
        }
      }

      /* ============ init ============ */
      loadAll();
    })();
  </script>
</body>

</html>
