    let _hangulTable = null;
    function getHangulTable() {
      if (!_hangulTable) {
        const bin = atob(HANGUL_CP949_B64);
        const arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        _hangulTable = arr;
      }
      return _hangulTable;
    }
    function encodeKorean(text) {
      const table = getHangulTable();
      const out = [];
      for (const ch of text) {
        const cp = ch.codePointAt(0);
        if (cp < 0x80) {
          out.push(cp);
        } else if (cp >= 0xAC00 && cp <= 0xD7A3) {
          const idx = (cp - 0xAC00) * 2;
          out.push(table[idx], table[idx + 1]);
        } else {
          out.push(0x3F);
        }
      }
      return Uint8Array.from(out);
    }

    /* =========================================================
       4. 시리얼 프린터 (Web Serial)
       ---------------------------------------------------------
       변경사항: 포트를 계속 열어두지 않고, 출력할 때만 열고
       출력이 끝나면 바로 닫는 "빌려쓰기" 방식으로 변경.
       이렇게 하면 다른 프로그램(POS 등)이 같은 포트를 쓸 때
       충돌이 나지 않는다.
       ========================================================= */
    let savedPort = null; // 브라우저가 이미 사용권한을 부여한 포트(재요청 팝업 방지용)

    function log(msg) {
      const el = document.getElementById('log');
      el.textContent += (typeof msg === 'string' ? msg : (msg.message || String(msg))) + '\n';
    }
    function setConnected(on) {
      document.getElementById('connDot').classList.toggle('on', on);
      document.getElementById('connText').textContent = on ? '프린터 연결됨' : '프린터 미연결';
    }

    // "연결" 버튼: 포트 사용 권한만 미리 받아둔다 (열어두지는 않음)
    async function connectPrinter() {
      if (!('serial' in navigator)) {
        alert('이 브라우저는 Web Serial을 지원하지 않습니다.\nChrome 또는 Edge를 사용하세요.');
        return;
      }
      try {
        savedPort = await navigator.serial.requestPort();
        setConnected(true);
        log('프린터 포트 권한 확인 완료 (출력 시마다 자동으로 열고 닫습니다)');
      } catch (e) {
        console.error(e);
        log(e);
      }
    }

    // 실제 출력: 포트를 "빌려서" 쓰고 끝나면 바로 반납
    async function printText(text) {
      let localPort = null;
      try {
        if (savedPort) {
          localPort = savedPort;
        } else {
          localPort = await navigator.serial.requestPort();
          savedPort = localPort;
        }

        await localPort.open({ baudRate: 9600, dataBits: 8, stopBits: 1, parity: 'none', flowControl: 'none' });
        setConnected(true);

        const writer = localPort.writable.getWriter();
        await writer.write(Uint8Array.from([0x1B, 0x40]));   // ESC @ : 초기화
        await writer.write(Uint8Array.from([0x1B, 0x33, 20])); // ESC 3 n : 줄간격 압축(기본값보다 촘촘하게) → 세로 길이 절약
        await writer.write(Uint8Array.from([0x1C, 0x26]));   // FS &  : 한글(2바이트) 모드 켜기
        await writer.write(encodeKorean(text));
        await writer.write(Uint8Array.from([0x1C, 0x2E]));   // FS .  : 한글 모드 끄기
        await writer.write(Uint8Array.from([0x1B, 0x64, 0x05]));
        await writer.write(Uint8Array.from([0x1D, 0x56, 0x00]));
        writer.releaseLock();

        log('출력 완료');
        toast('출력 완료');
      } catch (e) {
        console.error(e);
        log(e);
        alert('출력 오류: ' + (e.message || e));
      } finally {
        // 성공하든 실패하든 항상 포트를 반납한다
        if (localPort) {
          try {
            await localPort.close();
          } catch (closeErr) {
            console.error('포트 닫기 실패:', closeErr);
            log(closeErr);
          }
        }
        setConnected(false);
      }
    }

    /* =========================================================
       4-2. 바코드 "이미지" 출력 (ESC/POS CODE128)
       ---------------------------------------------------------
       숫자만 텍스트로 찍으면 스캐너가 인식할 수 없으므로,
       프린터 내장 바코드 인쇄 명령(GS k)으로 실제 스캔 가능한
       바코드 심볼을 찍는다. CODE128 Code Set B 사용.
       ========================================================= */
    function buildBarcodeBytes(code) {
      const payload = '{B' + code; // CODE128 Code Set B 지정 프리픽스
      const dataBytes = [];
      for (let i = 0; i < payload.length; i++) dataBytes.push(payload.charCodeAt(i) & 0xFF);
      return Uint8Array.from([
        0x1D, 0x68, 20,                       // GS h n  : 바코드 높이 20dot (기존 40dot에서 추가 축소)
        0x1D, 0x77, 2,                        // GS w n  : 모듈 너비 2
        0x1D, 0x48, 0,                        // GS H n  : 바코드 아래 숫자(HRI) 미표시
        0x1D, 0x66, 0,                        // GS f n  : HRI 폰트 A
        0x1D, 0x6B, 73, dataBytes.length,      // GS k m n : CODE128 인쇄 시작(m=73)
        ...dataBytes
      ]);
    }

    // 텍스트와 바코드 이미지가 섞인 영수증을 순서대로 출력
    // segments: [{type:'text', text}, {type:'barcode', code}, ...]
    async function printSegments(segments) {
      let localPort = null;
      try {
        if (savedPort) {
          localPort = savedPort;
        } else {
          localPort = await navigator.serial.requestPort();
          savedPort = localPort;
        }

        await localPort.open({ baudRate: 9600, dataBits: 8, stopBits: 1, parity: 'none', flowControl: 'none' });
        setConnected(true);

        const writer = localPort.writable.getWriter();
        await writer.write(Uint8Array.from([0x1B, 0x40])); // ESC @ : 초기화
        await writer.write(Uint8Array.from([0x1B, 0x33, 20])); // ESC 3 n : 줄간격 압축 → 세로 길이 절약

        for (const seg of segments) {
          if (seg.type === 'barcode') {
            await writer.write(buildBarcodeBytes(seg.code));
            await writer.write(Uint8Array.from([0x0A]));
          } else if (seg.type === 'cut') {
            await writer.write(Uint8Array.from([0x1B, 0x64, 0x02])); // 절단 전 여백 살짝 확보
            await writer.write(Uint8Array.from([0x1D, 0x56, 0x00])); // GS V 0 : 중간 절단
          } else {
            await writer.write(Uint8Array.from([0x1C, 0x26])); // FS & : 한글 모드 켜기
            await writer.write(encodeKorean(seg.text));
            await writer.write(Uint8Array.from([0x1C, 0x2E])); // FS . : 한글 모드 끄기
          }
        }

        await writer.write(Uint8Array.from([0x1B, 0x64, 0x05]));
        await writer.write(Uint8Array.from([0x1D, 0x56, 0x00]));
        writer.releaseLock();

        log('출력 완료');
        toast('출력 완료');
      } catch (e) {
        console.error(e);
        log(e);
        alert('출력 오류: ' + (e.message || e));
      } finally {
        if (localPort) {
          try {
            await localPort.close();
          } catch (closeErr) {
            console.error('포트 닫기 실패:', closeErr);
            log(closeErr);
          }
        }
        setConnected(false);
      }
    }

    // 품목 라벨 출력: 품명 + 실물 스캔 가능한 CODE128 바코드(GS k)
    // (라벨 출력 기능은 사용하지 않기로 하여 제거됨 — 필요해지면 printSegments/buildBarcodeBytes로 재구현)

    /* =========================================================
       4-1. 바코드 스캔 & 파싱 (GS1-128 / 일반 EAN 지원)
       ---------------------------------------------------------
       - GS1-128 납품 바코드: (01)GTIN14 (17)유효기간YYMMDD (10)로트...
         → 상품코드(GTIN)와 소비기한을 동시에 인식
       - 일반 EAN-13 등 순수 숫자 바코드: 상품코드로만 사용(소비기한 없음)
       - 스캐너가 보내는 데이터는 보통 마지막에 Enter(\n)가 따라온다
       ========================================================= */
    function normalizeGtin(str) {
      if (!str) return '';
      const digits = String(str).replace(/\D/g, '');
      return digits.replace(/^0+/, '') || '0';
    }

    function parseGS1Barcode(raw) {
      // 스캐너가 앞에 심볼로지 식별자(]C1, ]e0 등)를 붙이는 경우 제거
      let s = String(raw).replace(/^\][A-Za-z0-9]{1,2}/, '').trim();
      const result = {};
      let i = 0;
      let guard = 0;
      while (i < s.length && guard < 200) {
        guard++;
        const ai2 = s.substr(i, 2);
        if (ai2 === '01' && /^\d{14}$/.test(s.substr(i + 2, 14))) {
          result.gtin = s.substr(i + 2, 14);
          i += 16;
        } else if (ai2 === '17' && /^\d{6}$/.test(s.substr(i + 2, 6))) {
          result.expiryRaw = s.substr(i + 2, 6);
          i += 8;
        } else if (ai2 === '15' && /^\d{6}$/.test(s.substr(i + 2, 6))) {
          result.bestBeforeRaw = s.substr(i + 2, 6);
          i += 8;
        } else if (ai2 === '10') {
          // 로트번호: 가변 길이, GS(\x1D) 문자 또는 문자열 끝까지
          const rest = s.substr(i + 2);
          const gsIdx = rest.indexOf('\x1D');
          const lot = gsIdx >= 0 ? rest.substr(0, gsIdx) : rest;
          result.lot = lot;
          i += 2 + lot.length + (gsIdx >= 0 ? 1 : 0);
        } else {
          i++; // 알 수 없는 구간은 한 글자씩 건너뛰며 무한루프 방지
        }
      }
      // AI(17)/AI(15)의 YYMMDD → 날짜 문자열 변환 (일자 '00'은 해당 월의 마지막 날로 처리)
      function toDateStr(yymmdd) {
        const yy = Number(yymmdd.substr(0, 2));
        const mm = Number(yymmdd.substr(2, 2));
        let dd = Number(yymmdd.substr(4, 2));
        const year = 2000 + yy;
        if (dd === 0) dd = lastDayOfMonth(year, mm);
        return `${year}-${pad(mm)}-${pad(dd)}`;
      }
      if (result.expiryRaw) result.expiry = toDateStr(result.expiryRaw);
      if (result.bestBeforeRaw) result.bestBefore = toDateStr(result.bestBeforeRaw);
      return result;
    }

    async function handleScan(raw) {
      const value = String(raw || '').trim();
      if (!value) return;

      const parsed = parseGS1Barcode(value);
      let gtin = parsed.gtin;
      let expiry = parsed.expiry || parsed.bestBefore || null;

      // GS1 구조가 아니면 순수 숫자 바코드(EAN-8/13, UPC 등)로 간주
      if (!gtin && /^\d{8,14}$/.test(value)) {
        gtin = value;
      }

      if (!gtin) {
        toast('인식할 수 없는 바코드입니다');
        return;
      }

      // 매 스캔마다 서버(scan API)를 호출해 최신 제품 기준 + 현재 재고를 조회한다.
      // 서버 응답이 있으면 그 값으로 로컬 product를 갱신/보강하고, 실패하면 로컬 캐시로 대체한다.
      const scanResult = await SheetSync.scanBarcode(gtin);
      let product = DB.products.find(p => p.barcode && normalizeGtin(p.barcode) === normalizeGtin(gtin));

      if (scanResult && scanResult.success && scanResult.product) {
        const sp = scanResult.product; // MASTER_PRODUCTS 행: barcode/productName/category/storage/ruleType/days
        if (product) {
          Object.assign(product, {
            name: sp.productName ?? product.name,
            category: sp.category ?? product.category,
            storageMethod: sp.storage ?? product.storageMethod,
            basis: sp.ruleType ? ruleTypeToBasis(sp.ruleType) : product.basis,
            durationValue: sp.days != null ? Number(sp.days) : product.durationValue,
            durationUnit: 'day',
            containerCycleDays: sp.containerCycleDays != null ? Number(sp.containerCycleDays) : product.containerCycleDays,
          });
        } else {
          // 서버는 알고 있지만 로컬에는 없는 품목 → 최소 정보로 로컬에 생성
          const currentZone = (ZONES.find(z => location.hash.includes('zone/' + z.key)) || ZONES[0]).key;
          product = {
            id: uid(), zone: currentZone, category: sp.category || '기타', name: sp.productName || gtin,
            basis: ruleTypeToBasis(sp.ruleType), durationValue: Number(sp.days) || 0,
            durationUnit: 'day', storageMethod: sp.storage || null, barcode: gtin, order: DB.products.length,
            containerCycleDays: Number(sp.containerCycleDays) || DEFAULT_CONTAINER_CYCLE_DAYS
          };
          DB.products.push(product);
        }
      }

      if (!product) {
        if (confirm(`등록되지 않은 바코드입니다.\n(${gtin})\n\n새 품목으로 등록하시겠습니까?`)) {
          const currentZone = (ZONES.find(z => location.hash.includes('zone/' + z.key)) || ZONES[0]).key;
          openProductForm(currentZone, null, gtin);
        }
        return;
      }

      const basis = BASIS[product.basis] || BASIS_FALLBACK;
      const entry = DB.entries[product.id] || {};
      const messages = [];
      const beforeStorage = inferStorageMethod(product.zone);

      // 스캔 = "지금 막 개봉/해동/소분했다"는 신호로 보고 기준 시각을 현재로 갱신.
      // 안전보관일은 이 baseDate로부터 자동 계산되는 값이라(computeSafeDate),
      // 여기서 entry.baseDate만 갱신해두면 화면/영수증 어디서든 자동으로 다시 계산된다.
      if (basis.track) {
        entry.baseDate = nowLocalInputValue();
        messages.push(`${basis.dateLabel} ${fmtDT(entry.baseDate)}로 갱신`);
      }

      // 바코드 안에 GS1 소비기한(AI 17/15) 정보가 실려 있으면 그것도 함께 반영
      if (expiry) {
        entry.expiry = expiry;
        entry.expiryCleared = false; // 새 소비기한이 실제로 등록됐으니 폐기 표시 해제
        messages.push(`소비기한 ${fmtD(expiry)} 등록`);
      }

      // 스캔으로 발생한 QC 이벤트 종류(해동/개봉/소분)를 서버 QC_LOG + INVENTORY에도 반영한다.
      // 6단계 위치 전환 액션(LocationTransition)이 추가된 이후에도, 기존 postQC 호출은
      // 백엔드 handleQC_에서 그대로 라우팅되므로 호환된다.
      const actionLabelByBasis = { thaw: '해동', open: '개봉', subdiv: '소분' };
      const statusByBasis = { thaw: '해동중', open: '개봉', subdiv: '개봉' };
      const afterStorage = product.basis === 'thaw' ? '냉장' : beforeStorage;
      if (actionLabelByBasis[product.basis]) {
        entry.status = statusByBasis[product.basis];
        entry.safeUntil = computeSafeDate(product, entry);
        SheetSync.postQC({
          barcode: product.barcode,
          action: actionLabelByBasis[product.basis],
          beforeStorage,
          afterStorage,
          quantity: entry.qty ?? 1,
          operator: '관리자'
        }); // 결과를 기다리지 않고 백그라운드로 전송
        if (product.basis === 'thaw') product.storageMethod = '냉장';
      }

      if (messages.length) {
        entry.updatedAt = new Date().toISOString();
        DB.entries[product.id] = entry;
        await persistEntry(product.id);
        toast(`${product.name} · ${messages.join(' · ')}`);
      } else {
        toast(`${product.name} 인식됨 (관리 기준 없음)`);
      }

      // 해당 품목이 있는 구역 화면으로 이동해서 강조 표시 (같은 화면이면 바로 갱신해서 보여줌)
      const targetHash = '#/zone/' + product.zone;
      if (location.hash !== targetHash) {
        navigate(targetHash);
        setTimeout(() => flashRow(product.id), 150);
      } else {
        const searchInput = document.getElementById('searchInput');
        renderProductList(product.zone, searchInput ? searchInput.value.trim() : '');
        setTimeout(() => flashRow(product.id), 50);
      }
    }

    function flashRow(pid) {
      const row = document.querySelector(`.product-row[data-pid="${pid}"]`);
      if (!row) return;
      row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      row.classList.add('flash');
      setTimeout(() => row.classList.remove('flash'), 1000);
      // 방금 반영된 소비기한 값을 입력창에도 즉시 반영
      const expInput = row.querySelector('.expiry-input');
      if (expInput) {
        const entry = DB.entries[pid];
        expInput.value = (entry && entry.expiry) || '';
      }
    }

    /* =========================================================
       5. 영수증 빌더
       ========================================================= */
    const DIV32 = '================================';
    const DIV25 = '=========================';

    function center(str, width = 32) {
      let w = 0;
      for (const ch of str) { w += (ch.codePointAt(0) > 0x1100 ? 2 : 1); }
      const padLen = Math.max(0, Math.floor((width - w) / 2));
      return ' '.repeat(padLen) + str;
    }

    function productsForZone(zoneKey) {
      return DB.products
        .filter(p => p.zone === zoneKey)
        .sort((a, b) => (a.order || 0) - (b.order || 0));
    }

    function groupByCategory(products) {
      const map = new Map();
      products.forEach(p => {
        const cat = p.category || '기타';
        if (!map.has(cat)) map.set(cat, []);
        map.get(cat).push(p);
      });
      return map;
    }




    // buildZoneReceipt와 내용은 동일하지만, 바코드 자리에 숫자 텍스트 대신
    // 실제 스캔 가능한 CODE128(GS k) 심볼을 끼워 넣기 위한 segments 버전.
    // (미리보기는 <pre> 태그라 실물 바코드를 보여줄 수 없으므로 미리보기는
    //  여전히 buildZoneReceipt 텍스트를 쓰고, 실제 출력은 이 함수를 쓴다.)
    //
    // 자동 중간 절단은 쓰지 않는다 — 구역마다 길이가 달라 애매한 위치에서
    // 잘리는 문제가 있어서, 끝까지(점검자 줄까지) 한 번에 인쇄하고
    // 마지막에만 한 번 절단한다(자르는 건 사람이 직접).
    function buildZoneReceiptSegments(zoneKey) {
      const zone = ZONES.find(z => z.key === zoneKey);
      const products = productsForZone(zoneKey);
      const grouped = groupByCategory(products);
      const segments = [];
      let buf = [];
      const flush = () => {
        if (buf.length) {
          segments.push({ type: 'text', text: buf.join('\n') + '\n' });
          buf = [];
        }
      };
      const pushLine = (line) => { buf.push(line); };

      pushLine(DIV32);
      pushLine(center(zone.label + ' 일일관리표'));
      pushLine(DIV32);
      pushLine(`출력시간 : ${fmtNow()}`);
      pushLine('');
      if (products.length === 0) {
        pushLine('(등록된 품목 없음)');
        pushLine('');
      } else {
        grouped.forEach((items, cat) => {
          pushLine(`[${cat}]`);
          items.forEach(p => {
            const entry = DB.entries[p.id];
            const basis = BASIS[p.basis] || BASIS_FALLBACK;
            const storageMethod = p.storageMethod || inferStorageMethod(p.zone);
            pushLine(`- ${p.name}`);

            // 1줄 : 기준일 + 안전보관일을 한 줄에 같이 배치
            const dateLabelShort = basis.dateLabel ? basis.dateLabel.replace('일', '') : '';
            const noProduct = basis.track && !p.stockTracking && !!(entry && entry.noProduct);
            const baseStr = basis.track ? (entry && entry.baseDate ? fmtDTShort(entry.baseDate) : '__.__ __:__') : null;
            const safe = entry ? computeSafeDate(p, entry) : null;
            const safeStr = basis.calc ? (safe ? fmtDTShort(safe) : '__.__ __:__') : null;
            if (noProduct) {
              pushLine(`  ${dateLabelShort} 제품 없음`);
            } else {
              const line1parts = [];
              if (baseStr) line1parts.push(`${dateLabelShort}:${baseStr}`);
              if (safeStr) line1parts.push(`안전:${safeStr}`);
              if (line1parts.length) pushLine('  ' + line1parts.join('  '));
            }

            // 소분 품목은 통 교체 예정일도 함께 표기(식품 소비기한과는 별개 값)
            if (p.basis === 'subdiv') {
              const containerDue = computeContainerDue(p, entry);
              if (containerDue) pushLine(`  통교체:${fmtDTShort(containerDue)}`);
            }

            // 2줄 이후 : 재고별 관리 품목은 재고(수량+소비기한)를 한 줄씩,
            // 아니면 기존처럼 소비기한+보관방법을 한 줄에 같이 배치
            if (p.stockTracking) {
              const lots = (entry && entry.lots) || [];
              if (lots.length === 0) {
                pushLine(`  재고:미입력  보관:${storageMethod}`);
              } else {
                lots.forEach((lot, idx) => {
                  const label = lot.opened ? '개봉' : `재고${idx + 1}`;
                  pushLine(`  ${label}:${lot.qty ?? '?'}개  소비기한:${lot.expiry ? fmtD(lot.expiry) : '__________'}`);
                });
                pushLine(`  보관:${storageMethod}`);
              }
            } else {
              const expiry = (entry && entry.expiry) || p.defaultExpiry;
              pushLine(`  소비기한:${expiry ? fmtD(expiry) : '__________'}  보관:${storageMethod}`);
            }

            if (p.barcode) {
              flush();
              segments.push({ type: 'barcode', code: p.barcode });
            }
          });
          pushLine('');
        });
      }
      pushLine(DIV32);
      pushLine('점검자 : ______________');
      pushLine(DIV32);
      pushLine('');
      flush();
      return segments;
    }

    function buildAlertReceipt(title, list, kind) {
      const lines = [];
      lines.push(DIV25);
      lines.push(title);
      lines.push(DIV25);
      lines.push('');
      if (list.length === 0) {
        lines.push('해당 품목 없음');
        lines.push('');
      } else {
        list.forEach((item) => {
          const product = item.product;
          const zone = ZONES.find(z => z.key === product.zone);
          lines.push(`${product.name} (${zone ? zone.label : ''})`);
          const useExpiry = item.reason ? item.reason === 'expiry' : kind === 'expiry';
          if (useExpiry) {
            lines.push('소비기한');
            lines.push(fmtD(item.expiry));
          } else {
            lines.push('안전보관');
            lines.push(fmtDT(item.safe));
          }
          lines.push('');
        });
      }
      lines.push(DIV25);
      lines.push('');
      return lines.join('\n');
    }

    function allTrackedWithSafeDates() {
      const out = [];
      DB.products.forEach(p => {
        const basis = BASIS[p.basis] || BASIS_FALLBACK;
        if (!basis.calc) return;
        const entry = DB.entries[p.id];
        if (!entry) return;
        const safe = computeSafeDate(p, entry);
        if (!safe) return;
        out.push({ product: p, safe });
      });
      return out;
    }
    // 품목의 "실제로 사용해야 할" 소비기한을 계산한다.
    // entry.expiry가 있으면 그 값을, 없으면 품목마다 정해둔 기본 소비기한(defaultExpiry)을 대신 보여준다.
    // 단, 폐기 처리(discardProduct)로 인해 값이 "명시적으로 비워진" 경우에는
    // 새 소비기한이 실제로 입력되기 전까지 defaultExpiry로 되돌아가지 않게 막는다.
    // (이 방어 로직이 없으면 폐기 처리해도 defaultExpiry가 다시 채워져서
    //  "오늘 폐기 예정" 목록에서 우유 등 품목이 사라지지 않는 버그가 발생함)
    function effectiveExpiry(p, entry) {
      if (entry && entry.expiryCleared && !entry.expiry) return null;
      return (entry && entry.expiry) || p.defaultExpiry || null;
    }

    function allTrackedWithExpiry() {
      const out = [];
      DB.products.forEach(p => {
        const entry = DB.entries[p.id];
        const expiry = effectiveExpiry(p, entry);
        if (!expiry) return;
        out.push({ product: p, expiry });
      });
      return out;
    }

    // 품목을 "폐기 처리"한다: 소비기한/안전보관일 관련 값을 초기화해서
    // 오늘 폐기 예정 목록에서 사라지게 하고, 재고관리 품목은 해당 로트를 제거한다.
    async function discardProduct(productId, reason) {
      const product = DB.products.find(p => p.id === productId);
      if (!product) return;
      const entry = DB.entries[productId] || {};

      if (product.stockTracking) {
        // 재고관리 품목: 소비기한이 지난 로트들만 제거
        const today = todayDateOnly();
        entry.lots = (entry.lots || []).filter(lot => {
          if (!lot.expiry) return true;
          return dateOnlyOf(lot.expiry) > today;
        });
      } else {
        // 일반 품목: 소비기한/기준일자를 비워서 목록에서 제거되도록 함
        entry.expiry = null;
        // defaultExpiry로 자동 대체되지 않도록 "명시적으로 비웠다"는 표시를 남김.
        // 새 제품을 스캔하거나 소비기한을 직접 입력하면(saveEntry/handleScan) 이 플래그는 해제된다.
        entry.expiryCleared = true;
        if (reason !== 'expiry') {
          entry.baseDate = null; // 안전보관일 사유면 기준일도 초기화
        }
      }
      entry.updatedAt = new Date().toISOString();
      entry.lastDiscardedAt = new Date().toISOString();
      DB.entries[productId] = entry;

      await persistEntry(productId);
      // 백엔드 6단계 액션(discard)에도 사유를 함께 남겨 LOG/INVENTORY에 반영
      LocationTransition.discard({ barcode: product.barcode, reason: reason === 'expiry' ? 'expiry' : (product.basis === 'subdiv' ? 'container' : 'safe'), quantity: entry.qty ?? 1, operator: '관리자' });
      toast(`${product.name} 폐기 처리 완료`);
    }

    // 사용 완료 처리: 직원이 재고를 다 써서 스캔 후 "사용 완료"를 눌렀을 때.
    // discardProduct(소비기한/안전보관일 만료로 인한 폐기)와는 별개의 흐름이다.
    // - lotIdx가 주어지면 해당 로트만 제거(부분 소진), 없으면 해당 품목의 추적 정보를 초기화.
    // - 서버 QC_LOG에도 action:'사용완료'로 기록하고 재고 수량을 반영한다.
    async function consumeProduct(productId, lotIdx) {
      const product = DB.products.find(p => p.id === productId);
      if (!product) return;
      const entry = DB.entries[productId] || {};
      let consumedQty = 1;

      if (product.stockTracking && Array.isArray(entry.lots) && lotIdx != null) {
        const lot = entry.lots[lotIdx];
        consumedQty = lot ? (lot.qty ?? 1) : 1;
        entry.lots.splice(lotIdx, 1);
        if (entry.lots.length === 0) entry.status = '소진';
      } else {
        consumedQty = entry.qty ?? 1;
        entry.baseDate = null;
        entry.expiry = null;
        entry.expiryCleared = true;
        entry.qty = 0;
        entry.status = '소진';
      }
      entry.updatedAt = new Date().toISOString();
      DB.entries[productId] = entry;
      await persistEntry(productId);

      SheetSync.postQC({
        barcode: product.barcode,
        action: '사용완료',
        beforeStorage: inferStorageMethod(product.zone),
        afterStorage: null,
        quantity: consumedQty,
        operator: '관리자'
      }); // 백그라운드 전송 — 결과를 기다리지 않음

      toast(`${product.name} 사용 완료 처리됨`);
    }

    function todayDiscardList() {
      // 폐기 예정 = 소비기한이 지난 품목 + 안전보관일이 지난 품목(둘 다 포함, 중복 제거)
      const today = todayDateOnly();

      const now = new Date();
      const seen = new Set();
      const out = [];
      allTrackedWithExpiry().forEach(({ product, expiry }) => {
        if (dateOnlyOf(expiry) <= today) {
          out.push({ product, reason: 'expiry', expiry });
          seen.add(product.id);
        }
      });
      allTrackedWithSafeDates().forEach(({ product, safe }) => {
        if (seen.has(product.id)) return;
        if (new Date(safe) <= now) {
          out.push({ product, reason: 'safe', safe });
          seen.add(product.id);
        }
      });
      return out;
    }
    function todayExpireList() {
      const today = todayDateOnly();
      return allTrackedWithSafeDates().filter(({ safe }) => +dateOnlyOf(safe) === +today);
    }

    /* =========================================================
       6. UI 라우팅 & 렌더링
       ========================================================= */
    const root = document.getElementById('viewRoot');
    const pageTitle = document.getElementById('pageTitle');
    const backBtn = document.getElementById('backBtn');

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 1400);
    }

    function setTitle(t, showBack) {
      pageTitle.textContent = t;
      backBtn.style.display = showBack ? 'inline-block' : 'none';
    }

    function navigate(hash) { location.hash = hash; }
    backBtn.addEventListener('click', () => history.back());

    window.addEventListener('hashchange', router);
    window.addEventListener('DOMContentLoaded', async () => {
      await loadDB();
      router();
    });

    function router() {
      const hash = location.hash.replace(/^#\/?/, '');
      const [view, arg] = hash.split('/');
      if (!view) { renderHome(); return; }
      if (view === 'zone' && arg) { renderZone(arg); return; }
      if (view === 'manage') { renderManage(arg || ZONES[0].key); return; }
      if (view === 'today-discard') { renderTodayList('discard'); return; }
      if (view === 'today-expire') { renderTodayList('expire'); return; }
      if (view === 'backup') { renderBackup(); return; }
      renderHome();
    }

    /* ---------- 홈 화면 ---------- */
    function renderHome() {
      setTitle('🍩 던킨 품질관리 시스템', false);
      const discardCount = todayDiscardList().length;
      const expireCount = todayExpireList().length;

      root.innerHTML = `
    <div class="menu">
      ${ZONES.map(z => `
        <button data-nav="zone/${z.key}">
          <span class="zonelabel">${z.label}</span>
          <span class="zonecount">${productsForZone(z.key).length}개 품목</span>
        </button>
      `).join('')}
    </div>
    <div class="submenu">
      <button data-nav="manage">
        제품 관리
      </button>
      <button data-nav="today-discard">
        오늘 폐기 예정
        ${discardCount > 0 ? `<span class="badge">${discardCount}</span>` : ''}
      </button>
      <button data-nav="today-expire">
        오늘 안전보관일 만료
        ${expireCount > 0 ? `<span class="badge">${expireCount}</span>` : ''}
      </button>
      <button data-nav="backup">
        백업 / 복원
      </button>
    </div>
  `;
      bindNav();
    }

    function bindNav() {
      root.querySelectorAll('[data-nav]').forEach(btn => {
        btn.addEventListener('click', () => navigate('#/' + btn.dataset.nav));
      });
    }

    /* ---------- 냉장고별 일일 관리 화면 ---------- */
    function renderZone(zoneKey) {
      const zone = ZONES.find(z => z.key === zoneKey);
      if (!zone) { navigate('#/'); return; }
      setTitle(zone.label + ' 일일관리', true);

      root.innerHTML = `
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="제품 검색...">
    </div>
    <div class="panel">
      <h3>미리보기</h3>
      <div id="preview" class="preview-box">미리보기 버튼을 눌러 출력 내용을 확인하세요.</div>
      <div class="actions">
        <button id="previewBtn">👁 미리보기</button>
        <button class="primary" id="printBtn">🖨️ 출력</button>
        <button class="ghost" data-nav="manage/${zoneKey}">⚙ 품목 관리</button>
      </div>
    </div>
    <div id="productList"></div>
  `;

      bindNav();
      document.getElementById('previewBtn').addEventListener('click', () => {
        renderReceiptPreview(document.getElementById('preview'), buildZoneReceiptSegments(zoneKey));
      });
      document.getElementById('printBtn').addEventListener('click', () => {
        printSegments(buildZoneReceiptSegments(zoneKey));
      });
      document.getElementById('searchInput').addEventListener('input', (e) => {
        renderProductList(zoneKey, e.target.value.trim());
      });

      renderProductList(zoneKey, '');
    }

    function renderProductList(zoneKey, filterText) {
      const listEl = document.getElementById('productList');
      let products = productsForZone(zoneKey);
      if (filterText) {
        products = products.filter(p => p.name.toLowerCase().includes(filterText.toLowerCase()));
      }
      if (products.length === 0) {
        listEl.innerHTML = `<div class="empty">등록된 품목이 없습니다. '품목 관리'에서 추가해주세요.</div>`;
        return;
      }
      const grouped = groupByCategory(products);
      let html = '';
      grouped.forEach((items, cat) => {
        html += `<div class="cat-title">${cat}</div>`;
        items.forEach(p => {
          const entry = DB.entries[p.id] || {};
          const basis = BASIS[p.basis] || BASIS_FALLBACK;
          const safe = computeSafeDate(p, entry);
          const status = safe ? safeStatus(safe, p.zone) : 'none';
          const pillClass = pillClassFor(status);

          const doneToday = basis.track && isToday(entry.baseDate);
          const dateLabelShort = basis.dateLabel ? basis.dateLabel.replace('일', '') : '';
          const noProduct = basis.track && !!entry.noProduct;
          const productType = getProductType(p);
          // 소분(subdiv) 품목은 통 교체(7일 고정)와 식품 자체 소비기한을 독립적으로 표시
          const isDualRuleSubdiv = p.basis === 'subdiv' && !p.stockTracking;

          html += `<div class="product-row" data-pid="${p.id}">
        <div class="pname">
          <span>${p.name} <span class="tag">${cat} · ${productType}</span></span>
          ${p.stockTracking
              ? (() => {
                const lots = entry.lots || [];
                if (lots.length === 0) return `<span class="safe-pill danger">재고 없음</span>`;
                const nearest = lots.filter(l => l.expiry).sort((a, b) => new Date(a.expiry) - new Date(b.expiry))[0];
                return nearest
                  ? `<span class="safe-pill ${expiryStatus(nearest.expiry)}">소비기한 ${fmtD(nearest.expiry)}</span>`
                  : `<span class="safe-pill">소비기한 미입력</span>`;
              })()
              : (isDualRuleSubdiv
                ? renderDualRuleBadges(p, entry)
                : (noProduct ? `<span class="safe-pill warn">${dateLabelShort} 제품 없음</span>`
                  : (safe ? `<span class="safe-pill ${pillClass}">안전 ${fmtDT(safe)}</span>` : (basis.calc ? `<span class="safe-pill">미입력</span>` : ''))))}
        </div>
        ${basis.track ? `
          <label class="no-product-row" style="display:flex; align-items:center; gap:6px; margin:8px 0 6px; font-size:0.8rem; color:var(--muted); cursor:pointer;">
            <input type="checkbox" class="no-product-chk" style="width:auto;" ${noProduct ? 'checked' : ''}>
            ${dateLabelShort} 제품 없음
          </label>
          <div class="basis-date-wrap" style="${noProduct ? 'display:none;' : ''}">
            <button type="button" class="basis-now-btn ${doneToday ? 'done' : ''}">
              ${doneToday ? `✅ 오늘 ${basis.dateLabel} 등록됨` : `⏱ 지금 ${basis.dateLabel} 등록`}
              <span class="sub">${entry.baseDate ? `마지막 기록 : ${fmtDT(entry.baseDate)}` : '기록 없음'}</span>
            </button>
            <details class="basis-manual">
              <summary>${basis.dateLabel} 직접 수정</summary>
              <input type="datetime-local" class="basis-input" value="${entry.baseDate || ''}">
            </details>
          </div>
        ` : ''}
        ${!p.stockTracking ? `<div class="action-row" style="display:flex; gap:6px; flex-wrap:wrap; margin:6px 0;">${renderActionButtons(productType)}</div>` : ''}
        ${p.stockTracking ? `
          <div class="lot-list" data-pid="${p.id}">
            ${(entry.lots || []).length === 0
                ? `<div class="empty" style="padding:6px 2px;">등록된 재고가 없습니다. 아래에서 추가해주세요.</div>`
                : (entry.lots || []).map((lot, idx) => `
              <div class="field-row lot-row ${lot.opened ? 'opened' : ''}" data-lot-idx="${idx}" style="align-items:flex-end;">
                <div style="flex:0 0 90px;">
                  <label>수량</label>
                  <input type="number" min="0" class="lot-qty" placeholder="개수" value="${lot.qty ?? ''}">
                </div>
                <div style="flex:1;">
                  <label>소비기한</label>
                  <input type="date" class="lot-expiry" value="${lot.expiry || ''}">
                </div>
                <button type="button" class="small ${lot.opened ? 'primary' : 'ghost'} lot-open-toggle" style="flex:0 0 auto;">${lot.opened ? '✅ 개봉중' : '개봉'}</button>
                <button type="button" class="small lot-consume" style="flex:0 0 auto;">✅ 사용완료</button>
                <button type="button" class="small danger lot-del" style="flex:0 0 auto;">삭제</button>
              </div>
            `).join('')}
            <button type="button" class="small lot-add">＋ 재고 추가</button>
          </div>
        ` : `
        <div class="field-row">
          <div style="flex:1;">
            <label>소비기한</label>
            <input type="date" class="expiry-input" value="${effectiveExpiry(p, entry) || ''}">
          </div>
        </div>
        `}
        ${p.barcode ? `<svg class="barcode-svg" data-code="${p.barcode}"></svg>` : ''}
      </div>`;
        });
      });
      listEl.innerHTML = html;
      renderBarcodeSvgs(listEl);

      listEl.querySelectorAll('.product-row').forEach(row => {
        const pid = row.dataset.pid;
        const basisInput = row.querySelector('.basis-input');
        const expiryInput = row.querySelector('.expiry-input');
        const nowBtn = row.querySelector('.basis-now-btn');

        async function saveEntry(baseDateOverride) {
          const entry = DB.entries[pid] || {};
          if (baseDateOverride !== undefined) {
            entry.baseDate = baseDateOverride;
          } else if (basisInput) {
            entry.baseDate = basisInput.value || null;
          }
          if (expiryInput) {
            entry.expiry = expiryInput.value || null;
            if (entry.expiry) entry.expiryCleared = false; // 직접 입력했으니 폐기 표시 해제
          }
          entry.updatedAt = new Date().toISOString();
          DB.entries[pid] = entry;
          await persist();
          toast('저장됨');
          renderProductList(zoneKey, document.getElementById('searchInput').value.trim());
        }
        if (basisInput) basisInput.addEventListener('change', () => saveEntry());
        if (expiryInput) expiryInput.addEventListener('change', () => saveEntry());
        if (nowBtn) nowBtn.addEventListener('click', () => saveEntry(nowLocalInputValue()));

        const noProductChk = row.querySelector('.no-product-chk');
        if (noProductChk) noProductChk.addEventListener('change', async () => {
          const entry = DB.entries[pid] || {};
          entry.noProduct = noProductChk.checked;
          entry.updatedAt = new Date().toISOString();
          DB.entries[pid] = entry;
          await persist();
          renderProductList(zoneKey, document.getElementById('searchInput').value.trim());
        });

        // 재고(수량+소비기한) 목록 편집
        row.querySelectorAll('.lot-qty, .lot-expiry').forEach(inp => {
          inp.addEventListener('change', async () => {
            const lotRow = inp.closest('.lot-row');
            const idx = Number(lotRow.dataset.lotIdx);
            const entry = DB.entries[pid] || {};
            entry.lots = entry.lots || [];
            entry.lots[idx] = entry.lots[idx] || {};
            entry.lots[idx].qty = Number(lotRow.querySelector('.lot-qty').value) || 0;
            entry.lots[idx].expiry = lotRow.querySelector('.lot-expiry').value || null;
            entry.updatedAt = new Date().toISOString();
            DB.entries[pid] = entry;
            await persist();
            toast('저장됨');
          });
        });
        row.querySelectorAll('.lot-open-toggle').forEach(btn => {
          btn.addEventListener('click', async () => {
            const lotRow = btn.closest('.lot-row');
            const idx = Number(lotRow.dataset.lotIdx);
            const entry = DB.entries[pid] || {};
            entry.lots = entry.lots || [];
            entry.lots[idx] = entry.lots[idx] || {};
            entry.lots[idx].opened = !entry.lots[idx].opened;
            entry.updatedAt = new Date().toISOString();
            DB.entries[pid] = entry;
            await persist();
            renderProductList(zoneKey, document.getElementById('searchInput').value.trim());
          });
        });
        row.querySelectorAll('.act-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            const action = btn.dataset.action;
            const product = DB.products.find(pp => pp.id === pid);
            const entry = DB.entries[pid] || {};
            if (action === 'consume') {
              if (!confirm('사용 완료(소진) 처리할까요?')) return;
              await consumeProduct(pid);
            } else if (action === 'thawStart') {
              entry.baseDate = nowLocalInputValue();
              entry.status = '해동중';
              entry.expiryCleared = false;
              entry.updatedAt = new Date().toISOString();
              entry.safeUntil = computeSafeDate(product, entry);
              DB.entries[pid] = entry;
              await persistEntry(pid);
              SheetSync.postQC({ barcode: product.barcode, action: '해동', beforeStorage: '냉동', afterStorage: '냉장', quantity: entry.qty ?? 1, operator: '관리자' });
              toast(`${product.name} 냉장 해동 시작`);
            } else if (action === 'openStart') {
              entry.baseDate = nowLocalInputValue();
              entry.status = '개봉';
              entry.expiryCleared = false;
              entry.updatedAt = new Date().toISOString();
              entry.safeUntil = computeSafeDate(product, entry);
              DB.entries[pid] = entry;
              await persistEntry(pid);
              SheetSync.postQC({ barcode: product.barcode, action: '개봉', beforeStorage: inferStorageMethod(product.zone), afterStorage: inferStorageMethod(product.zone), quantity: entry.qty ?? 1, operator: '관리자' });
              toast(`${product.name} 개봉일 기록 · 안전보관일 시작`);
            }
            renderProductList(zoneKey, document.getElementById('searchInput').value.trim());
          });
        });
        row.querySelectorAll('.lot-consume').forEach(btn => {
          btn.addEventListener('click', async () => {
            const lotRow = btn.closest('.lot-row');
            const idx = Number(lotRow.dataset.lotIdx);
            if (!confirm('이 재고를 사용 완료 처리할까요?')) return;
            await consumeProduct(pid, idx);
            renderProductList(zoneKey, document.getElementById('searchInput').value.trim());
          });
        });
        row.querySelectorAll('.lot-del').forEach(btn => {
          btn.addEventListener('click', async () => {
            const lotRow = btn.closest('.lot-row');
            const idx = Number(lotRow.dataset.lotIdx);
            const entry = DB.entries[pid] || {};
            if (entry.lots) entry.lots.splice(idx, 1);
            DB.entries[pid] = entry;
            await persist();
            renderProductList(zoneKey, document.getElementById('searchInput').value.trim());
          });
        });
        const lotAddBtn = row.querySelector('.lot-add');
        if (lotAddBtn) lotAddBtn.addEventListener('click', async () => {
          const entry = DB.entries[pid] || {};
          entry.lots = entry.lots || [];
          entry.lots.push({ qty: null, expiry: null, opened: false });
          DB.entries[pid] = entry;
          await persist();
          renderProductList(zoneKey, document.getElementById('searchInput').value.trim());
        });
      });
    }

    /* ---------- 제품 관리 화면 ---------- */
    function renderManage(zoneKey) {
      setTitle('제품 관리', true);
      root.innerHTML = `
    <div class="zone-tabs">
      ${ZONES.map(z => `<button data-zone="${z.key}" class="${z.key === zoneKey ? 'active' : ''}">${z.label}</button>`).join('')}
    </div>
    <div class="actions" style="margin-bottom:14px;">
      <button class="primary" id="addBtn">＋ 품목 추가</button>
    </div>
    <div id="manageList"></div>
  `;
      root.querySelectorAll('[data-zone]').forEach(btn => {
        btn.addEventListener('click', () => navigate('#/manage/' + btn.dataset.zone));
      });
      document.getElementById('addBtn').addEventListener('click', () => openProductForm(zoneKey, null));
      renderManageList(zoneKey);
    }

    function renderManageList(zoneKey) {
      const listEl = document.getElementById('manageList');
      const products = productsForZone(zoneKey);
      if (products.length === 0) {
        listEl.innerHTML = `<div class="empty">등록된 품목이 없습니다.</div>`;
        return;
      }
      listEl.innerHTML = products.map(p => `
    <div class="manage-row" draggable="true" data-pid="${p.id}">
      <span class="drag-handle">⠿</span>
      <div class="info">
        <div class="n">${p.name}</div>
        <div class="m">${p.category || '기타'} · ${p.storageMethod || inferStorageMethod(p.zone)} · ${(BASIS[p.basis] || BASIS_FALLBACK).label}${(BASIS[p.basis] || BASIS_FALLBACK).calc ? ` · ${p.durationValue}${p.durationUnit === 'day' ? '일' : '시간'}` : ''}${p.basis === 'subdiv' ? ` · 통교체 ${p.containerCycleDays || DEFAULT_CONTAINER_CYCLE_DAYS}일` : ''}</div>
        ${p.barcode ? `<svg class="barcode-svg" data-code="${p.barcode}"></svg>` : ''}
      </div>
      <div class="acts">
        <button class="small edit-btn">수정</button>
        <button class="small danger del-btn">삭제</button>
      </div>
    </div>
  `).join('');
      renderBarcodeSvgs(listEl);

      let dragSrc = null;
      listEl.querySelectorAll('.manage-row').forEach(row => {
        row.addEventListener('dragstart', () => { dragSrc = row; row.classList.add('dragging'); });
        row.addEventListener('dragend', () => row.classList.remove('dragging'));
        row.addEventListener('dragover', (e) => {
          e.preventDefault();
          const rect = row.getBoundingClientRect();
          const after = (e.clientY - rect.top) > rect.height / 2;
          if (row === dragSrc) return;
          row.parentNode.insertBefore(dragSrc, after ? row.nextSibling : row);
        });
        row.addEventListener('drop', async () => {
          const ids = Array.from(listEl.querySelectorAll('.manage-row')).map(r => r.dataset.pid);
          ids.forEach((id, idx) => {
            const p = DB.products.find(p => p.id === id);
            if (p) p.order = idx;
          });
          await persist();
        });
        row.querySelector('.edit-btn').addEventListener('click', () => openProductForm(zoneKey, row.dataset.pid));
        row.querySelector('.del-btn').addEventListener('click', async () => {
          if (!confirm('이 품목을 삭제할까요?')) return;
          DB.products = DB.products.filter(p => p.id !== row.dataset.pid);
          delete DB.entries[row.dataset.pid];
          await persist();
          renderManageList(zoneKey);
        });
      });
    }

    // prefillBarcode: 스캔했지만 매칭되는 품목이 없을 때, 새 품목 등록 폼에 바코드를 미리 채워준다
    function openProductForm(zoneKey, productId, prefillBarcode) {
      const existing = productId ? DB.products.find(p => p.id === productId) : null;
      const overlay = document.createElement('div');
      overlay.className = 'overlay';
      overlay.innerHTML = `
    <div class="sheet">
      <h2>${existing ? '품목 수정' : '품목 추가'}</h2>
      <label>구역</label>
      <select id="f-zone">${ZONES.map(z => `<option value="${z.key}" ${z.key === zoneKey ? 'selected' : ''}>${z.label}</option>`).join('')}</select>

      <label>보관방법</label>
      <select id="f-storage">${STORAGE_METHODS.map(m => `<option value="${m}" ${(existing?.storageMethod || inferStorageMethod(zoneKey)) === m ? 'selected' : ''}>${m}</option>`).join('')}</select>

      <label>분류</label>
      <input list="cat-list" id="f-category" value="${existing?.category || ''}" placeholder="예: 기본 식자재">
      <datalist id="cat-list">${DEFAULT_CATEGORIES.map(c => `<option value="${c}">`).join('')}</datalist>

      <label>제품명</label>
      <input id="f-name" value="${existing?.name || ''}" placeholder="예: 에그패티">

      <label>관리기준</label>
      <select id="f-basis">
        ${Object.entries(BASIS).map(([k, v]) => `<option value="${k}" ${existing?.basis === k ? 'selected' : ''}>${v.label}</option>`).join('')}
      </select>

      <div id="f-duration-wrap" class="field-row">
        <div>
          <label>보관기간</label>
          <input id="f-duration-value" type="number" min="0" value="${existing?.durationValue ?? ''}" placeholder="예: 72">
        </div>
        <div>
          <label>단위</label>
          <select id="f-duration-unit">
            <option value="hour" ${existing?.durationUnit === 'hour' ? 'selected' : ''}>시간</option>
            <option value="day" ${existing?.durationUnit === 'day' ? 'selected' : ''}>일</option>
          </select>
        </div>
      </div>

      <div id="f-container-cycle-wrap" style="${existing?.basis === 'subdiv' ? '' : 'display:none;'}">
        <label>소분통 교체 주기(일) <span style="font-weight:400; color:var(--muted);">— 식품 소비기한과 별개로 관리됩니다</span></label>
        <input id="f-container-cycle" type="number" min="1" value="${existing?.containerCycleDays || DEFAULT_CONTAINER_CYCLE_DAYS}" placeholder="예: 7">
      </div>

      <label>기본 소비기한(선택) <span id="f-expiry-hint" style="font-weight:400; color:var(--muted);"></span></label>
      <input id="f-expiry" type="date" value="${existing?.defaultExpiry || ''}">
      <div style="font-size:0.72rem; color:var(--muted); margin-top:4px;">비워두면 보관방법 기준으로 자동 추천됩니다 (냉장 2주 / 냉동 6개월).</div>

      <label style="display:flex; align-items:center; gap:8px; margin-top:14px; cursor:pointer;">
        <input type="checkbox" id="f-stock-tracking" style="width:auto;" ${existing?.stockTracking ? 'checked' : ''}>
        <span style="font-size:0.82rem; color:var(--dim);">재고마다 수량 + 소비기한을 따로 관리 (예: 대형냉동고 원팩류처럼 입고 때마다 소비기한이 다른 품목)</span>
      </label>

      <label>바코드(선택) — 등록해두면 스캔 시 자동 인식됩니다</label>
      <div class="field-row">
        <input id="f-barcode" value="${existing?.barcode || prefillBarcode || ''}" placeholder="숫자 바코드 스캔 또는 직접 입력">
        <button type="button" class="ghost small" id="f-barcode-scan" style="flex:0 0 auto;">📷 지금 스캔</button>
      </div>
      <svg id="f-barcode-preview" class="barcode-svg"></svg>

      <div class="actions" style="margin-top:16px;">
        <button class="ghost" id="f-cancel">취소</button>
        <button class="primary" id="f-save">저장</button>
      </div>
    </div>
  `;
      document.body.appendChild(overlay);

      const basisSel = overlay.querySelector('#f-basis');
      const durWrap = overlay.querySelector('#f-duration-wrap');
      const cycleWrap = overlay.querySelector('#f-container-cycle-wrap');
      function toggleDur() {
        const b = BASIS[basisSel.value];
        durWrap.style.display = b.calc ? 'flex' : 'none';
        cycleWrap.style.display = basisSel.value === 'subdiv' ? 'block' : 'none';
      }
      basisSel.addEventListener('change', toggleDur);
      toggleDur();

      // 기본 소비기한 자동 추천: 보관방법을 바꾸면(냉장↔냉동 등) 추천값을 다시 계산해서
      // 채워준다. 단, 사용자가 직접 값을 입력해뒀다면 덮어쓰지 않는다.
      const storageSel = overlay.querySelector('#f-storage');
      const expiryFieldEl = overlay.querySelector('#f-expiry');
      const expiryHintEl = overlay.querySelector('#f-expiry-hint');
      let expiryManuallyEdited = !!(existing && existing.defaultExpiry);
      function updateExpiryHint() {
        const suggestion = suggestedDefaultExpiry(storageSel.value);
        expiryHintEl.textContent = suggestion ? `(추천 ${fmtD(suggestion)})` : '';
        if (!expiryManuallyEdited && suggestion) {
          expiryFieldEl.value = suggestion;
        }
      }
      storageSel.addEventListener('change', updateExpiryHint);
      expiryFieldEl.addEventListener('input', () => {
        expiryManuallyEdited = expiryFieldEl.value.trim() !== '';
      });
      updateExpiryHint();

      // 폼 안의 "지금 스캔" 버튼: 포커스를 바코드 입력창으로 옮겨서
      // 스캐너가 바로 이 칸에 값을 입력하도록 돕는다 (GTIN 부분만 추출해서 채움)
      const barcodeInput = overlay.querySelector('#f-barcode');
      const barcodePreview = overlay.querySelector('#f-barcode-preview');
      function updateBarcodePreview() {
        const code = barcodeInput.value.trim();
        if (!code) { barcodePreview.style.display = 'none'; return; }
        barcodePreview.style.display = 'block';
        try {
          JsBarcode(barcodePreview, code, {
            format: 'CODE128', displayValue: true, fontSize: 13, height: 32, margin: 4, lineColor: '#000'
          });
        } catch (e) { barcodePreview.style.display = 'none'; }
      }
      updateBarcodePreview();
      barcodeInput.addEventListener('input', updateBarcodePreview);
      overlay.querySelector('#f-barcode-scan').addEventListener('click', () => {
        barcodeInput.value = '';
        barcodeInput.focus();
        updateBarcodePreview();
        toast('바코드를 스캔하세요');
      });
      barcodeInput.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        const parsed = parseGS1Barcode(barcodeInput.value.trim());
        if (parsed.gtin) {
          barcodeInput.value = parsed.gtin;
          if (parsed.expiry) {
            overlay.querySelector('#f-expiry').value = parsed.expiry;
            expiryManuallyEdited = true; // 실제 스캔된 값이므로 이후 보관방법 변경으로 덮어쓰지 않음
          }
          updateBarcodePreview();
        }
      });

      overlay.querySelector('#f-cancel').addEventListener('click', () => overlay.remove());
      overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

      overlay.querySelector('#f-save').addEventListener('click', async () => {
        const name = overlay.querySelector('#f-name').value.trim();
        if (!name) { alert('제품명을 입력해주세요.'); return; }
        const zone = overlay.querySelector('#f-zone').value;
        const storageMethod = overlay.querySelector('#f-storage').value;
        const category = overlay.querySelector('#f-category').value.trim() || '기타';
        const basis = overlay.querySelector('#f-basis').value;
        const durationValue = Number(overlay.querySelector('#f-duration-value').value) || 0;
        const durationUnit = overlay.querySelector('#f-duration-unit').value;
        const containerCycleDays = basis === 'subdiv' ? (Number(overlay.querySelector('#f-container-cycle').value) || DEFAULT_CONTAINER_CYCLE_DAYS) : undefined;
        const defaultExpiry = overlay.querySelector('#f-expiry').value || null;
        const stockTracking = overlay.querySelector('#f-stock-tracking').checked;
        const barcode = overlay.querySelector('#f-barcode').value.trim() || generateBarcode();

        if (barcode) {
          const dup = DB.products.find(p => p.barcode && normalizeGtin(p.barcode) === normalizeGtin(barcode) && p.id !== productId);
          if (dup) {
            alert(`이미 '${dup.name}'에 등록된 바코드입니다.`);
            return;
          }
        }

        if (existing) {
          Object.assign(existing, { zone, storageMethod, category, name, basis, durationValue, durationUnit, containerCycleDays, defaultExpiry, stockTracking, barcode });
        } else {
          const order = DB.products.filter(p => p.zone === zone).length;
          DB.products.push({ id: uid(), zone, storageMethod, category, name, basis, durationValue, durationUnit, containerCycleDays, defaultExpiry, stockTracking, barcode, order });
        }
        await persist();
        overlay.remove();
        if (location.hash.startsWith('#/manage')) renderManage(zone);
        toast('저장됨');
      });
    }

    /* ---------- 빠른 입고 모달 ---------- */
    // 입고모드에서 스캔하면 즉시 이 모달을 띄워 [소비기한 / 수량]만 입력받는다.
    // 확인 시: 같은 소비기한의 로트가 이미 있으면 수량만 합산, 없으면 새 로트 추가.
    // 서버(INVENTORY)에도 saveInventory로 반영한다. FRZ_BIG_TOP(대형냉동-상)처럼
    // receivePriority가 걸린 구역은 모달 제목에 우선순위 표시를 덧붙인다.
    function addMonths(date, n) { const d = new Date(date); d.setMonth(d.getMonth() + n); return d; }
    function openQuickReceiveModal(product) {
      const overlay = document.createElement('div');
      overlay.className = 'overlay';
      const todayStr = todayDateOnly();
      const isPriority = !!(LOCATION_ALERT_RULES[locationCodeForZone(product.zone)] || {}).receivePriority;
      overlay.innerHTML = `
    <div class="sheet">
      <h3>${isPriority ? '⭐ ' : ''}📥 빠른 입고 — ${product.name}${isPriority ? ' <span style="font-size:0.7rem; color:var(--orange);">(입고 우선구역)</span>' : ''}</h3>
      <label>소비기한</label>
      <input type="date" id="qr-expiry" value="${todayStr}">
      <div class="actions" style="margin:8px 0;">
        <button type="button" class="small ghost" id="qr-plus1w">+1주</button>
        <button type="button" class="small ghost" id="qr-plus1m">+1달</button>
        <button type="button" class="small ghost" id="qr-nextyear">내년</button>
      </div>
      <label>수량</label>
      <input type="number" id="qr-qty" min="1" value="1">
      <div class="actions" style="margin-top:16px;">
        <button class="ghost" id="qr-cancel">취소</button>
        <button class="primary" id="qr-confirm">확인</button>
      </div>
    </div>
  `;
      document.body.appendChild(overlay);
      const expiryEl = overlay.querySelector('#qr-expiry');
      const qtyEl = overlay.querySelector('#qr-qty');
      overlay.querySelector('#qr-plus1w').addEventListener('click', () => {
        const d = new Date(expiryEl.value || todayStr); d.setDate(d.getDate() + 7);
        expiryEl.value = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      });
      overlay.querySelector('#qr-plus1m').addEventListener('click', () => {
        const d = addMonths(expiryEl.value || todayStr, 1);
        expiryEl.value = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      });
      overlay.querySelector('#qr-nextyear').addEventListener('click', () => {
        const d = new Date(expiryEl.value || todayStr); d.setFullYear(d.getFullYear() + 1);
        expiryEl.value = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      });
      overlay.querySelector('#qr-cancel').addEventListener('click', () => overlay.remove());
      overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
      overlay.querySelector('#qr-confirm').addEventListener('click', async () => {
        const expiry = expiryEl.value || null;
        const qty = Number(qtyEl.value) || 1;
        const entry = DB.entries[product.id] || {};
        entry.lots = entry.lots || [];
        const existing = entry.lots.find(l => l.expiry === expiry);
        if (existing) {
          existing.qty = (existing.qty || 0) + qty;
        } else {
          entry.lots.push({ qty, expiry, opened: false, baseDate: nowLocalInputValue() });
        }
        entry.status = entry.status || '정상';
        entry.updatedAt = new Date().toISOString();
        DB.entries[product.id] = entry;
        await persistEntry(product.id); // INVENTORY 시트에도 합계 수량으로 반영됨

        // 6단계 위치 전환 액션(receive)으로도 서버에 반영 — LOG에 입고 기록이 남고,
        // receivePriority 구역이면 res.receivePriority === true로 응답된다.
        LocationTransition.receive({
          barcode: product.barcode, productName: product.name, category: product.category,
          zoneKey: product.zone, quantity: qty, expiryDate: expiry, operator: '관리자'
        });

        overlay.remove();
        toast(`${product.name} ${qty}개 입고 완료!`);
        if (location.hash.startsWith('#/zone/' + product.zone)) {
          renderProductList(product.zone, '');
        }
      });
    }

    /* ---------- 오늘 폐기 / 만료 ---------- */
    function renderTodayList(kind) {
      const isDiscard = kind === 'discard';
      setTitle(isDiscard ? '오늘 폐기 예정' : '오늘 안전보관일 만료', true);
      const list = isDiscard ? todayDiscardList() : todayExpireList();

      root.innerHTML = `
    <div class="panel">
      <h3>${list.length}건</h3>
      <div class="actions">
        <button id="printAllBtn">🖨️ 출력</button>
      </div>
    </div>
    <div id="alertList"></div>
  `;
      const listEl = document.getElementById('alertList');
      if (list.length === 0) {
        listEl.innerHTML = `<div class="empty">해당하는 품목이 없습니다.</div>`;
      } else {
        listEl.innerHTML = list.map((item, idx) => {
          const product = item.product;
          const zone = ZONES.find(z => z.key === product.zone);
          const reason = isDiscard ? item.reason : 'safe';
          const pillHtml = (() => {
            if (reason === 'safe') {
              const status = safeStatus(item.safe, product.zone);
              const pillClass = pillClassFor(status) || 'ok';
              return `<span class="safe-pill ${pillClass}">안전 ${fmtDT(item.safe)}</span>`;
            }
            const status = expiryStatus(item.expiry);
            const pillClass = status === 'danger' ? 'danger' : status === 'warn' ? 'warn' : 'ok';
            return `<span class="safe-pill ${pillClass}">소비기한 ${fmtD(item.expiry)}</span>`;
          })();

          return `<div class="product-row" data-idx="${idx}">
        <div class="pname">
          <span>${product.name} <span class="tag">${zone?.label || ''} · ${product.category}</span></span>
          ${pillHtml}
        </div>
        ${isDiscard ? `
          <div class="actions" style="margin-top:8px;">
            <button class="small discard-btn" data-pid="${product.id}" data-reason="${reason}">🗑 폐기 처리</button>
          </div>
        ` : ''}
      </div>`;
        }).join('');
      }

      if (isDiscard) {
        listEl.querySelectorAll('.discard-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            const pid = btn.dataset.pid;
            const reason = btn.dataset.reason;
            const product = DB.products.find(p => p.id === pid);
            if (!confirm(`'${product ? product.name : ''}' 품목을 폐기 처리할까요?\n(재고 없으면 목록에서 제거되고, 시트에도 반영됩니다)`)) return;
            btn.disabled = true;
            btn.textContent = '처리중...';
            await discardProduct(pid, reason);
            renderTodayList(kind); // 목록 새로고침(처리된 품목은 사라짐)
          });
        });
      }

      document.getElementById('printAllBtn').addEventListener('click', () => {
        printText(buildAlertReceipt(isDiscard ? '오늘 폐기 예정' : '오늘 안전보관일 만료', list, isDiscard ? 'expiry' : 'safe'));
      });
    }

    /* ---------- 백업 / 복원 ---------- */
    function renderBackup() {
      setTitle('백업 / 복원', true);
      root.innerHTML = `
    <div class="panel">
      <h3>데이터 내보내기</h3>
      <p style="font-size:0.82rem; color:var(--muted);">모든 품목과 오늘 입력한 관리 기록을 JSON 파일로 저장합니다.</p>
      <div class="actions">
        <button class="primary" id="exportBtn">내보내기(JSON)</button>
      </div>
    </div>
    <div class="panel">
      <h3>데이터 가져오기</h3>
      <p style="font-size:0.82rem; color:var(--muted);">이전에 내보낸 JSON 파일을 불러옵니다. 현재 데이터는 덮어씌워집니다.</p>
      <input type="file" id="importFile" accept="application/json">
    </div>
    <div class="panel">
      <h3>프린터 테스트</h3>
      <div class="actions">
        <button id="testPrintBtn">🖨️ 테스트 출력</button>
      </div>
    </div>
  `;
      document.getElementById('exportBtn').addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `dunkin_qc_backup_${fmtNow().replace(/[: ]/g, '-')}.json`;
        a.click();
        URL.revokeObjectURL(url);
      });
      document.getElementById('importFile').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async () => {
          try {
            const parsed = JSON.parse(reader.result);
            if (!confirm('현재 데이터를 덮어쓰고 가져올까요?')) return;
            DB = { products: parsed.products || [], entries: parsed.entries || {} };
            await persist();
            toast('가져오기 완료');
          } catch (err) {
            alert('올바른 JSON 파일이 아닙니다.');
          }
        };
        reader.readAsText(file);
      });
      document.getElementById('testPrintBtn').addEventListener('click', () => {
        printText(DIV32 + '\n' + center('테스트 출력') + '\n' + DIV32 + '\n출력시간 : ' + fmtNow() + '\n한글/영문 출력 확인용입니다.\n\n\n');
      });
    }

    document.getElementById('connBtn').addEventListener('click', connectPrinter);

    // 입고모드에서의 스캔: handleScan(사용/해동/개봉 시작 신호)과는 별개로,
    // 제품을 찾아 바로 [소비기한/수량] 입력 모달을 띄운다.
    // FRZ_BIG_TOP(대형냉동-상)처럼 receivePriority가 걸린 구역 품목은
    // receiveQueue에서 항상 먼저 처리되도록 큐를 거쳐 모달을 연다.
    async function handleReceiveScan(raw) {
      const value = String(raw || '').trim();
      if (!value) return;
      const parsed = parseGS1Barcode(value);
      let gtin = parsed.gtin;
      if (!gtin && /^\d{8,14}$/.test(value)) gtin = value;
      if (!gtin) { toast('인식할 수 없는 바코드입니다'); return; }

      let product = DB.products.find(p => p.barcode && normalizeGtin(p.barcode) === normalizeGtin(gtin));
      if (!product) {
        const scanResult = await SheetSync.scanBarcode(gtin);
        if (scanResult && scanResult.success && scanResult.product) {
          const sp = scanResult.product; // MASTER_PRODUCTS 행: barcode/productName/category/storage/ruleType/days
          const currentZone = (ZONES.find(z => location.hash.includes('zone/' + z.key)) || ZONES[0]).key;
          product = {
            id: uid(), zone: currentZone, category: sp.category || '기타', name: sp.productName || gtin,
            basis: ruleTypeToBasis(sp.ruleType), durationValue: Number(sp.days) || 0,
            durationUnit: 'day', storageMethod: sp.storage || null, barcode: gtin, stockTracking: true, order: DB.products.length,
            containerCycleDays: Number(sp.containerCycleDays) || DEFAULT_CONTAINER_CYCLE_DAYS
          };
          DB.products.push(product);
          await persist();
        }
      }
      if (!product) {
        if (confirm(`등록되지 않은 바코드입니다.\n(${gtin})\n\n새 품목으로 등록하시겠습니까?`)) {
          const currentZone = (ZONES.find(z => location.hash.includes('zone/' + z.key)) || ZONES[0]).key;
          openProductForm(currentZone, null, gtin);
        }
        return;
      }
      enqueueReceive(product);
      const next = nextReceiveFromQueue();
      if (next) openQuickReceiveModal(next);
    }

    /* ---------- 전역 바코드 스캔 입력창 ---------- */
    let receiveMode = false;
    const receiveModeBtn = document.getElementById('receiveModeBtn');
    function updateReceiveModeUI() {
      receiveModeBtn.classList.toggle('primary', receiveMode);
      receiveModeBtn.textContent = receiveMode ? '📥 입고모드 ON (스캔하세요)' : '📥 빠른입고';
    }
    receiveModeBtn.addEventListener('click', () => {
      receiveMode = !receiveMode;
      updateReceiveModeUI();
      if (receiveMode) globalScanInput.focus();
    });

    const globalScanInput = document.getElementById('globalScanInput');
    globalScanInput.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const val = globalScanInput.value;
      globalScanInput.value = '';
      if (receiveMode) {
        handleReceiveScan(val);
      } else {
        handleScan(val);
      }
    });
    // 화면 어디를 클릭하든(입력 필드 제외) 스캐너 입력이 항상 이 칸으로 들어오도록 포커스 유지
    document.addEventListener('click', (e) => {
      const tag = (e.target.tagName || '').toLowerCase();
      if (['input', 'select', 'textarea', 'button', 'a'].includes(tag)) return;
      globalScanInput.focus();
    });
  </script>

  <script src="dunkin_qc_action_center.js"></script>

</body>

</html>
