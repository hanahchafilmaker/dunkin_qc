<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>던킨랜드마크시티QC</title>

  <!-- 홈 화면 아이콘 설정 (.jpg 적용) -->
  <link rel="icon" href="logo.jpg">
  <link rel="apple-touch-icon" href="logo.jpg">

  <!-- 모바일 웹앱 모드 설정 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="던킨 재고관리">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700;900&display=swap"
    rel="stylesheet">

  <script>
    // 1. Google Apps Script URL 설정
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzrenkdvwa8LqmAC_-M4HpfLLRYaT4DG3XjRedpxfpdauOmnNODasYr8x4YfU0zgQX/exec";

    // 2. 데이터 불러오기 함수
    async function loadKey(key, def) {
      try {
        const response = await fetch(`${SCRIPT_URL}?key=${key}`);
        return await response.json();
      } catch (e) {
        console.error("데이터 로드 실패:", e);
        return def;
      }
    }

  </script>

  <style>
    :root {
      --bg: #F7F5F1;
      --card: #FFFFFF;
      --ink: #2A1E16;
      --ink-soft: #8A7A6E;
      --ink-faint: #C2B6AA;
      --line: #E9E2D9;
      --accent: #E8543B;
      --accent-dark: #C43F29;
      --accent-tint: #FBE3DD;
      --caramel: #B9762F;
      --caramel-tint: #F1E6D4;
      --freezer: #3E7CB1;
      --freezer-tint: #E3EDF5;
      --safe: #2E8F5B;
      --safe-tint: #E1F1E7;
      --warn: #C98A16;
      --warn-tint: #F7ECD3;
      --danger: #C43F29;
      --danger-tint: #FBE3DD;
      --radius: 16px;
      --radius-sm: 11px;
      --shadow: 0 1px 3px rgba(42, 30, 22, 0.06), 0 1px 2px rgba(42, 30, 22, 0.04);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Noto Sans KR', sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .display {
      font-family: 'Do Hyeon', sans-serif;
      letter-spacing: 0.3px;
    }

    #app {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 16px 80px;
    }

    a {
      color: inherit;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    input,
    select,
    textarea {
      font-family: inherit;
    }

    /* ---------- topbar ---------- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg);
      padding: 16px 0 12px;
      border-bottom: 1px solid var(--line);
    }

    .topbar-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-right: auto;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--accent);
      flex: none;
    }

    .brand-text .t1 {
      font-family: 'Do Hyeon', sans-serif;
      font-size: 19px;
      line-height: 1.1;
      color: var(--ink);
    }

    .brand-text .t2 {
      font-size: 11px;
      color: var(--ink-soft);
    }

    .staff-input {
      border: 1.5px solid var(--line);
      background: var(--card);
      border-radius: 99px;
      padding: 8px 14px;
      font-size: 13px;
      width: 110px;
      color: var(--ink);
    }

    .staff-input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .search-wrap {
      position: relative;
      flex: 1 1 220px;
      min-width: 160px;
    }

    .search-wrap input {
      width: 100%;
      border: 1.5px solid var(--line);
      background: var(--card);
      border-radius: 99px;
      padding: 9px 14px;
      font-size: 14px;
      color: var(--ink);
    }

    .search-wrap input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .tabs {
      display: flex;
      gap: 6px;
      margin-top: 14px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .tab-btn {
      flex: none;
      border: none;
      background: transparent;
      color: var(--ink-soft);
      padding: 9px 14px;
      border-radius: 99px;
      font-size: 14px;
      font-weight: 500;
      transition: all .15s;
    }

    .tab-btn.active {
      background: var(--ink);
      color: #fff;
      font-weight: 700;
    }

    .tab-btn:not(.active):hover {
      background: rgba(42, 30, 22, 0.06);
    }

    /* ---------- generic ---------- */
    .section-title {
      font-family: 'Do Hyeon', sans-serif;
      font-size: 22px;
      margin: 22px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--ink-soft);
      background: var(--card);
      border-radius: var(--radius);
      border: 1.5px dashed var(--line);
    }

    .empty-state .e-icon {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .empty-state .e-title {
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 6px;
      font-size: 15px;
    }

    .btn {
      border: none;
      border-radius: 99px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform .1s, opacity .15s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-dark);
    }

    .btn-ghost {
      background: var(--card);
      color: var(--ink);
      border: 1.5px solid var(--line);
    }

    .btn-ghost:hover {
      border-color: var(--ink-faint);
    }

    .btn-danger-text {
      background: transparent;
      color: var(--danger);
      font-weight: 700;
      padding: 6px 8px;
      font-size: 12.5px;
    }

    .btn-danger-text:hover {
      text-decoration: underline;
    }

    .btn-block {
      width: 100%;
      justify-content: center;
    }

    .back-link {
      background: none;
      border: none;
      color: var(--ink-soft);
      font-size: 14px;
      font-weight: 700;
      padding: 6px 0;
      margin-bottom: 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .back-link:hover {
      color: var(--ink);
    }

    /* ---------- home: location grid ---------- */
    .loc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
      margin-top: 10px;
    }

    .loc-card {
      position: relative;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      text-align: left;
      border: none;
      overflow: hidden;
    }

    .loc-card:hover {
      box-shadow: 0 6px 18px rgba(30, 43, 39, 0.1);
    }

    .loc-strip {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
    }

    .loc-strip.g-냉장 {
      background: var(--freezer);
      opacity: 0.5;
    }

    .loc-strip.g-냉동 {
      background: var(--freezer);
    }

    .loc-strip.g-상온 {
      background: var(--caramel);
    }

    .loc-top {
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      min-height: 14px;
    }

    .loc-badge {
      background: var(--danger-tint);
      color: var(--danger);
      font-family: 'Do Hyeon', sans-serif;
      font-size: 13px;
      border-radius: 99px;
      padding: 3px 9px;
      min-width: 22px;
      text-align: center;
    }

    .loc-name {
      font-weight: 700;
      font-size: 16px;
      margin-top: 10px;
    }

    .loc-sub {
      font-size: 12.5px;
      color: var(--ink-soft);
      margin-top: 2px;
    }

    .loc-count {
      font-family: 'Do Hyeon', sans-serif;
      font-size: 26px;
      margin-top: 10px;
    }

    .loc-count span {
      font-size: 12px;
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--ink-soft);
      font-weight: 400;
    }

    .banner {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--danger-tint);
      color: #8f231c;
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: 13.5px;
      font-weight: 500;
    }

    .banner b {
      color: var(--danger);
    }

    /* ---------- lot card ---------- */
    .lot-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .lot-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .stamp {
      flex: none;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 2.5px solid currentColor;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Do Hyeon', sans-serif;
      background: #fff;
    }

    .stamp .num {
      font-size: 20px;
      line-height: 1;
      color: var(--ink);
    }

    .stamp .lbl {
      font-size: 8.5px;
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 700;
      margin-top: 1px;
      color: var(--ink-soft);
    }

    .stamp.safe {
      color: var(--safe);
    }

    .stamp.warn {
      color: var(--warn);
    }

    .stamp.danger {
      color: var(--danger);
    }

    .lot-info {
      flex: 1 1 180px;
      min-width: 140px;
    }

    .lot-name {
      font-weight: 700;
      font-size: 15.5px;
    }

    .lot-meta {
      font-size: 12.5px;
      color: var(--ink-soft);
      margin-top: 3px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status-chip {
      display: inline-block;
      background: var(--freezer-tint);
      color: var(--freezer);
      border-radius: 99px;
      padding: 2px 9px;
      font-size: 11.5px;
      font-weight: 700;
    }

    .lot-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: none;
    }

    /* ---------- forms ---------- */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 14px;
    }

    .form-grid.single {
      grid-template-columns: 1fr;
    }

    .field label {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-soft);
      margin-bottom: 5px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 14px;
      background: #fff;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      border-color: var(--accent);
    }

    .field-hint {
      font-size: 11.5px;
      color: var(--ink-faint);
      margin-top: 4px;
    }

    .flow-preview {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
      font-size: 12.5px;
    }

    .flow-step {
      background: var(--caramel-tint);
      color: var(--caramel);
      padding: 4px 10px;
      border-radius: 99px;
      font-weight: 700;
    }

    .flow-arrow {
      color: var(--ink-faint);
    }

    .product-pick-list {
      max-height: 260px;
      overflow-y: auto;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      margin-top: 6px;
    }

    .product-pick-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      font-size: 13.5px;
    }

    .product-pick-item:last-child {
      border-bottom: none;
    }

    .product-pick-item:hover {
      background: var(--accent-tint);
    }

    .product-pick-item.selected {
      background: var(--accent-tint);
      font-weight: 700;
    }

    .pp-name {
      font-weight: 700;
    }

    .pp-sub {
      font-size: 11.5px;
      color: var(--ink-soft);
    }

    .pick-btn {
      background: var(--ink);
      color: #fff;
      border: none;
      border-radius: 99px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 700;
    }

    /* ---------- product table ---------- */
    .product-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .product-row {
      background: var(--card);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .product-row .pr-main {
      flex: 1 1 200px;
    }

    .product-row .pr-name {
      font-weight: 700;
      font-size: 14.5px;
    }

    .product-row .pr-sub {
      font-size: 12px;
      color: var(--ink-soft);
      margin-top: 2px;
    }

    .flow-tag {
      background: var(--freezer-tint);
      color: var(--freezer);
      border-radius: 99px;
      padding: 3px 10px;
      font-size: 11.5px;
      font-weight: 700;
    }

    /* ---------- log ---------- */
    .log-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 12px;
    }

    .log-row {
      background: var(--card);
      border-radius: var(--radius-sm);
      padding: 11px 16px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow);
    }

    .log-action {
      font-weight: 700;
      border-radius: 99px;
      padding: 2px 10px;
      font-size: 11.5px;
      flex: none;
    }

    .log-time {
      color: var(--ink-faint);
      font-size: 11.5px;
      margin-left: auto;
      flex: none;
    }

    /* ---------- modal ---------- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(30, 43, 39, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-box {
      background: #fff;
      border-radius: var(--radius);
      padding: 22px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    .modal-title {
      font-family: 'Do Hyeon', sans-serif;
      font-size: 19px;
      margin-bottom: 6px;
    }

    .modal-sub {
      font-size: 13px;
      color: var(--ink-soft);
      margin-bottom: 14px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      color: #fff;
      padding: 11px 20px;
      border-radius: 99px;
      font-size: 13.5px;
      font-weight: 500;
      z-index: 200;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      animation: toastIn .25s ease-out;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translate(-50%, 10px);
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    .loading-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
      color: var(--ink-soft);
      gap: 10px;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3.5px solid var(--line);
      border-top-color: var(--accent);
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width:520px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .lot-actions {
        width: 100%;
        justify-content: flex-end;
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
    (function () {
      "use strict";

      /* ============ constants ============ */
      var LOCATIONS = [
        { code: 'FRG_BEV', name: '냉장(음료)', group: '냉장' },
        { code: 'FRG_HOT', name: '냉장(핫샌)', group: '냉장' },
        { code: 'FRZ_BEV', name: '냉동(음료)', group: '냉동' },
        { code: 'FRZ_HOT', name: '냉동(핫샌)', group: '냉동' },
        { code: 'FRZ_DONUT', name: '냉동(도넛)', group: '냉동' },
        { code: 'ROOM_SAUCE', name: '상온(소스)', group: '상온' },
        { code: 'ROOM_STOCK', name: '상온(재고)', group: '상온' }
      ];
      var STORAGE_CATS = [
        { code: 'SAUCE', name: '소스' },
        { code: 'POWDER', name: '파우더' },
        { code: 'HOT_SAND', name: '핫샌드' },
        { code: 'FILLING', name: '필링' },
        { code: 'DONUT_TOPPING', name: '도넛토핑' },
        { code: 'DONUT', name: '도넛' },
        { code: 'BEV_TOPPING', name: '음료토핑' },
        { code: 'BEV_BASE', name: '음료베이스' },
        { code: 'OTHER', name: '기타' }
      ];
      // fromAction: 입고 시 기록 방식 - EXPIRY(소비기한만) / OPEN(소비기한+개봉일)
      var FROM_ACTION_LABEL = { EXPIRY: '소비기한만 기록', OPEN: '소비기한 + 개봉일 기록' };
      // toAction: 전환 버튼 - EXPIRY면 전환 없음(소비기한만 계속 추적)
      var TO_ACTION_LABEL = { OPEN: '개봉', SUBDIV: '소분', THAW: '해동', EXPIRY: '전환 없음 (소비기한만 추적)' };
      var ACTION_LABEL = { OPEN: '개봉', SUBDIV: '소분', THAW: '해동' };
      var BUTTON_LABEL = { '해동': '해동 완료', '개봉': '개봉하기', '소분': '소분 완료', '소진': '소진 처리' };
      var ACTION_COLOR = {
        '입고': { bg: 'var(--freezer-tint)', c: 'var(--freezer)' },
        '해동': { bg: 'var(--warn-tint)', c: 'var(--warn)' },
        '개봉': { bg: 'var(--warn-tint)', c: 'var(--warn)' },
        '소분': { bg: 'var(--caramel-tint)', c: 'var(--caramel)' },
        '소진': { bg: 'var(--safe-tint)', c: 'var(--safe)' },
        '폐기': { bg: 'var(--danger-tint)', c: 'var(--danger)' }
      };

      function locOf(code) { for (var i = 0; i < LOCATIONS.length; i++) { if (LOCATIONS[i].code === code) return LOCATIONS[i]; } return null; }
      function storageCatOf(code) { for (var i = 0; i < STORAGE_CATS.length; i++) { if (STORAGE_CATS[i].code === code) return STORAGE_CATS[i]; } return null; }

      // 제품 정의로부터 로트의 상태 흐름(steps)을 계산.
      // 항상 [보관] -> (전환 액션, toAction!==EXPIRY일 때만) -> [소진] 순서.
      function stepsFor(product) {
        var steps = [{ name: '보관', location: product.fromLocation }];
        if (product.toAction && product.toAction !== 'EXPIRY') {
          steps.push({
            name: ACTION_LABEL[product.toAction] || product.toAction,
            location: product.toLocation || product.fromLocation,
            days: product.safeUntil
          });
        }
        steps.push({ name: '소진', location: null });
        return steps;
      }

      /* ============ state ============ */
      var state = {
        view: 'home',
        currentLocation: null,
        products: [],
        inventory: [],
        log: [],
        staffName: '',
        loading: true,
        receiveSelected: null,
        receiveFilter: '',
        editingProduct: null,
        modal: null // {type:'discard', lot} 
      };

      /* ============ storage helpers ============ */

      async function loadKey(key, def) {
        try {
          const res = await fetch(
            SCRIPT_URL +
            "?action=get&key=" +
            encodeURIComponent(key)
          );

          const data = await res.json();

          if (
            !data ||
            data.value === undefined ||
            data.value === null ||
            data.value === ""
          ) {
            return def;
          }

          return JSON.parse(data.value);

        } catch (e) {
          console.error("load failed", key, e);
          return def;
        }
      }

      async function saveKey(key, value) {
        try {

          const res = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
              action: "set",
              key: key,
              value: JSON.stringify(value)
            })
          });

          const data = await res.json();

          if (!data.ok) {
            throw new Error("save failed");
          }

          return true;

        } catch (e) {
          console.error("save failed", key, e);
          return false;
        }
      }

      async function loadAll() {
        state.loading = true;
        render();

        var results = await Promise.all([
          loadKey('products', []),
          loadKey('inventory', []),
          loadKey('actionlog', []),
          loadKey('staffName', '')
        ]);

        state.products = results[0];
        state.inventory = results[1];
        state.log = results[2];
        state.staffName = results[3];

        state.loading = false;
        render();
      }

      /* ============ date helpers ============ */
      function pad(n) { return String(n).padStart(2, '0'); }
      function fmtLocal(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
      function todayStr() { return fmtLocal(new Date()); }
      function nowTimeStr() {
        var d = new Date();
        return fmtLocal(d) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
      }
      function addDays(dateStr, days) {
        var d = new Date(dateStr + 'T00:00:00');
        d.setDate(d.getDate() + Number(days || 0));
        return fmtLocal(d);
      }
      function daysLeft(dateStr) {
        if (!dateStr) return null;
        var target = new Date(dateStr + 'T00:00:00');
        var now = new Date();
        var n = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        return Math.round((target - n) / 86400000);
      }
      function deadlineOf(lot) {
        if (lot.expiry && lot.safeUntil) { return lot.expiry < lot.safeUntil ? lot.expiry : lot.safeUntil; }
        return lot.expiry || lot.safeUntil;
      }
      function urgency(dLeft) {
        if (dLeft === null) return 'safe';
        if (dLeft < 0) return 'danger';
        if (dLeft <= 1) return 'warn';
        return 'safe';
      }
      function urgencyText(dLeft) {
        if (dLeft === null) return '-';
        if (dLeft < 0) return (dLeft * -1) + '일 초과';
        if (dLeft === 0) return '오늘까지';
        return dLeft + '일 남음';
      }
      function stampNum(dLeft) {
        if (dLeft === null) return '-';
        if (dLeft < 0) return '+' + (dLeft * -1);
        return String(dLeft);
      }

      function uid(prefix) { return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

      /* ============ business logic ============ */
      function productByBarcode(bc) {
        for (var i = 0; i < state.products.length; i++) { if (state.products[i].barcode === bc) return state.products[i]; }
        return null;
      }

      async function receiveStock(product, qty, expiry, openDate, locationOverride) {
        var steps = stepsFor(product);
        var base = todayStr();
        var lot = {
          lotId: uid('LOT'),
          barcode: product.barcode,
          productName: product.productName,
          qty: Number(qty),
          location: locationOverride || product.fromLocation,
          status: steps[0].name,
          baseDate: base,
          safeUntil: '',
          expiry: expiry || '',
          openDate: product.fromAction === 'OPEN' ? (openDate || base) : '',
          createdAt: nowTimeStr()
        };
        state.inventory.push(lot);
        await saveKey('inventory', state.inventory, true);
        await pushLog(lot, '입고', '수량 ' + qty + '개 · ' + (locOf(lot.location) ? locOf(lot.location).name : lot.location));
        showToast(product.productName + ' 입고 완료');
      }

      async function advanceLot(lot) {
        var product = productByBarcode(lot.barcode);
        if (!product) { showToast('제품 정보를 찾을 수 없어요'); return; }
        var steps = stepsFor(product);
        var idx = steps.findIndex(function (s) { return s.name === lot.status; });
        var next = steps[idx + 1];
        if (!next) return;
        if (next.name === '소진') {
          state.inventory = state.inventory.filter(function (l) { return l.lotId !== lot.lotId; });
          await saveKey('inventory', state.inventory, true);
          await pushLog(lot, '소진', '');
          showToast(lot.productName + ' 소진 처리됨');
          return;
        }
        lot.status = next.name;
        if (next.location) lot.location = next.location;
        lot.baseDate = todayStr();
        lot.safeUntil = addDays(lot.baseDate, next.days);
        await saveKey('inventory', state.inventory, true);
        await pushLog(lot, next.name, '');
        showToast(lot.productName + ' → ' + next.name);
      }

      async function discardLot(lot, note) {
        state.inventory = state.inventory.filter(function (l) { return l.lotId !== lot.lotId; });
        await saveKey('inventory', state.inventory, true);
        await pushLog(lot, '폐기', note || '');
        showToast(lot.productName + ' 폐기 처리됨');
      }

      async function pushLog(lot, action, note) {
        state.log.unshift({
          time: nowTimeStr(),
          lotId: lot.lotId,
          productName: lot.productName,
          action: action,
          user: state.staffName || '미입력',
          note: note || ''
        });
        if (state.log.length > 500) state.log = state.log.slice(0, 500);
        await saveKey('actionlog', state.log, true);
      }

      async function saveProduct(p) {
        var idx = state.products.findIndex(function (x) { return x.barcode === p.barcode; });
        if (idx >= 0) { state.products[idx] = p; } else { state.products.push(p); }
        await saveKey('products', state.products, true);
        showToast('제품이 저장되었어요');
      }
      async function deleteProduct(barcode) {
        state.products = state.products.filter(function (p) { return p.barcode !== barcode; });
        await saveKey('products', state.products, true);
        showToast('제품이 삭제되었어요');
      }

      /* ---------- CSV bulk import ---------- */
      // 헤더: barcode, storage, productName, fromLocation, toLocation, fromAction, toAction, safeUntil
      function parseCsvText(text) {
        var lines = String(text || '').split(/\r\n|\r|\n/).filter(function (l) { return l.trim().length > 0; });
        if (lines.length < 2) return { rows: [], errors: ['헤더와 데이터가 최소 1줄씩 필요해요.'] };
        var delim = lines[0].indexOf('\t') >= 0 ? '\t' : ',';
        var headers = lines[0].split(delim).map(function (h) { return h.trim(); });
        var rows = [], errors = [];
        for (var i = 1; i < lines.length; i++) {
          var cols = lines[i].split(delim);
          var obj = {};
          headers.forEach(function (h, idx) { obj[h] = (cols[idx] || '').trim(); });
          if (!obj.barcode) { errors.push('줄 ' + (i + 1) + ': 바코드가 없어 건너뜀'); continue; }
          var toAction = obj.toAction || 'EXPIRY';
          var fromAction = obj.fromAction || 'EXPIRY';
          var p = {
            barcode: String(obj.barcode),
            storage: obj.storage || 'OTHER',
            productName: obj.productName || obj.barcode,
            fromLocation: obj.fromLocation || '',
            toLocation: obj.toLocation || '',
            fromAction: fromAction,
            toAction: toAction,
            safeUntil: (toAction !== 'EXPIRY' && obj.safeUntil) ? Number(obj.safeUntil) : null
          };
          if (!locOf(p.fromLocation)) errors.push('줄 ' + (i + 1) + ' (' + p.barcode + '): fromLocation 코드가 올바르지 않아요 - "' + p.fromLocation + '"');
          if (p.toLocation && !locOf(p.toLocation)) errors.push('줄 ' + (i + 1) + ' (' + p.barcode + '): toLocation 코드가 올바르지 않아요 - "' + p.toLocation + '"');
          if (p.toAction !== 'EXPIRY' && !p.safeUntil) errors.push('줄 ' + (i + 1) + ' (' + p.barcode + '): toAction이 ' + p.toAction + '인데 safeUntil(일수)이 없어요');
          rows.push(p);
        }
        return { rows: rows, errors: errors };
      }

      async function importProducts(rows) {
        var added = 0, updated = 0;
        rows.forEach(function (p) {
          var idx = state.products.findIndex(function (x) { return x.barcode === p.barcode; });
          if (idx >= 0) { state.products[idx] = p; updated++; } else { state.products.push(p); added++; }
        });
        await saveKey('products', state.products, true);
        showToast('가져오기 완료: 신규 ' + added + '건 · 수정 ' + updated + '건');
      }

      /* ============ toast ============ */
      var toastTimer = null;
      function showToast(msg) {
        var old = document.querySelector('.toast');
        if (old) old.remove();
        var t = document.createElement('div');
        t.className = 'toast';
        t.textContent = msg;
        document.body.appendChild(t);
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { t.remove(); }, 2600);
      }

      /* ============ render ============ */
      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
          }[c];
        });
      }

      function render() {
        var app = document.getElementById('app');
        if (state.loading) {
          app.innerHTML = topbarHtml() + '<div class="loading-wrap"><div class="spinner"></div><div>재고 데이터를 불러오는 중...</div></div>';
          attachTopbarListeners();
          return;
        }
        var body = '';
        if (state.view === 'home') body = renderHome();
        else if (state.view === 'location') body = renderLocationDetail();
        else if (state.view === 'receive') body = renderReceive();
        else if (state.view === 'products') body = renderProducts();
        else if (state.view === 'log') body = renderLog();
        app.innerHTML = topbarHtml() + body;
        attachTopbarListeners();
        attachViewListeners();
        if (state.modal) renderModal();
      }

      function topbarHtml() {
        var tabs = [
          ['home', '재고현황'], ['receive', '입고'], ['products', '제품관리'], ['log', '기록']
        ];
        var tabsHtml = tabs.map(function (t) {
          return '<button class="tab-btn ' + (state.view === t[0] ? 'active' : '') + '" data-nav="' + t[0] + '">' + t[1] + '</button>';
        }).join('');
        return '' +
          '<div class="topbar">' +
          '<div class="topbar-row">' +
          '<div class="brand">' +
          '<div class="brand-mark"></div>' +
          '<div class="brand-text"><div class="t1">던킨랜드마크시티QC</div><div class="t2">위치 · 상태 · 유통기한 한눈에</div></div>' +
          '</div>' +
          '<input class="staff-input" id="staffNameInput" placeholder="담당자 이름" value="' + esc(state.staffName) + '" maxlength="10">' +
          '<div class="search-wrap"><input id="headerSearch" placeholder="바코드/제품명 검색 후 Enter" value="' + (state.view === 'receive' ? esc(state.receiveFilter) : '') + '"></div>' +
          '</div>' +
          '<div class="tabs">' + tabsHtml + '</div>' +
          '</div>';
      }

      /* ---------- home ---------- */
      function renderHome() {
        var urgentTotal = 0;
        var cards = LOCATIONS.map(function (loc) {
          var lots = state.inventory.filter(function (l) { return l.location === loc.code; });
          var urgentCount = lots.filter(function (l) { return urgency(daysLeft(deadlineOf(l))) !== 'safe'; }).length;
          urgentTotal += urgentCount;
          return '' +
            '<button class="loc-card" data-nav="location" data-loc="' + loc.code + '">' +
            '<div class="loc-strip g-' + loc.group + '"></div>' +
            '<div class="loc-top">' +
            (urgentCount > 0 ? '<div class="loc-badge">' + urgentCount + '</div>' : '<div></div>') +
            '</div>' +
            '<div class="loc-name">' + loc.name + '</div>' +
            '<div class="loc-sub">' + loc.group + ' 구역</div>' +
            '<div class="loc-count">' + lots.length + '<span> 개 로트</span></div>' +
            '</button>';
        }).join('');

        var banner = urgentTotal > 0
          ? '<div class="banner"><span>지금 <b>' + urgentTotal + '건</b>의 재고가 유통기한 임박 또는 초과 상태예요. 위치를 눌러 확인하세요.</span></div>'
          : '';

        return '' +
          banner +
          '<div class="section-title">보관 위치</div>' +
          '<div class="loc-grid">' + cards + '</div>';
      }

      /* ---------- location detail ---------- */
      function renderLocationDetail() {
        var loc = locOf(state.currentLocation);
        if (!loc) return '<div class="empty-state">위치를 찾을 수 없어요.</div>';
        var lots = state.inventory.filter(function (l) { return l.location === loc.code; });
        lots.sort(function (a, b) {
          var da = daysLeft(deadlineOf(a)); var db = daysLeft(deadlineOf(b));
          return (da === null ? 999 : da) - (db === null ? 999 : db);
        });

        var list = '';
        if (lots.length === 0) {
          list = '<div class="empty-state"><div class="e-title">이 위치엔 재고가 없어요</div>' +
            '<div style="margin-bottom:14px;">입고를 눌러 새 재고를 등록하세요.</div>' +
            '<button class="btn btn-primary" data-nav="receive" data-preset-loc="' + loc.code + '">입고하기</button></div>';
        } else {
          list = '<div class="lot-list">' + lots.map(function (l) {
            var dl = daysLeft(deadlineOf(l));
            var urg = urgency(dl);
            var product = productByBarcode(l.barcode);
            var btn = '';
            if (product) {
              var steps = stepsFor(product);
              var idx = steps.findIndex(function (s) { return s.name === l.status; });
              var next = steps[idx + 1];
              if (next) btn = '<button class="btn btn-primary" data-action="advance" data-lot="' + l.lotId + '">' + (BUTTON_LABEL[next.name] || next.name) + '</button>';
            }
            return '' +
              '<div class="lot-card">' +
              '<div class="stamp ' + urg + '"><div class="num">' + stampNum(dl) + '</div><div class="lbl">' + (dl !== null && dl < 0 ? '일 초과' : '일 남음') + '</div></div>' +
              '<div class="lot-info">' +
              '<div class="lot-name">' + esc(l.productName) + '</div>' +
              '<div class="lot-meta">' +
              '<span class="status-chip">' + l.status + '</span>' +
              '<span>수량 ' + l.qty + '개</span>' +
              '<span>' + urgencyText(dl) + ' (' + deadlineOf(l) + ')</span>' +
              '</div>' +
              '</div>' +
              '<div class="lot-actions">' +
              btn +
              '<button class="btn-danger-text" data-action="discard" data-lot="' + l.lotId + '">폐기</button>' +
              '</div>' +
              '</div>';
          }).join('') + '</div>';
        }

        return '' +
          '<button class="back-link" data-nav="home">← 위치 목록</button>' +
          '<div class="section-title">' + loc.name + '</div>' +
          list;
      }

      /* ---------- receive ---------- */
      function renderReceive() {
        var filter = (state.receiveFilter || '').trim().toLowerCase();
        var filtered = state.products.filter(function (p) {
          if (!filter) return true;

          const productName = String(p.productName || '').toLowerCase();
          const barcode = String(p.barcode || '').toLowerCase();

          return (
            productName.indexOf(filter) >= 0 ||
            barcode.indexOf(filter) >= 0
          );
        });

        if (state.products.length === 0) {
          return '' +
            '<div class="section-title">입고</div>' +
            '<div class="empty-state"><div class="e-title">등록된 제품이 없어요</div>' +
            '<div style="margin-bottom:14px;">제품관리에서 먼저 제품을 등록해주세요.</div>' +
            '<button class="btn btn-primary" data-nav="products">제품 등록하러 가기</button></div>';
        }

        var sel = state.receiveSelected ? productByBarcode(state.receiveSelected) : null;
        var pickList = '<div class="product-pick-list">' +
          (filtered.length === 0 ? '<div style="padding:16px; color:var(--ink-soft); font-size:13.5px;">검색 결과가 없어요.</div>' :
            filtered.map(function (p) {
              var isSel = sel && sel.barcode === p.barcode;
              return '<div class="product-pick-item ' + (isSel ? 'selected' : '') + '" data-action="pick-product" data-barcode="' + esc(p.barcode) + '">' +
                '<div><div class="pp-name">' + esc(p.productName) + '</div><div class="pp-sub">' + esc(p.barcode) + ' · ' + esc(locOf(p.fromLocation) ? locOf(p.fromLocation).name : p.fromLocation) + ' · ' + (TO_ACTION_LABEL[p.toAction] || p.toAction) + '</div></div>' +
                '<button class="pick-btn" data-action="pick-product" data-barcode="' + esc(p.barcode) + '">' + (isSel ? '선택됨' : '선택') + '</button>' +
                '</div>';
            }).join('')) +
          '</div>';

        var formHtml = '';
        if (sel) {
          var steps = stepsFor(sel);
          var needOpenDate = sel.fromAction === 'OPEN';
          formHtml = '' +
            '<div class="card" style="margin-top:16px;">' +
            '<div style="font-weight:700; font-size:15px; margin-bottom:2px;">' + esc(sel.productName) + ' 입고 등록</div>' +
            '<div class="flow-preview">' + steps.map(function (s, i) { return (i > 0 ? '<span class="flow-arrow">→</span>' : '') + '<span class="flow-step">' + s.name + '</span>'; }).join('') + '</div>' +
            '<form id="receiveForm" class="form-grid">' +
            '<div class="field"><label>수량</label><input type="number" name="qty" min="1" value="1" required></div>' +
            '<div class="field"><label>보관 위치</label><select name="location">' +
            LOCATIONS.map(function (l) { return '<option value="' + l.code + '" ' + (l.code === sel.fromLocation ? 'selected' : '') + '>' + l.name + '</option>'; }).join('') +
            '</select></div>' +
            '<div class="field"><label>제품 표기 소비기한</label><input type="date" name="expiry"></div>' +
            (needOpenDate ? '<div class="field"><label>개봉일</label><input type="date" name="openDate" value="' + todayStr() + '"></div>' : '') +
            '<div class="field"><label>전환 시 기준일수</label><input type="text" value="' + (sel.toAction === 'EXPIRY' ? '전환 없음 (소비기한만 추적)' : (sel.safeUntil + '일 (' + (ACTION_LABEL[sel.toAction] || sel.toAction) + ' 시점부터)')) + '" disabled></div>' +
            '<div class="field" style="grid-column:1/-1;"><button type="submit" class="btn btn-primary btn-block">입고 등록</button></div>' +
            '</form>' +
            '</div>';
        }

        return '' +
          '<div class="section-title">입고</div>' +
          '<div class="card"><div class="field"><label>제품 검색</label><input id="receiveFilterInput" placeholder="제품명 또는 바코드로 검색" value="' + esc(state.receiveFilter || '') + '"></div>' + pickList + '</div>' +
          formHtml;
      }

      /* ---------- products ---------- */
      function renderProducts() {
        var editing = state.editingProduct; // null | {} for new | product obj for edit
        var listHtml = state.products.length === 0
          ? '<div class="empty-state"><div class="e-title">등록된 제품이 없어요</div><div>아래에서 첫 제품을 등록하거나 CSV로 가져와보세요.</div></div>'
          : '<div class="product-list">' + state.products.map(function (p) {
            var locText = (locOf(p.fromLocation) ? locOf(p.fromLocation).name : p.fromLocation) + ((p.toLocation && p.toAction !== 'EXPIRY') ? (' → ' + (locOf(p.toLocation) ? locOf(p.toLocation).name : p.toLocation)) : '');
            var fromShort = p.fromAction === 'OPEN' ? '개봉기록' : '소비기한';
            var actionText = (p.toAction === 'EXPIRY') ? '전환 없음 (소비기한만)' : fromShort + ' → ' + (ACTION_LABEL[p.toAction] || p.toAction) + ' (' + p.safeUntil + '일)';
            return '<div class="product-row">' +
              '<div class="pr-main"><div class="pr-name">' + esc(p.productName) + '</div><div class="pr-sub">' + esc(p.barcode) + ' · ' + esc(storageCatOf(p.storage) ? storageCatOf(p.storage).name : (p.storage || '미분류')) + ' · ' + esc(locText) + '</div></div>' +
              '<span class="flow-tag">' + esc(actionText) + '</span>' +
              '<button class="btn btn-ghost" data-action="edit-product" data-barcode="' + esc(p.barcode) + '">수정</button>' +
              '<button class="btn-danger-text" data-action="delete-product" data-barcode="' + esc(p.barcode) + '">삭제</button>' +
              '</div>';
          }).join('') + '</div>';

        var formHtml = '';
        if (editing) {
          var isNew = !editing.barcode;
          var storageOptions = STORAGE_CATS.map(function (s) { return '<option value="' + s.code + '" ' + (editing.storage === s.code ? 'selected' : '') + '>' + s.name + '</option>'; }).join('');
          var fromLocOptions = LOCATIONS.map(function (l) { return '<option value="' + l.code + '" ' + (editing.fromLocation === l.code ? 'selected' : '') + '>' + l.name + '</option>'; }).join('');
          var toLocOptions = '<option value="">없음 (위치 이동 없음)</option>' + LOCATIONS.map(function (l) { return '<option value="' + l.code + '" ' + (editing.toLocation === l.code ? 'selected' : '') + '>' + l.name + '</option>'; }).join('');
          var fromActionOptions = Object.keys(FROM_ACTION_LABEL).map(function (k) { return '<option value="' + k + '" ' + (editing.fromAction === k ? 'selected' : '') + '>' + FROM_ACTION_LABEL[k] + '</option>'; }).join('');
          var toActionOptions = Object.keys(TO_ACTION_LABEL).map(function (k) { return '<option value="' + k + '" ' + (editing.toAction === k ? 'selected' : '') + '>' + TO_ACTION_LABEL[k] + '</option>'; }).join('');
          formHtml = '' +
            '<div class="card" style="margin-top:16px;">' +
            '<div style="font-weight:700; font-size:15px; margin-bottom:10px;">' + (isNew ? '새 제품 등록' : '제품 수정') + '</div>' +
            '<form id="productForm" class="form-grid">' +
            '<div class="field"><label>바코드</label><input name="barcode" value="' + esc(editing.barcode || '') + '" ' + (isNew ? '' : 'readonly') + ' required></div>' +
            '<div class="field"><label>제품명</label><input name="productName" value="' + esc(editing.productName || '') + '" required></div>' +
            '<div class="field"><label>분류</label><select name="storage">' + storageOptions + '</select></div>' +
            '<div class="field"><label>입고 위치 (fromLocation)</label><select name="fromLocation">' + fromLocOptions + '</select></div>' +
            '<div class="field"><label>전환 후 위치 (toLocation, 선택)</label><select name="toLocation">' + toLocOptions + '</select></div>' +
            '<div class="field"><label>입고 시 기록</label><select name="fromAction">' + fromActionOptions + '</select></div>' +
            '<div class="field"><label>전환 액션</label><select name="toAction" id="toActionSelect">' + toActionOptions + '</select></div>' +
            '<div class="field" id="safeUntilField"><label>전환 후 안전보관 기준일수</label><input type="number" name="safeUntil" min="1" value="' + (editing.safeUntil || 3) + '"></div>' +
            '<div id="flowPreviewBox" class="field" style="grid-column:1/-1;"><label>흐름 미리보기</label><div class="flow-preview" id="flowPreviewInner"></div></div>' +
            '<div class="field" style="grid-column:1/-1; display:flex; gap:8px;">' +
            '<button type="submit" class="btn btn-primary">저장</button>' +
            '<button type="button" class="btn btn-ghost" data-action="cancel-edit-product">취소</button>' +
            '</div>' +
            '</form>' +
            '</div>';
        }

        return '' +
          '<div class="section-title">제품관리</div>' +
          (editing ? '' : '<div style="display:flex; gap:8px; margin-bottom:14px;">' +
            '<button class="btn btn-primary" data-action="new-product">새 제품 등록</button>' +
            '<button class="btn btn-ghost" data-action="open-import">CSV로 일괄 등록</button>' +
            '</div>') +
          listHtml +
          formHtml;
      }

      /* ---------- log ---------- */
      function renderLog() {
        if (state.log.length === 0) {
          return '<div class="section-title">기록</div><div class="empty-state"><div class="e-title">아직 기록이 없어요</div><div>입고, 해동, 소진 등의 작업이 여기 쌓여요.</div></div>';
        }
        var rows = state.log.slice(0, 200).map(function (e) {
          var col = ACTION_COLOR[e.action] || { bg: 'var(--line)', c: 'var(--ink-soft)' };
          return '<div class="log-row">' +
            '<span class="log-action" style="background:' + col.bg + '; color:' + col.c + ';">' + e.action + '</span>' +
            '<span>' + esc(e.productName) + '</span>' +
            (e.note ? '<span style="color:var(--ink-soft);">· ' + esc(e.note) + '</span>' : '') +
            '<span style="color:var(--ink-faint);">by ' + esc(e.user) + '</span>' +
            '<span class="log-time">' + e.time + '</span>' +
            '</div>';
        }).join('');
        return '<div class="section-title">기록</div><div class="log-list">' + rows + '</div>';
      }

      /* ---------- modal ---------- */
      function renderModal() {
        var overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.id = 'modalOverlay';
        if (state.modal.type === 'discard') {
          var lot = state.modal.lot;
          overlay.innerHTML = '' +
            '<div class="modal-box">' +
            '<div class="modal-title">' + esc(lot.productName) + ' 폐기</div>' +
            '<div class="modal-sub">폐기 사유를 남기면 기록에 함께 저장돼요. (선택)</div>' +
            '<textarea id="discardNote" rows="3" style="width:100%; border:1.5px solid var(--line); border-radius:12px; padding:10px;" placeholder="예: 유통기한 초과, 파손 등"></textarea>' +
            '<div class="modal-actions">' +
            '<button class="btn btn-ghost btn-block" data-action="close-modal">취소</button>' +
            '<button class="btn btn-primary btn-block" data-action="confirm-discard" data-lot="' + lot.lotId + '">폐기 확정</button>' +
            '</div>' +
            '</div>';
        }
        if (state.modal.type === 'import') {
          overlay.innerHTML = '' +
            '<div class="modal-box" style="max-width:640px;">' +
            '<div class="modal-title">제품 CSV 일괄 등록</div>' +
            '<div class="modal-sub">탭 또는 쉼표로 구분된 표를 붙여넣으세요. 첫 줄은 헤더입니다: barcode, storage, productName, fromLocation, toLocation, fromAction, toAction, safeUntil (바코드가 같으면 기존 제품을 덮어써요)</div>' +
            '<textarea id="csvInput" rows="10" style="width:100%; font-family:monospace; font-size:11.5px; border:1.5px solid var(--line); border-radius:12px; padding:10px;" placeholder="barcode&#9;storage&#9;productName&#9;fromLocation&#9;toLocation&#9;fromAction&#9;toAction&#9;safeUntil"></textarea>' +
            '<div id="csvPreview" style="margin-top:10px; font-size:12.5px; color:var(--ink-soft); max-height:140px; overflow-y:auto;"></div>' +
            '<div class="modal-actions">' +
            '<button class="btn btn-ghost btn-block" data-action="close-modal">취소</button>' +
            '<button class="btn btn-primary btn-block" data-action="confirm-import">가져오기</button>' +
            '</div>' +
            '</div>';
        }
        document.body.appendChild(overlay);
        overlay.addEventListener('click', function (e) { if (e.target === overlay) { state.modal = null; overlay.remove(); } });

        var closeModalBtn = overlay.querySelector('[data-action="close-modal"]');
        if (closeModalBtn) { closeModalBtn.addEventListener('click', function () { state.modal = null; render(); }); }

        var confirmDiscardBtn = overlay.querySelector('[data-action="confirm-discard"]');
        if (confirmDiscardBtn) {
          confirmDiscardBtn.addEventListener('click', async function () {
            var lot = state.inventory.find(function (l) { return l.lotId === confirmDiscardBtn.getAttribute('data-lot'); });
            var note = document.getElementById('discardNote') ? document.getElementById('discardNote').value : '';
            state.modal = null;
            if (lot) await discardLot(lot, note);
            render();
          });
        }

        var csvInput = document.getElementById('csvInput');
        if (csvInput) {
          csvInput.addEventListener('input', function () {
            var res = parseCsvText(csvInput.value);
            var preview = document.getElementById('csvPreview');
            var msg = res.rows.length + '개 행 인식됨.';
            if (res.errors.length) msg += ' 오류 ' + res.errors.length + '건: ' + res.errors.slice(0, 5).join(' / ');
            preview.textContent = msg;
          });
        }
        var confirmImportBtn = overlay.querySelector('[data-action="confirm-import"]');
        if (confirmImportBtn) {
          confirmImportBtn.addEventListener('click', async function () {
            var ta = document.getElementById('csvInput');
            var res = parseCsvText(ta ? ta.value : '');
            if (res.rows.length === 0) { showToast('가져올 수 있는 행이 없어요'); return; }
            if (res.errors.length > 0) {
              if (!confirm(res.errors.length + '건의 오류가 있어요. 오류가 없는 ' + res.rows.length + '건만 가져올까요?\n\n' + res.errors.slice(0, 8).join('\n'))) return;
            }
            state.modal = null;
            await importProducts(res.rows);
            render();
          });
        }
      }

      /* ============ listeners ============ */
      function attachTopbarListeners() {
        var app = document.getElementById('app');
        app.querySelectorAll('[data-nav]').forEach(function (el) {
          el.addEventListener('click', function () {
            var view = el.getAttribute('data-nav');
            if (view === 'location') { state.currentLocation = el.getAttribute('data-loc'); }
            if (el.hasAttribute('data-preset-loc')) {
              state.view = 'receive'; render(); return;
            }
            state.view = view;
            if (view !== 'products') state.editingProduct = null;
            render();
          });
        });
        var staffInput = document.getElementById('staffNameInput');
        if (staffInput) {
          staffInput.addEventListener('change', async function () {
            state.staffName = staffInput.value.trim();
            await saveKey('staffName', state.staffName, false);
            showToast('담당자 이름이 저장되었어요');
          });
        }
        var searchInput = document.getElementById('headerSearch');
        if (searchInput) {
          searchInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
              state.view = 'receive';
              state.receiveFilter = searchInput.value;
              render();
            }
          });
        }
      }

      function attachViewListeners() {
        var app = document.getElementById('app');

        // location detail actions
        app.querySelectorAll('[data-action="advance"]').forEach(function (btn) {
          btn.addEventListener('click', async function () {
            var lot = state.inventory.find(function (l) { return l.lotId === btn.getAttribute('data-lot'); });
            if (lot) await advanceLot(lot);
            render();
          });
        });
        app.querySelectorAll('[data-action="discard"]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var lot = state.inventory.find(function (l) { return l.lotId === btn.getAttribute('data-lot'); });
            if (lot) { state.modal = { type: 'discard', lot: lot }; render(); }
          });
        });

        // receive view
        var filterInput = document.getElementById('receiveFilterInput');
        if (filterInput) {
          filterInput.addEventListener('input', function () {
            state.receiveFilter = filterInput.value;
            render();
            var el = document.getElementById('receiveFilterInput');
            if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
          });
        }
        app.querySelectorAll('[data-action="pick-product"]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            state.receiveSelected = btn.getAttribute('data-barcode');
            render();
          });
        });
        var receiveForm = document.getElementById('receiveForm');
        if (receiveForm) {
          receiveForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            var fd = new FormData(receiveForm);
            var product = productByBarcode(state.receiveSelected);
            if (!product) return;
            await receiveStock(product, fd.get('qty'), fd.get('expiry'), fd.get('openDate'), fd.get('location'));
            state.receiveSelected = null;
            render();
          });
        }

        // products view
        var newBtn = app.querySelector('[data-action="new-product"]');
        if (newBtn) {
          newBtn.addEventListener('click', function () {
            state.editingProduct = { barcode: '', productName: '', storage: 'OTHER', fromLocation: LOCATIONS[0].code, toLocation: '', fromAction: 'EXPIRY', toAction: 'OPEN', safeUntil: 3 };
            render();
          });
        }
        var importBtn = app.querySelector('[data-action="open-import"]');
        if (importBtn) {
          importBtn.addEventListener('click', function () { state.modal = { type: 'import' }; render(); });
        }
        app.querySelectorAll('[data-action="edit-product"]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var p = productByBarcode(btn.getAttribute('data-barcode'));
            if (p) { state.editingProduct = Object.assign({}, p); render(); }
          });
        });
        app.querySelectorAll('[data-action="delete-product"]').forEach(function (btn) {
          btn.addEventListener('click', async function () {
            var bc = btn.getAttribute('data-barcode');
            if (confirm('이 제품을 삭제할까요? 기존 재고 로트에는 영향이 없어요.')) {
              await deleteProduct(bc);
              render();
            }
          });
        });
        var cancelEdit = app.querySelector('[data-action="cancel-edit-product"]');
        if (cancelEdit) { cancelEdit.addEventListener('click', function () { state.editingProduct = null; render(); }); }

        var toActionSelect = document.getElementById('toActionSelect');
        function updateProductPreview() {
          var form = document.getElementById('productForm');
          if (!form) return;
          var fd = new FormData(form);
          var draft = {
            fromLocation: fd.get('fromLocation'),
            toLocation: fd.get('toLocation'),
            toAction: fd.get('toAction'),
            safeUntil: Number(fd.get('safeUntil')) || 1
          };
          var box = document.getElementById('flowPreviewInner');
          if (box) {
            var steps = stepsFor(draft);
            box.innerHTML = steps.map(function (s, i) { return (i > 0 ? '<span class="flow-arrow">→</span>' : '') + '<span class="flow-step">' + s.name + '</span>'; }).join('');
          }
          var safeUntilField = document.getElementById('safeUntilField');
          if (safeUntilField) {
            safeUntilField.style.display = (draft.toAction === 'EXPIRY') ? 'none' : 'block';
          }
        }
        if (toActionSelect) { toActionSelect.addEventListener('change', updateProductPreview); }
        var fromLocSelect = document.querySelector('#productForm select[name="fromLocation"]');
        var toLocSelect = document.querySelector('#productForm select[name="toLocation"]');
        if (fromLocSelect) { fromLocSelect.addEventListener('change', updateProductPreview); }
        if (toLocSelect) { toLocSelect.addEventListener('change', updateProductPreview); }
        if (document.getElementById('flowPreviewInner')) updateProductPreview();

        var productForm = document.getElementById('productForm');
        if (productForm) {
          productForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            var fd = new FormData(productForm);
            var barcode = (fd.get('barcode') || '').trim();
            if (!barcode) { showToast('바코드를 입력해주세요'); return; }
            var toAction = fd.get('toAction');
            var p = {
              barcode: String(barcode),
              productName: (fd.get('productName') || '').trim(),
              storage: fd.get('storage'),
              fromLocation: fd.get('fromLocation'),
              toLocation: fd.get('toLocation') || '',
              fromAction: fd.get('fromAction'),
              toAction: toAction,
              safeUntil: toAction === 'EXPIRY' ? null : (Number(fd.get('safeUntil')) || 1)
            };
            await saveProduct(p);
            state.editingProduct = null;
            render();
          });
        }
      }

      /* ============ init ============ */
      loadAll();
    })();
  </script>
</body>

</html>
