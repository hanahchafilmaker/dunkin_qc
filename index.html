<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>던킨랜드마크시티QC</title>

  <!-- 홈 화면 아이콘 설정 (.jpg 적용) -->
  <link rel="icon" href="logo.jpg">
  <link rel="apple-touch-icon" href="logo.jpg">

  <!-- 모바일 웹앱 모드 설정 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="던킨 재고관리">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700;900&display=swap"
    rel="stylesheet">

  <script>
    // 1. Google Apps Script URL 설정
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzrenkdvwa8LqmAC_-M4HpfLLRYaT4DG3XjRedpxfpdauOmnNODasYr8x4YfU0zgQX/exec";
  </script>

  <style>
    :root {
      --bg: #F7F5F1;
      --card: #FFFFFF;
      --ink: #2A1E16;
      --ink-soft: #8A7A6E;
      --ink-faint: #C2B6AA;
      --line: #E9E2D9;
      --accent: #E8543B;
      --accent-dark: #C43F29;
      --accent-tint: #FBE3DD;
      --caramel: #B9762F;
      --caramel-tint: #F1E6D4;
      --freezer: #3E7CB1;
      --freezer-tint: #E3EDF5;
      --safe: #2E8F5B;
      --safe-tint: #E1F1E7;
      --warn: #C98A16;
      --warn-tint: #F7ECD3;
      --danger: #C43F29;
      --danger-tint: #FBE3DD;
      --radius: 16px;
      --radius-sm: 11px;
      --shadow: 0 1px 3px rgba(42, 30, 22, 0.06), 0 1px 2px rgba(42, 30, 22, 0.04);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Noto Sans KR', sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .display {
      font-family: 'Do Hyeon', sans-serif;
      letter-spacing: 0.3px;
    }

    #app {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 16px 80px;
    }

    a {
      color: inherit;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    input,
    select,
    textarea {
      font-family: inherit;
    }

    /* ---------- topbar ---------- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg);
      padding: 12px 0 10px;
      border-bottom: 1px solid var(--line);
    }

    .topbar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .home-btn {
      flex: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--card);
      border: 1.5px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
    }

    .home-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-right: auto;
      min-width: 0;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--accent);
      flex: none;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-text .t1 {
      font-family: 'Do Hyeon', sans-serif;
      font-size: 17px;
      line-height: 1.1;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-text .t2 {
      font-size: 10.5px;
      color: var(--ink-soft);
      white-space: nowrap;
    }

    .staff-input {
      border: 1.5px solid var(--line);
      background: var(--card);
      border-radius: 99px;
      padding: 8px 14px;
      font-size: 13px;
      width: 96px;
      color: var(--ink);
    }

    .staff-input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .search-wrap {
      position: relative;
      flex: 1 1 160px;
      min-width: 120px;
    }

    .search-wrap input {
      width: 100%;
      border: 1.5px solid var(--line);
      background: var(--card);
      border-radius: 99px;
      padding: 9px 14px;
      font-size: 14px;
      color: var(--ink);
    }

    .search-wrap input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .tabs {
      display: flex;
      gap: 6px;
      margin-top: 12px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .tab-btn {
      flex: 1 1 0;
      text-align: center;
      border: none;
      background: transparent;
      color: var(--ink-soft);
      padding: 9px 10px;
      border-radius: 99px;
      font-size: 14px;
      font-weight: 500;
      transition: all .15s;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--ink);
      color: #fff;
      font-weight: 700;
    }

    .tab-btn:not(.active):hover {
      background: rgba(42, 30, 22, 0.06);
    }

    /* ---------- generic ---------- */
    .section-title {
      font-family: 'Do Hyeon', sans-serif;
      font-size: 22px;
      margin: 22px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--ink-soft);
      background: var(--card);
      border-radius: var(--radius);
      border: 1.5px dashed var(--line);
    }

    .empty-state .e-icon {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .empty-state .e-title {
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 6px;
      font-size: 15px;
    }

    .btn {
      border: none;
      border-radius: 99px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform .1s, opacity .15s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-dark);
    }

    .btn-ghost {
      background: var(--card);
      color: var(--ink);
      border: 1.5px solid var(--line);
    }

    .btn-ghost:hover {
      border-color: var(--ink-faint);
    }

    .btn-danger-text {
      background: transparent;
      color: var(--danger);
      font-weight: 700;
      padding: 6px 8px;
      font-size: 12.5px;
    }

    .btn-danger-text:hover {
      text-decoration: underline;
    }

    .btn-block {
      width: 100%;
      justify-content: center;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 12.5px;
    }

    .btn[disabled] {
      opacity: .45;
      cursor: not-allowed;
    }

    .btn[disabled]:active {
      transform: none;
    }

    .back-link {
      background: none;
      border: none;
      color: var(--ink-soft);
      font-size: 14px;
      font-weight: 700;
      padding: 6px 0;
      margin-bottom: 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .back-link:hover {
      color: var(--ink);
    }

    /* ---------- printer status ---------- */
    .printer-status {
      display: flex;
      align-items: center;
      gap: 7px;
      background: var(--card);
      border: 1.5px solid var(--line);
      border-radius: 99px;
      padding: 6px 10px 6px 12px;
      font-size: 12px;
      color: var(--ink-soft);
      flex: none;
    }

    .printer-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ink-faint);
      flex: none;
    }

    .printer-dot.on {
      background: var(--safe);
    }

    .printer-status button.small {
      border: none;
      background: var(--ink);
      color: #fff;
      border-radius: 99px;
      padding: 4px 10px;
      font-size: 11.5px;
      font-weight: 700;
    }

    /* ---------- home: location grid ---------- */
    .loc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
      margin-top: 10px;
    }

    .loc-card {
      position: relative;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      text-align: left;
      border: none;
      overflow: hidden;
    }

    .loc-card:hover {
      box-shadow: 0 6px 18px rgba(30, 43, 39, 0.1);
    }

    .loc-strip {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
    }

    .loc-strip.g-냉장 {
      background: var(--freezer);
      opacity: 0.5;
    }

    .loc-strip.g-냉동 {
      background: var(--freezer);
    }

    .loc-strip.g-상온 {
      background: var(--caramel);
    }

    .loc-top {
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      min-height: 14px;
    }

    .loc-badge {
      background: var(--danger-tint);
      color: var(--danger);
      font-family: 'Do Hyeon', sans-serif;
      font-size: 13px;
      border-radius: 99px;
      padding: 3px 9px;
      min-width: 22px;
      text-align: center;
    }

    .loc-name {
      font-weight: 700;
      font-size: 16px;
      margin-top: 10px;
    }

    .loc-sub {
      font-size: 12.5px;
      color: var(--ink-soft);
      margin-top: 2px;
    }

    .loc-count {
      font-family: 'Do Hyeon', sans-serif;
      font-size: 26px;
      margin-top: 10px;
    }

    .loc-count span {
      font-size: 12px;
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--ink-soft);
      font-weight: 400;
    }

    .banner {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--danger-tint);
      color: #8f231c;
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: 13.5px;
      font-weight: 500;
    }

    .banner b {
      color: var(--danger);
    }

    /* ---------- lot card ---------- */
    .lot-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .lot-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .stamp {
      flex: none;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 2.5px solid currentColor;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Do Hyeon', sans-serif;
      background: #fff;
    }

    .stamp .num {
      font-size: 18px;
      line-height: 1;
      color: var(--ink);
    }

    .stamp .lbl {
      font-size: 8px;
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 700;
      margin-top: 1px;
      color: var(--ink-soft);
    }

    .stamp.safe {
      color: var(--safe);
    }

    .stamp.warn {
      color: var(--warn);
    }

    .stamp.danger {
      color: var(--danger);
    }

    .lot-info {
      flex: 1 1 160px;
      min-width: 130px;
    }

    .lot-name {
      font-weight: 700;
      font-size: 15px;
    }

    .lot-meta {
      font-size: 12px;
      color: var(--ink-soft);
      margin-top: 3px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status-chip {
      display: inline-block;
      background: var(--freezer-tint);
      color: var(--freezer);
      border-radius: 99px;
      padding: 2px 9px;
      font-size: 11.5px;
      font-weight: 700;
    }

    .status-chip.locked {
      background: var(--warn-tint);
      color: var(--warn);
    }

    .lot-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: none;
      flex-wrap: wrap;
    }

    .lock-note {
      font-size: 11px;
      color: var(--ink-faint);
      flex: none;
    }

    /* ---------- forms ---------- */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 14px;
    }

    .form-grid.single {
      grid-template-columns: 1fr;
    }

    .field label {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-soft);
      margin-bottom: 5px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 14px;
      background: #fff;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      border-color: var(--accent);
    }

    .field-hint {
      font-size: 11.5px;
      color: var(--ink-faint);
      margin-top: 4px;
    }

    .flow-preview {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
      font-size: 12.5px;
    }

    .flow-step {
      background: var(--caramel-tint);
      color: var(--caramel);
      padding: 4px 10px;
      border-radius: 99px;
      font-weight: 700;
    }

    .flow-arrow {
      color: var(--ink-faint);
    }

    .product-pick-list {
      max-height: 320px;
      overflow-y: auto;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      margin-top: 6px;
    }

    .product-pick-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      font-size: 13.5px;
      flex-wrap: wrap;
    }

    .product-pick-item:last-child {
      border-bottom: none;
    }

    .product-pick-item:hover {
      background: var(--accent-tint);
    }

    .pp-name {
      font-weight: 700;
    }

    .pp-sub {
      font-size: 11.5px;
      color: var(--ink-soft);
    }

    .pp-actions {
      display: flex;
      gap: 6px;
      flex: none;
    }

    .pick-btn {
      background: var(--ink);
      color: #fff;
      border: none;
      border-radius: 99px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
    }

    .edit-btn {
      background: var(--card);
      color: var(--ink);
      border: 1.5px solid var(--line);
      border-radius: 99px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
    }

    /* ---------- product status (제품관리: 제품별 재고 현황) ---------- */
    .pstat-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .pstat-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px 16px;
    }

    .pstat-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pstat-name {
      font-weight: 700;
      font-size: 15px;
    }

    .pstat-sub {
      font-size: 11.5px;
      color: var(--ink-soft);
      margin-top: 2px;
    }

    .pstat-total {
      font-family: 'Do Hyeon', sans-serif;
      font-size: 20px;
      color: var(--ink);
      flex: none;
    }

    .pstat-total span {
      font-size: 11px;
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--ink-soft);
      font-weight: 400;
    }

    .pstat-lots {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .pstat-lot-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      flex-wrap: wrap;
      padding: 7px 10px;
      background: var(--bg);
      border-radius: 9px;
    }

    .pstat-lot-row .loc-tag {
      font-weight: 700;
      color: var(--caramel);
      flex: none;
    }

    .pstat-lot-row .dates {
      color: var(--ink-soft);
      margin-left: auto;
    }

    .pstat-empty {
      font-size: 12.5px;
      color: var(--ink-faint);
      margin-top: 8px;
    }

    /* ---------- log ---------- */
    .log-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 12px;
    }

    .log-row {
      background: var(--card);
      border-radius: var(--radius-sm);
      padding: 11px 16px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow);
      flex-wrap: wrap;
    }

    .log-action {
      font-weight: 700;
      border-radius: 99px;
      padding: 2px 10px;
      font-size: 11.5px;
      flex: none;
    }

    .log-time {
      color: var(--ink-faint);
      font-size: 11.5px;
      margin-left: auto;
      flex: none;
    }

    /* ---------- modal ---------- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(30, 43, 39, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
      overflow-y: auto;
    }

    .modal-box {
      background: #fff;
      border-radius: var(--radius);
      padding: 20px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      margin: auto;
    }

    .modal-title {
      font-family: 'Do Hyeon', sans-serif;
      font-size: 19px;
      margin-bottom: 6px;
    }

    .modal-sub {
      font-size: 13px;
      color: var(--ink-soft);
      margin-bottom: 14px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      color: #fff;
      padding: 11px 20px;
      border-radius: 99px;
      font-size: 13.5px;
      font-weight: 500;
      z-index: 200;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      animation: toastIn .25s ease-out;
      max-width: calc(100vw - 32px);
      text-align: center;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translate(-50%, 10px);
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    .loading-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
      color: var(--ink-soft);
      gap: 10px;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3.5px solid var(--line);
      border-top-color: var(--accent);
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ---------- responsive (mobile) ---------- */
    @media (max-width: 640px) {
      #app {
        padding: 0 12px 80px;
      }

      .topbar {
        padding: 10px 0 8px;
      }

      .brand-text .t2 {
        display: none;
      }

      .staff-input {
        width: 78px;
        padding: 8px 10px;
        font-size: 12.5px;
      }

      .search-wrap {
        flex: 1 1 100%;
        order: 3;
      }

      .printer-status {
        order: 4;
      }

      .printer-status span:not(.printer-dot) {
        display: none;
      }

      .tabs {
        margin-top: 10px;
      }

      .tab-btn {
        padding: 9px 6px;
        font-size: 13px;
      }

      .section-title {
        font-size: 19px;
        margin: 16px 0 10px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .loc-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 10px;
      }

      .loc-card {
        padding: 14px;
      }

      .lot-actions {
        width: 100%;
        justify-content: flex-end;
      }

      .card {
        padding: 14px;
      }

      .pstat-total {
        width: 100%;
        text-align: left;
      }

      .modal-box {
        padding: 16px;
      }
    }

    @media (max-width: 420px) {
      .loc-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
    (function () {
      "use strict";

      /* ============ constants ============ */
      var LOCATIONS = [
        { code: 'FRG_BEV', name: '냉장(음료)', group: '냉장' },
        { code: 'FRG_HOT', name: '냉장(핫샌)', group: '냉장' },
        { code: 'FRZ_BEV', name: '냉동(음료)', group: '냉동' },
        { code: 'FRZ_HOT', name: '냉동(핫샌)', group: '냉동' },
        { code: 'FRZ_DONUT', name: '냉동(도넛)', group: '냉동' },
        { code: 'ROOM_SAUCE', name: '상온(소스)', group: '상온' },
        { code: 'ROOM_STOCK', name: '상온(재고)', group: '상온' }
      ];
      var STORAGE_CATS = [
        { code: 'SAUCE', name: '소스' },
        { code: 'POWDER', name: '파우더' },
        { code: 'HOT_SAND', name: '핫샌드' },
        { code: 'FILLING', name: '필링' },
        { code: 'DONUT_TOPPING', name: '도넛토핑' },
        { code: 'DONUT', name: '도넛' },
        { code: 'BEV_TOPPING', name: '음료토핑' },
        { code: 'BEV_BASE', name: '음료베이스' },
        { code: 'OTHER', name: '기타' }
      ];
      var STAGE1_ACTION_LABEL = { OPEN: '개봉', SUBDIV: '소분' };
      var STAGE2_ACTION_LABEL = { THAW: '해동' };
      var ACTION_LABEL = { OPEN: '개봉', SUBDIV: '소분', THAW: '해동' };
      var BUTTON_LABEL = { '해동': '해동 완료', '개봉': '개봉하기', '소분': '소분 완료', '소진': '소진 처리' };
      var ACTION_COLOR = {
        '입고': { bg: 'var(--freezer-tint)', c: 'var(--freezer)' },
        '해동': { bg: 'var(--warn-tint)', c: 'var(--warn)' },
        '개봉': { bg: 'var(--warn-tint)', c: 'var(--warn)' },
        '소분': { bg: 'var(--caramel-tint)', c: 'var(--caramel)' },
        '소진': { bg: 'var(--safe-tint)', c: 'var(--safe)' },
        '자동소진': { bg: 'var(--safe-tint)', c: 'var(--safe)' },
        '수정': { bg: 'var(--line)', c: 'var(--ink-soft)' }
      };

      function locOf(code) { for (var i = 0; i < LOCATIONS.length; i++) { if (LOCATIONS[i].code === code) return LOCATIONS[i]; } return null; }
      function storageCatOf(code) { for (var i = 0; i < STORAGE_CATS.length; i++) { if (STORAGE_CATS[i].code === code) return STORAGE_CATS[i]; } return null; }

      // 제품 정의로부터 로트의 상태 흐름(steps)을 계산.
      // 항상 [보관] -> (선택)[1단계: 개봉/소분, 같은 위치] -> (선택, 1단계가 있어야만)[2단계: 해동, 다른 위치] -> [소진] 순서.
      // 2단계(해동)는 1단계(개봉/소분)를 거쳐야만 존재하므로, 보관->해동 직행은 구조적으로 불가능.
      function stepsFor(product) {
        var steps = [{ name: '보관', location: product.fromLocation }];
        if (product.stage1 && product.stage1.action) {
          steps.push({
            name: ACTION_LABEL[product.stage1.action] || product.stage1.action,
            location: product.fromLocation,
            days: product.stage1.days,
            stageKey: 'stage1'
          });
          if (product.stage2 && product.stage2.action) {
            steps.push({
              name: ACTION_LABEL[product.stage2.action] || product.stage2.action,
              location: product.stage2.location || product.fromLocation,
              days: product.stage2.days,
              stageKey: 'stage2'
            });
          }
        }
        steps.push({ name: '소진', location: null });
        return steps;
      }

      // 이 제품(바코드)이 이미 같은 "단계 이름"(예: 개봉, 해동)의 활성 로트를 갖고 있는지 확인.
      // 개봉은 개봉끼리, 해동은 해동끼리만 충돌 검사한다 (위치가 다른 로트끼리는 서로 영향 없음).
      // excludeLotId를 넘기면 그 로트 자신은 검사에서 제외.
      function findActiveStageLot(barcode, stageName, excludeLotId) {
        for (var i = 0; i < state.inventory.length; i++) {
          var l = state.inventory[i];
          if (String(l.barcode) === String(barcode) && l.status === stageName && l.lotId !== excludeLotId) {
            return l;
          }
        }
        return null;
      }

      // 이전 버전(2단계 fromLocation/toLocation/toAction) 제품 데이터를
      // 새 stage1/stage2 구조로 변환한다. 이미 새 구조면 그대로 반환.
      function migrateProduct(p) {
        if (p && p.stage1 !== undefined) return p;
        var np = {
          barcode: p.barcode,
          productName: p.productName,
          storage: p.storage,
          fromLocation: p.fromLocation,
          stage1: null,
          stage2: null
        };
        if (p.toAction && p.toAction !== 'EXPIRY') {
          if (p.toLocation && p.toLocation !== p.fromLocation) {
            // 위치 이동이 있던 예전 제품은 "개봉(제자리) -> 기존 전환(다른 위치)"의 2단계로 옮겨준다.
            np.stage1 = { action: 'OPEN', days: 1 };
            np.stage2 = { action: p.toAction, location: p.toLocation, days: p.safeUntil || 1 };
          } else {
            np.stage1 = { action: p.toAction, days: p.safeUntil || 1 };
          }
        }
        return np;
      }

      /* ============ state ============ */
      var state = {
        view: 'home',
        currentLocation: null,
        products: [],
        inventory: [],
        log: [],
        staffName: '',
        loading: true,
        receiveFilter: '',
        printerConnected: false,
        modal: null
        // modal types: {type:'edit-lot', lot}
        //              {type:'receive', product}
        //              {type:'edit-product', product} (product={} for new)
        //              {type:'import'}
        //              {type:'print-preview', title, segments}
      };

      /* ============ printer module (Web Serial + ESC/POS + CP949 한글) ============ */
      var HANGUL_CP949_B64 = "__HANGUL_TABLE_PLACEHOLDER__";

      var _hangulTable = null;
      function getHangulTable() {
        if (!_hangulTable) {
          var bin = atob(HANGUL_CP949_B64);
          var arr = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
          _hangulTable = arr;
        }
        return _hangulTable;
      }
      function encodeKorean(text) {
        var table = getHangulTable();
        var out = [];
        for (var idx = 0; idx < text.length; idx++) {
          var cp = text.codePointAt(idx);
          if (cp < 0x80) {
            out.push(cp);
          } else if (cp >= 0xAC00 && cp <= 0xD7A3) {
            var i2 = (cp - 0xAC00) * 2;
            out.push(table[i2], table[i2 + 1]);
          } else {
            out.push(0x3F);
          }
        }
        return Uint8Array.from(out);
      }

      var savedPort = null;
      function setPrinterConnected(on) {
        state.printerConnected = on;
        var dot = document.getElementById('printerDot');
        var text = document.getElementById('printerText');
        if (dot) dot.classList.toggle('on', on);
        if (text) text.textContent = on ? '프린터 연결됨' : '프린터 미연결';
      }

      async function connectPrinter() {
        if (!('serial' in navigator)) {
          alert('이 브라우저는 Web Serial을 지원하지 않습니다.\nChrome 또는 Edge에서 사용해주세요.');
          return;
        }
        try {
          savedPort = await navigator.serial.requestPort();
          setPrinterConnected(true);
          showToast('프린터 포트 권한 확인 완료');
        } catch (e) {
          console.error(e);
        }
      }

      function buildBarcodeBytes(code) {
        var payload = '{B' + code;
        var dataBytes = [];
        for (var i = 0; i < payload.length; i++) dataBytes.push(payload.charCodeAt(i) & 0xFF);
        return Uint8Array.from([
          0x1D, 0x68, 30,
          0x1D, 0x77, 2,
          0x1D, 0x48, 0,
          0x1D, 0x66, 0,
          0x1D, 0x6B, 73, dataBytes.length
        ].concat(dataBytes));
      }

      async function printSegments(segments) {
        var localPort = null;
        try {
          if (savedPort) {
            localPort = savedPort;
          } else {
            localPort = await navigator.serial.requestPort();
            savedPort = localPort;
          }
          await localPort.open({ baudRate: 9600, dataBits: 8, stopBits: 1, parity: 'none', flowControl: 'none' });
          setPrinterConnected(true);

          var writer = localPort.writable.getWriter();
          await writer.write(Uint8Array.from([0x1B, 0x40])); // ESC @ : 프린터 초기화
          // FS C 2 : 2바이트(더블바이트) 문자 코드 시스템을 "KS C 5601(한글)"로 지정.
          // 이 지정이 없으면 프린터가 기본값(보통 JIS/Shift-JIS 계열)으로 2바이트 데이터를
          // 해석해서, 한글 대신 엉뚱한(이상한) 문자가 출력됨.
          await writer.write(Uint8Array.from([0x1C, 0x43, 0x02]));
          await writer.write(Uint8Array.from([0x1B, 0x33, 20]));

          for (var i = 0; i < segments.length; i++) {
            var seg = segments[i];
            if (seg.type === 'barcode') {
              await writer.write(buildBarcodeBytes(seg.code));
              await writer.write(Uint8Array.from([0x0A]));
            } else if (seg.type === 'cut') {
              await writer.write(Uint8Array.from([0x1B, 0x64, 0x02]));
              await writer.write(Uint8Array.from([0x1D, 0x56, 0x00]));
            } else {
              await writer.write(Uint8Array.from([0x1C, 0x26]));
              await writer.write(encodeKorean(seg.text));
              await writer.write(Uint8Array.from([0x1C, 0x2E]));
            }
          }
          await writer.write(Uint8Array.from([0x1B, 0x64, 0x05]));
          await writer.write(Uint8Array.from([0x1D, 0x56, 0x00]));
          writer.releaseLock();
          showToast('출력 완료');
        } catch (e) {
          console.error(e);
          alert('출력 오류: ' + (e.message || e));
        } finally {
          if (localPort) {
            try { await localPort.close(); } catch (closeErr) { console.error('포트 닫기 실패:', closeErr); }
          }
          setPrinterConnected(false);
        }
      }

      async function printText(text) {
        await printSegments([{ type: 'text', text: text }, { type: 'cut' }]);
      }

      function centerText(str, width) {
        width = width || 32;
        var w = 0;
        for (var i = 0; i < str.length; i++) { w += (str.codePointAt(i) > 0x1100 ? 2 : 1); }
        var padLen = Math.max(0, Math.floor((width - w) / 2));
        return new Array(padLen + 1).join(' ') + str;
      }

      function buildLocationStatusSegments(locCode) {
        var loc = locOf(locCode);
        var locName = loc ? loc.name : locCode;
        var items = state.inventory.filter(function (l) { return l.location === locCode; });

        var byCategory = {};
        var catOrder = [];
        items.forEach(function (l) {
          var product = productByBarcode(l.barcode);
          var catCode = product ? product.storage : 'OTHER';
          var catName = storageCatOf(catCode) ? storageCatOf(catCode).name : '기타';
          if (!byCategory[catName]) { byCategory[catName] = []; catOrder.push(catName); }
          byCategory[catName].push(l);
        });

        var DIV = '================================';
        var lines = [];
        lines.push(DIV);
        lines.push(centerText(locName + ' 재고현황'));
        lines.push(DIV);
        lines.push('출력시간 : ' + nowTimeStr());
        lines.push('');

        var segments = [];
        var flush = function () { if (lines.length) { segments.push({ type: 'text', text: lines.join('\n') + '\n' }); lines = []; } };

        if (items.length === 0) {
          lines.push('(재고 없음)');
          lines.push('');
        } else {
          catOrder.forEach(function (cat) {
            lines.push('[' + cat + ']');
            byCategory[cat].forEach(function (l) {
              lines.push('- ' + l.productName);
              lines.push('  보관장소 : ' + (locOf(l.location) ? locOf(l.location).name : l.location));
              lines.push('  소비기한 : ' + (l.expiry || '-'));
              lines.push('  안전보관일 : ' + (l.safeUntil || '-'));
              if (l.barcode) {
                flush();
                segments.push({ type: 'barcode', code: l.barcode });
              }
            });
            lines.push('');
          });
        }
        lines.push(DIV);
        lines.push('');
        flush();
        segments.push({ type: 'cut' });
        return segments;
      }

      function buildAllLocationsStatusSegments() {
        var segments = [];
        LOCATIONS.forEach(function (loc) {
          segments = segments.concat(buildLocationStatusSegments(loc.code));
        });
        return segments;
      }

      function buildLotReceiptSegments(lot) {
        var DIV = '================================';
        var lines = [];
        lines.push(DIV);
        lines.push(centerText(lot.productName));
        lines.push(DIV);
        lines.push('보관장소 : ' + (locOf(lot.location) ? locOf(lot.location).name : lot.location));
        lines.push('소비기한 : ' + (lot.expiry || '-'));
        if (lot.processDate && lot.status !== '보관') {
          lines.push(lot.status + '일 : ' + lot.processDate);
        }
        lines.push('안전보관일 : ' + (lot.safeUntil || '-'));
        lines.push(DIV);
        lines.push('');
        var segments = [{ type: 'text', text: lines.join('\n') + '\n' }];
        if (lot.barcode) segments.push({ type: 'barcode', code: lot.barcode });
        segments.push({ type: 'cut' });
        return segments;
      }

      // 위치가 바뀌는 전환(예: 개봉 -> 해동) 시, 원래 위치에 남은/이동된 수량을 안내하는 영수증.
      function buildRemainingLocationReceiptSegments(productName, originalLocation, movedQty, remainingQty) {
        var DIV = '================================';
        var lines = [];
        lines.push(DIV);
        lines.push(centerText(productName + ' 이동 안내'));
        lines.push(DIV);
        lines.push('원래 위치 : ' + (locOf(originalLocation) ? locOf(originalLocation).name : originalLocation));
        lines.push('이동 수량 : ' + movedQty + '개');
        lines.push('남은 수량 : ' + remainingQty + '개' + (remainingQty === 0 ? ' (전량 이동됨)' : ''));
        lines.push(DIV);
        lines.push('');
        return [{ type: 'text', text: lines.join('\n') + '\n' }, { type: 'cut' }];
      }

      // 등록된 제품 중 현재 로트가 하나도 없는(품절) 품목 목록.
      function getBackorderProducts() {
        return state.products.filter(function (p) {
          return !state.inventory.some(function (l) { return String(l.barcode) === String(p.barcode); });
        });
      }

      function buildBackorderReceiptSegments() {
        var items = getBackorderProducts();
        var DIV = '================================';
        var lines = [];
        lines.push(DIV);
        lines.push(centerText('발주 리스트'));
        lines.push(DIV);
        lines.push('출력시간 : ' + nowTimeStr());
        lines.push('');
        if (items.length === 0) {
          lines.push('(발주할 품목 없음)');
        } else {
          items.forEach(function (p) {
            lines.push('- ' + p.productName + ' (' + p.barcode + ')');
          });
        }
        lines.push('');
        lines.push(DIV);
        lines.push('');
        return [{ type: 'text', text: lines.join('\n') + '\n' }, { type: 'cut' }];
      }

      /* ============ storage helpers ============ */
      async function loadKey(key, def) {
        try {
          const res = await fetch(SCRIPT_URL + "?action=get&key=" + encodeURIComponent(key));
          const data = await res.json();
          if (!data || data.value === undefined || data.value === null || data.value === "") {
            return def;
          }
          return JSON.parse(data.value);
        } catch (e) {
          console.error("load failed", key, e);
          return def;
        }
      }

      async function saveKey(key, value) {
        try {
          const res = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "set", key: key, value: JSON.stringify(value) })
          });
          const data = await res.json();
          if (!data.ok) {
            console.error("save failed", key, data.error);
            return { ok: false, error: data.error || '저장에 실패했어요' };
          }
          return { ok: true };
        } catch (e) {
          console.error("save failed", key, e);
          return { ok: false, error: '네트워크 오류로 저장하지 못했어요' };
        }
      }

      async function loadAll() {
        state.loading = true;
        render();
        var results = await Promise.all([
          loadKey('products', []),
          loadKey('inventory', []),
          loadKey('actionlog', []),
          loadKey('staffName', '')
        ]);
        state.products = (results[0] || []).map(migrateProduct);
        state.inventory = results[1];
        state.log = results[2];
        state.staffName = results[3];
        state.loading = false;
        render();
      }

      /* ============ date helpers ============ */
      function pad(n) { return String(n).padStart(2, '0'); }
      function fmtLocal(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
      function todayStr() { return fmtLocal(new Date()); }
      function nowTimeStr() {
        var d = new Date();
        return fmtLocal(d) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
      }
      function addDays(dateStr, days) {
        var d = new Date(dateStr + 'T00:00:00');
        d.setDate(d.getDate() + Number(days || 0));
        return fmtLocal(d);
      }
      function daysLeft(dateStr) {
        if (!dateStr) return null;
        var target = new Date(dateStr + 'T00:00:00');
        var now = new Date();
        var n = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        return Math.round((target - n) / 86400000);
      }
      function deadlineOf(lot) {
        if (lot.expiry && lot.safeUntil) { return lot.expiry < lot.safeUntil ? lot.expiry : lot.safeUntil; }
        return lot.expiry || lot.safeUntil;
      }
      function urgency(dLeft) {
        if (dLeft === null) return 'safe';
        if (dLeft < 0) return 'danger';
        if (dLeft <= 1) return 'warn';
        return 'safe';
      }
      function urgencyText(dLeft) {
        if (dLeft === null) return '-';
        if (dLeft < 0) return (dLeft * -1) + '일 초과';
        if (dLeft === 0) return '오늘까지';
        return dLeft + '일 남음';
      }
      function stampNum(dLeft) {
        if (dLeft === null) return '-';
        if (dLeft < 0) return '+' + (dLeft * -1);
        return String(dLeft);
      }

      function uid(prefix) { return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

      /* ============ business logic ============ */
      function productByBarcode(bc) {
        for (var i = 0; i < state.products.length; i++) {
          if (String(state.products[i].barcode) === String(bc)) {
            return state.products[i];
          }
        }
        return null;
      }

      async function receiveStock(product, qty, expiry, locationOverride) {
        var steps = stepsFor(product);
        var lot = {
          lotId: uid('LOT'),
          barcode: product.barcode,
          productName: product.productName,
          qty: Number(qty),
          location: locationOverride || product.fromLocation,
          status: steps[0].name,
          baseDate: todayStr(),
          safeUntil: '',
          expiry: expiry || '',
          processDate: '',
          createdAt: nowTimeStr()
        };
        state.inventory.push(lot);
        var saveResult = await saveKey('inventory', state.inventory);
        if (!saveResult.ok) {
          state.inventory.pop();
          showToast('입고 실패: ' + saveResult.error);
          return;
        }
        await pushLog(lot, '입고', '수량 ' + qty + '개 · ' + (locOf(lot.location) ? locOf(lot.location).name : lot.location));
        showToast(product.productName + ' 입고 완료');
      }

      // 로트를 다음 단계로 전환한다. requestedQty를 넘기면 그 수량만큼만 분할해서 이동하고
      // 나머지는 원래 위치·상태에 그대로 남는다 (넘기지 않으면 전량 이동).
      // 같은 단계(예: 개봉)의 활성 로트가 이미 있으면 자동으로 소진하고 새 로트를 만든다.
      // 소비기한(expiry)은 항상 원본 로트에서 그대로 상속되며 재입력받지 않는다.
      // 반환값: 위치가 바뀌는 전환이면 { receipts: [...] } 형태로 출력용 영수증 세그먼트를 함께 돌려준다.
      async function advanceLot(lot, requestedQty) {
        var product = productByBarcode(lot.barcode);
        if (!product) { showToast('제품 정보를 찾을 수 없어요'); return null; }
        var steps = stepsFor(product);
        var idx = steps.findIndex(function (s) { return s.name === lot.status; });
        var next = steps[idx + 1];
        if (!next) return null;

        if (next.name === '소진') {
          await consumeLot(lot);
          return null;
        }

        var totalQty = Number(lot.qty) || 0;
        var moveQty = requestedQty === undefined || requestedQty === null || requestedQty === '' ? totalQty : Number(requestedQty);
        if (!moveQty || moveQty <= 0 || moveQty > totalQty) {
          showToast('이동 수량이 올바르지 않아요 (1~' + totalQty + '개)');
          return null;
        }
        var isPartial = moveQty < totalQty;
        var isLocationChange = !!next.location && next.location !== lot.location;
        var originalLocation = lot.location;

        // 자동소진: 같은 단계 이름(예: 개봉은 개봉끼리, 해동은 해동끼리)의 활성 로트가 있으면 먼저 소진.
        var conflictLot = findActiveStageLot(lot.barcode, next.name, lot.lotId);

        var prevInventorySnapshot = state.inventory.slice();
        var prevLotSnapshot = Object.assign({}, lot);

        if (conflictLot) {
          state.inventory = state.inventory.filter(function (l) { return l.lotId !== conflictLot.lotId; });
        }

        var baseDate = todayStr();
        var newSafeUntil = next.days ? addDays(baseDate, next.days) : '';
        var movedLot;

        if (isPartial) {
          lot.qty = totalQty - moveQty;
          movedLot = {
            lotId: uid('LOT'),
            barcode: lot.barcode,
            productName: lot.productName,
            qty: moveQty,
            location: next.location || lot.location,
            status: next.name,
            baseDate: baseDate,
            safeUntil: newSafeUntil,
            expiry: lot.expiry,
            processDate: baseDate,
            createdAt: nowTimeStr()
          };
          state.inventory.push(movedLot);
        } else {
          movedLot = lot;
          movedLot.status = next.name;
          if (next.location) movedLot.location = next.location;
          movedLot.baseDate = baseDate;
          movedLot.safeUntil = newSafeUntil;
          movedLot.processDate = baseDate;
        }

        var saveResultAdvance = await saveKey('inventory', state.inventory);
        if (!saveResultAdvance.ok) {
          state.inventory = prevInventorySnapshot;
          Object.assign(lot, prevLotSnapshot);
          showToast('처리 실패: ' + saveResultAdvance.error);
          return null;
        }

        if (conflictLot) { await pushLog(conflictLot, '자동소진', '새 ' + next.name + ' 로트 등록으로 자동 소진됨'); }
        await pushLog(movedLot, next.name, isPartial ? ('수량 ' + moveQty + '개 분할 이동') : '전량 이동');
        showToast(lot.productName + ' → ' + next.name + (isPartial ? ' (일부 ' + moveQty + '개)' : ''));

        var receipts = [];
        if (isLocationChange) {
          receipts.push(buildRemainingLocationReceiptSegments(movedLot.productName, originalLocation, moveQty, isPartial ? lot.qty : 0));
          receipts.push(buildLotReceiptSegments(movedLot));
        } else {
          receipts.push(buildLotReceiptSegments(movedLot));
        }
        return { movedLot: movedLot, receipts: receipts };
      }

      // 어느 상태에 있든(보관/개봉/해동/소분) 즉시 소진 처리한다.
      // 사유 입력 없이 바로 재고에서 제거하고 '소진'으로 기록한다.
      async function consumeLot(lot) {
        var prevInventory = state.inventory;
        state.inventory = state.inventory.filter(function (l) { return l.lotId !== lot.lotId; });
        var saveResult = await saveKey('inventory', state.inventory);
        if (!saveResult.ok) {
          state.inventory = prevInventory;
          showToast('소진 처리 실패: ' + saveResult.error);
          return;
        }
        await pushLog(lot, '소진', '');
        showToast(lot.productName + ' 소진 처리됨');
      }

      // 제품관리 탭에서 수량/소비기한/상태를 수동으로 고칠 때 사용.
      // 상태를 바꾸면 그 단계의 안전보관일 기준일(baseDate)도 오늘 날짜로
      // 다시 잡고, 해당 단계에 기준일수(days)가 있으면 안전보관일도 재계산한다.
      async function editLot(lot, updates) {
        var prevSnapshot = Object.assign({}, lot);
        var product = productByBarcode(lot.barcode);
        var steps = product ? stepsFor(product) : null;

        lot.qty = Number(updates.qty);
        lot.expiry = updates.expiry || '';

        if (updates.status && updates.status !== lot.status) {
          if (updates.status !== '보관') {
            var already = findActiveStageLot(lot.barcode, updates.status, lot.lotId);
            if (already) {
              showToast('이미 ' + already.status + ' 중인 로트가 있어요. 그 로트를 먼저 소진해주세요.');
              return;
            }
          }
          lot.status = updates.status;
          if (updates.status === '보관') {
            lot.baseDate = todayStr();
            lot.processDate = '';
            lot.safeUntil = '';
          } else {
            var stepDef = steps ? steps.find(function (s) { return s.name === updates.status; }) : null;
            lot.baseDate = todayStr();
            lot.processDate = lot.baseDate;
            if (stepDef && stepDef.location) lot.location = stepDef.location;
            lot.safeUntil = (stepDef && stepDef.days) ? addDays(lot.baseDate, stepDef.days) : '';
          }
        }

        var saveResult = await saveKey('inventory', state.inventory);
        if (!saveResult.ok) {
          Object.assign(lot, prevSnapshot);
          showToast('로트 수정 실패: ' + saveResult.error);
          return;
        }
        await pushLog(lot, '수정', '수량 ' + lot.qty + '개 · 소비기한 ' + (lot.expiry || '-') + ' · 상태 ' + lot.status);
        showToast(lot.productName + ' 정보가 수정되었어요');
      }

      async function pushLog(lot, action, note) {
        state.log.unshift({
          time: nowTimeStr(),
          lotId: lot.lotId,
          productName: lot.productName,
          action: action,
          user: state.staffName || '미입력',
          note: note || ''
        });
        if (state.log.length > 500) state.log = state.log.slice(0, 500);
        var saveResult = await saveKey('actionlog', state.log);
        if (!saveResult.ok) {
          console.error('actionlog save failed', saveResult.error);
          showToast('처리는 완료됐지만 이력 기록에는 실패했어요');
        }
      }

      async function saveProduct(p) {
        var idx = state.products.findIndex(function (x) { return x.barcode === p.barcode; });
        var prevProducts = state.products;
        state.products = idx >= 0
          ? state.products.map(function (x, i) { return i === idx ? p : x; })
          : state.products.concat([p]);
        var saveResult = await saveKey('products', state.products);
        if (!saveResult.ok) {
          state.products = prevProducts;
          showToast('제품 저장 실패: ' + saveResult.error);
          return;
        }
        showToast('제품이 저장되었어요');
      }
      async function deleteProduct(barcode) {
        var prevProducts = state.products;
        state.products = state.products.filter(function (p) { return p.barcode !== barcode; });
        var saveResult = await saveKey('products', state.products);
        if (!saveResult.ok) {
          state.products = prevProducts;
          showToast('제품 삭제 실패: ' + saveResult.error);
          return;
        }
        showToast('제품이 삭제되었어요');
      }

      /* ---------- CSV bulk import ---------- */
      function parseCsvText(text) {
        var lines = String(text || '').split(/\r\n|\r|\n/).filter(function (l) { return l.trim().length > 0; });
        if (lines.length < 2) return { rows: [], errors: ['헤더와 데이터가 최소 1줄씩 필요해요.'] };
        var delim = lines[0].indexOf('\t') >= 0 ? '\t' : ',';
        var headers = lines[0].split(delim).map(function (h) { return h.trim(); });
        var rows = [], errors = [];
        for (var i = 1; i < lines.length; i++) {
          var cols = lines[i].split(delim);
          var obj = {};
          headers.forEach(function (h, idx) { obj[h] = (cols[idx] || '').trim(); });
          if (!obj.barcode) { errors.push('줄 ' + (i + 1) + ': 바코드가 없어 건너뜀'); continue; }
          var stage1Action = obj.stage1Action || '';
          var stage2Action = obj.stage2Action || '';
          var p = {
            barcode: String(obj.barcode),
            storage: obj.storage || 'OTHER',
            productName: obj.productName || obj.barcode,
            fromLocation: obj.fromLocation || '',
            stage1: stage1Action ? { action: stage1Action, days: Number(obj.stage1Days) || 1 } : null,
            stage2: (stage1Action && stage2Action) ? { action: stage2Action, location: obj.stage2Location || obj.fromLocation, days: Number(obj.stage2Days) || 1 } : null
          };
          if (!locOf(p.fromLocation)) errors.push('줄 ' + (i + 1) + ' (' + p.barcode + '): fromLocation 코드가 올바르지 않아요 - "' + p.fromLocation + '"');
          if (stage1Action && !STAGE1_ACTION_LABEL[stage1Action]) errors.push('줄 ' + (i + 1) + ' (' + p.barcode + '): stage1Action이 올바르지 않아요 - "' + stage1Action + '" (OPEN 또는 SUBDIV)');
          if (stage1Action && !obj.stage1Days) errors.push('줄 ' + (i + 1) + ' (' + p.barcode + '): stage1Action이 있는데 stage1Days(일수)가 없어요');
          if (stage2Action && !stage1Action) errors.push('줄 ' + (i + 1) + ' (' + p.barcode + '): 2단계(해동)를 쓰려면 1단계(개봉/소분)가 먼저 필요해요');
          if (stage2Action && !locOf(obj.stage2Location)) errors.push('줄 ' + (i + 1) + ' (' + p.barcode + '): stage2Location 코드가 올바르지 않아요 - "' + obj.stage2Location + '"');
          if (stage2Action && !obj.stage2Days) errors.push('줄 ' + (i + 1) + ' (' + p.barcode + '): stage2Action이 있는데 stage2Days(일수)가 없어요');
          rows.push(p);
        }
        return { rows: rows, errors: errors };
      }

      async function importProducts(rows) {
        var prevProducts = state.products;
        var added = 0, updated = 0;
        var nextProducts = state.products.slice();
        rows.forEach(function (p) {
          var idx = nextProducts.findIndex(function (x) { return x.barcode === p.barcode; });
          if (idx >= 0) { nextProducts[idx] = p; updated++; } else { nextProducts.push(p); added++; }
        });
        state.products = nextProducts;
        var saveResult = await saveKey('products', state.products);
        if (!saveResult.ok) {
          state.products = prevProducts;
          showToast('가져오기 실패: ' + saveResult.error);
          return;
        }
        showToast('가져오기 완료: 신규 ' + added + '건 · 수정 ' + updated + '건');
      }

      /* ============ toast ============ */
      var toastTimer = null;
      function showToast(msg) {
        var old = document.querySelector('.toast');
        if (old) old.remove();
        var t = document.createElement('div');
        t.className = 'toast';
        t.textContent = msg;
        document.body.appendChild(t);
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { t.remove(); }, 2600);
      }

      /* ============ render ============ */
      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function render() {
        var app = document.getElementById('app');
        var existingOverlay = document.getElementById('modalOverlay');
        if (existingOverlay) existingOverlay.remove();
        if (state.loading) {
          app.innerHTML = topbarHtml() + '<div class="loading-wrap"><div class="spinner"></div><div>재고 데이터를 불러오는 중...</div></div>';
          attachTopbarListeners();
          return;
        }
        var body = '';
        if (state.view === 'home') body = renderHome();
        else if (state.view === 'location') body = renderLocationDetail();
        else if (state.view === 'productStatus') body = renderProductStatus();
        else if (state.view === 'receive') body = renderReceive();
        else if (state.view === 'log') body = renderLog();
        app.innerHTML = topbarHtml() + body;
        attachTopbarListeners();
        attachViewListeners();
        if (state.modal) renderModal();
      }

      function topbarHtml() {
        var tabs = [
          ['home', '재고현황'], ['productStatus', '제품관리'], ['receive', '입고']
        ];
        var tabsHtml = tabs.map(function (t) {
          return '<button class="tab-btn ' + (state.view === t[0] || (state.view === 'location' && t[0] === 'home') ? 'active' : '') + '" data-nav="' + t[0] + '">' + t[1] + '</button>';
        }).join('');
        return '' +
          '<div class="topbar">' +
          '<div class="topbar-row">' +
          '<button type="button" class="home-btn" data-nav="home" title="홈으로">⌂</button>' +
          '<div class="brand">' +
          '<div class="brand-mark"></div>' +
          '<div class="brand-text"><div class="t1">던킨랜드마크시티QC</div><div class="t2">위치 · 상태 · 유통기한 한눈에</div></div>' +
          '</div>' +
          '<input class="staff-input" id="staffNameInput" placeholder="담당자" value="' + esc(state.staffName) + '" maxlength="10">' +
          '<div class="search-wrap"><input id="headerSearch" placeholder="바코드/제품명 검색 후 Enter" value="' + (state.view === 'receive' ? esc(state.receiveFilter) : '') + '"></div>' +
          '<div class="printer-status">' +
          '<span class="printer-dot' + (state.printerConnected ? ' on' : '') + '" id="printerDot"></span>' +
          '<span id="printerText">' + (state.printerConnected ? '프린터 연결됨' : '프린터 미연결') + '</span>' +
          '<button type="button" class="small" data-action="connect-printer">연결</button>' +
          '</div>' +
          '</div>' +
          '<div class="tabs">' + tabsHtml + '</div>' +
          '</div>';
      }

      /* ---------- home (재고현황: 위치별) ---------- */
      function renderHome() {
        var urgentTotal = 0;
        var cards = LOCATIONS.map(function (loc) {
          var lots = state.inventory.filter(function (l) { return l.location === loc.code; });
          var urgentCount = lots.filter(function (l) { return urgency(daysLeft(deadlineOf(l))) !== 'safe'; }).length;
          urgentTotal += urgentCount;
          return '' +
            '<button class="loc-card" data-nav="location" data-loc="' + loc.code + '">' +
            '<div class="loc-strip g-' + loc.group + '"></div>' +
            '<div class="loc-top">' +
            (urgentCount > 0 ? '<div class="loc-badge">' + urgentCount + '</div>' : '<div></div>') +
            '</div>' +
            '<div class="loc-name">' + loc.name + '</div>' +
            '<div class="loc-sub">' + loc.group + ' 구역</div>' +
            '<div class="loc-count">' + lots.length + '<span> 개 로트</span></div>' +
            '</button>';
        }).join('');

        var banner = urgentTotal > 0
          ? '<div class="banner"><span>지금 <b>' + urgentTotal + '건</b>의 재고가 유통기한 임박 또는 초과 상태예요. 위치를 눌러 확인하세요.</span></div>'
          : '';

        return '' +
          banner +
          '<div class="section-title" style="justify-content:space-between;">' +
          '<span>보관 위치별 재고현황</span>' +
          '<button class="btn btn-ghost btn-sm" data-action="print-all-locations">전체 위치 영수증 출력</button>' +
          '</div>' +
          '<div class="loc-grid">' + cards + '</div>';
      }

      /* ---------- location detail ---------- */
      function renderLocationDetail() {
        var loc = locOf(state.currentLocation);
        if (!loc) return '<div class="empty-state">위치를 찾을 수 없어요.</div>';
        var lots = state.inventory.filter(function (l) { return l.location === loc.code; });
        lots.sort(function (a, b) {
          var da = daysLeft(deadlineOf(a)); var db = daysLeft(deadlineOf(b));
          return (da === null ? 999 : da) - (db === null ? 999 : db);
        });

        var list = '';
        if (lots.length === 0) {
          list = '<div class="empty-state"><div class="e-title">이 위치엔 재고가 없어요</div>' +
            '<div style="margin-bottom:14px;">입고 탭에서 새 재고를 등록하세요.</div>' +
            '<button class="btn btn-primary" data-nav="receive">입고 탭으로</button></div>';
        } else {
          list = '<div class="lot-list">' + lots.map(function (l) {
            var dl = daysLeft(deadlineOf(l));
            var urg = urgency(dl);
            var product = productByBarcode(l.barcode);
            var btn = '';
            var lockNote = '';
            if (product) {
              var steps = stepsFor(product);
              var idx = steps.findIndex(function (s) { return s.name === l.status; });
              var next = steps[idx + 1];
              if (next) {
                if (next.name !== '소진') {
                  var already = findActiveStageLot(l.barcode, next.name, l.lotId);
                  if (already) { lockNote = '진행 시 기존 ' + already.status + ' 로트(' + already.qty + '개) 자동 소진됨'; }
                }
                btn = '<button class="btn btn-primary" data-action="advance" data-lot="' + l.lotId + '">' + (BUTTON_LABEL[next.name] || next.name) + '</button>';
              }
            }
            return '' +
              '<div class="lot-card">' +
              '<div class="stamp ' + urg + '"><div class="num">' + stampNum(dl) + '</div><div class="lbl">' + (dl !== null && dl < 0 ? '일 초과' : '일 남음') + '</div></div>' +
              '<div class="lot-info">' +
              '<div class="lot-name">' + esc(l.productName) + '</div>' +
              '<div class="lot-meta">' +
              '<span class="status-chip">' + l.status + '</span>' +
              '<span>수량 ' + l.qty + '개</span>' +
              '<span>' + urgencyText(dl) + ' (' + deadlineOf(l) + ')</span>' +
              '</div>' +
              '</div>' +
              '<div class="lot-actions">' +
              (lockNote ? '<span class="lock-note">' + esc(lockNote) + '</span>' : '') +
              btn +
              '<button class="btn btn-ghost btn-sm" data-action="print-lot" data-lot="' + l.lotId + '">영수증</button>' +
              '<button class="btn-danger-text" style="color:var(--safe);" data-action="consume-lot" data-lot="' + l.lotId + '">소진</button>' +
              '</div>' +
              '</div>';
          }).join('') + '</div>';
        }

        return '' +
          '<button class="back-link" data-nav="home">← 위치 목록</button>' +
          '<div class="section-title" style="justify-content:space-between;">' +
          '<span>' + loc.name + '</span>' +
          '<button class="btn btn-ghost btn-sm" data-action="print-location">이 위치 영수증 출력</button>' +
          '</div>' +
          list;
      }

      /* ---------- 제품관리: 제품별 재고 상태 ---------- */
      function renderProductStatus() {
        if (state.products.length === 0) {
          return '' +
            '<div class="section-title">제품관리</div>' +
            '<div class="empty-state"><div class="e-title">등록된 제품이 없어요</div>' +
            '<div style="margin-bottom:14px;">입고 탭에서 새 제품을 먼저 등록해주세요.</div>' +
            '<button class="btn btn-primary" data-nav="receive">입고 탭으로</button></div>';
        }

        var cards = state.products.map(function (p) {
          var lots = state.inventory.filter(function (l) { return String(l.barcode) === String(p.barcode); });
          var totalQty = lots.reduce(function (sum, l) { return sum + (Number(l.qty) || 0); }, 0);

          var lotsHtml = '';
          if (lots.length === 0) {
            lotsHtml = '<div class="pstat-empty">현재 재고 없음</div>';
          } else {
            var sorted = lots.slice().sort(function (a, b) {
              var da = daysLeft(deadlineOf(a)); var db = daysLeft(deadlineOf(b));
              return (da === null ? 999 : da) - (db === null ? 999 : db);
            });
            lotsHtml = '<div class="pstat-lots">' + sorted.map(function (l) {
              var dl = daysLeft(deadlineOf(l));
              var urg = urgency(dl);
              var col = urg === 'danger' ? 'var(--danger)' : (urg === 'warn' ? 'var(--warn)' : 'var(--safe)');
              return '<div class="pstat-lot-row" data-action="edit-lot" data-lot="' + l.lotId + '" style="cursor:pointer;">' +
                '<span class="loc-tag">' + (locOf(l.location) ? locOf(l.location).name : l.location) + '</span>' +
                '<span class="status-chip' + (l.status !== '보관' ? ' locked' : '') + '">' + l.status + '</span>' +
                '<span>수량 ' + l.qty + '개</span>' +
                '<span class="dates" style="color:' + col + ';">소비기한 ' + (l.expiry || '-') + (l.safeUntil ? ' · 안전보관 ' + l.safeUntil : '') + ' (' + urgencyText(dl) + ')</span>' +
                '</div>';
            }).join('') + '</div>';
          }

          var locText = (locOf(p.fromLocation) ? locOf(p.fromLocation).name : p.fromLocation);
          if (p.stage2 && p.stage2.action && p.stage2.location && p.stage2.location !== p.fromLocation) {
            locText += ' → ' + (locOf(p.stage2.location) ? locOf(p.stage2.location).name : p.stage2.location);
          }

          return '<div class="pstat-card">' +
            '<div class="pstat-head">' +
            '<div><div class="pstat-name">' + esc(p.productName) + '</div><div class="pstat-sub">' + esc(p.barcode) + ' · ' + esc(storageCatOf(p.storage) ? storageCatOf(p.storage).name : (p.storage || '미분류')) + ' · ' + esc(locText) + '</div></div>' +
            '<div class="pstat-total">' + totalQty + '<span> 개 · ' + lots.length + '개 로트</span></div>' +
            '</div>' +
            lotsHtml +
            '</div>';
        }).join('');

        return '' +
          '<div class="section-title">제품별 재고 상태</div>' +
          '<div class="pstat-list">' + cards + '</div>';
      }

      /* ---------- 입고: 제품 검색 / 수정 / 새제품 등록 ---------- */
      function renderReceive() {
        var filter = (state.receiveFilter || '').trim().toLowerCase();
        var filtered = state.products.filter(function (p) {
          if (!filter) return true;
          var productName = String(p.productName || '').toLowerCase();
          var barcode = String(p.barcode || '').toLowerCase();
          return productName.indexOf(filter) >= 0 || barcode.indexOf(filter) >= 0;
        });

        var pickList = state.products.length === 0
          ? '<div class="empty-state"><div class="e-title">등록된 제품이 없어요</div><div style="margin-bottom:14px;">아래 버튼으로 첫 제품을 등록하거나 CSV로 가져와보세요.</div></div>'
          : '<div class="product-pick-list">' +
          (filtered.length === 0 ? '<div style="padding:16px; color:var(--ink-soft); font-size:13.5px;">검색 결과가 없어요.</div>' :
            filtered.map(function (p) {
              var flowText = p.stage1 && p.stage1.action ? flowPreviewText(stepsFor(p)) : '전환 없음 (소비기한만 추적)';
              return '<div class="product-pick-item">' +
                '<div><div class="pp-name">' + esc(p.productName) + '</div><div class="pp-sub">' + esc(p.barcode) + ' · ' + esc(locOf(p.fromLocation) ? locOf(p.fromLocation).name : p.fromLocation) + ' · ' + esc(flowText) + '</div></div>' +
                '<div class="pp-actions">' +
                '<button class="edit-btn" data-action="open-edit-product" data-barcode="' + esc(p.barcode) + '">수정</button>' +
                '<button class="pick-btn" data-action="open-receive" data-barcode="' + esc(p.barcode) + '">입고</button>' +
                '</div>' +
                '</div>';
            }).join('')) +
          '</div>';

        return '' +
          '<div class="section-title" style="justify-content:space-between;">' +
          '<span>입고</span>' +
          '<div style="display:flex; gap:8px; flex-wrap:wrap;">' +
          '<button class="btn btn-primary btn-sm" data-action="open-new-product">새 제품 등록</button>' +
          '<button class="btn btn-ghost btn-sm" data-action="open-import">CSV 일괄 등록</button>' +
          '<button class="btn btn-ghost btn-sm" data-action="print-backorder">발주 리스트 출력</button>' +
          '</div>' +
          '</div>' +
          '<div class="card"><div class="field"><label>제품 검색</label><input id="receiveFilterInput" placeholder="제품명 또는 바코드로 검색" value="' + esc(state.receiveFilter || '') + '"></div></div>' +
          '<div style="margin-top:12px;">' + pickList + '</div>';
      }

      /* ---------- log ---------- */
      function renderLog() {
        if (state.log.length === 0) {
          return '<div class="section-title">기록</div><div class="empty-state"><div class="e-title">아직 기록이 없어요</div><div>입고, 해동, 소진 등의 작업이 여기 쌓여요.</div></div>';
        }
        var rows = state.log.slice(0, 200).map(function (e) {
          var col = ACTION_COLOR[e.action] || { bg: 'var(--line)', c: 'var(--ink-soft)' };
          return '<div class="log-row">' +
            '<span class="log-action" style="background:' + col.bg + '; color:' + col.c + ';">' + e.action + '</span>' +
            '<span>' + esc(e.productName) + '</span>' +
            (e.note ? '<span style="color:var(--ink-soft);">· ' + esc(e.note) + '</span>' : '') +
            '<span style="color:var(--ink-faint);">by ' + esc(e.user) + '</span>' +
            '<span class="log-time">' + e.time + '</span>' +
            '</div>';
        }).join('');
        return '<div class="section-title">기록</div><div class="log-list">' + rows + '</div>';
      }

      /* ---------- modal ---------- */
      function flowPreviewHtml(steps) {
        return steps.map(function (s, i) { return (i > 0 ? '<span class="flow-arrow">→</span>' : '') + '<span class="flow-step">' + s.name + '</span>'; }).join('');
      }
      function flowPreviewText(steps) {
        return steps.map(function (s) { return s.name; }).join(' → ');
      }

      function renderModal() {
        var overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.id = 'modalOverlay';

        if (state.modal.type === 'edit-lot') {
          var editLotTarget = state.modal.lot;
          var editLotProduct = productByBarcode(editLotTarget.barcode);
          // 소진은 별도 소진 버튼으로 처리하므로 상태 목록에서 제외한다.
          var editLotSteps = editLotProduct ? stepsFor(editLotProduct).filter(function (s) { return s.name !== '소진'; }) : [{ name: editLotTarget.status }];
          var editLotStatusOptions = editLotSteps.map(function (s) {
            return '<option value="' + s.name + '" ' + (s.name === editLotTarget.status ? 'selected' : '') + '>' + s.name + '</option>';
          }).join('');
          overlay.innerHTML = '' +
            '<div class="modal-box">' +
            '<div class="modal-title">' + esc(editLotTarget.productName) + ' 로트 수정</div>' +
            '<div class="modal-sub">' + (locOf(editLotTarget.location) ? locOf(editLotTarget.location).name : editLotTarget.location) + ' · ' + esc(editLotTarget.lotId) + '</div>' +
            '<form id="editLotForm" class="form-grid single" style="margin-top:12px;">' +
            '<div class="field"><label>수량</label><input type="number" name="qty" min="1" value="' + editLotTarget.qty + '" required></div>' +
            '<div class="field"><label>소비기한</label><input type="date" name="expiry" value="' + (editLotTarget.expiry || '') + '"></div>' +
            '<div class="field"><label>상태</label><select name="status">' + editLotStatusOptions + '</select></div>' +
            '<div class="modal-actions">' +
            '<button type="button" class="btn btn-ghost btn-block" data-action="close-modal">취소</button>' +
            '<button type="submit" class="btn btn-primary btn-block">저장</button>' +
            '</div>' +
            '</form>' +
            '</div>';
        }

        if (state.modal.type === 'receive') {
          var product = state.modal.product;
          var steps = stepsFor(product);
          overlay.innerHTML = '' +
            '<div class="modal-box">' +
            '<div class="modal-title">' + esc(product.productName) + ' 입고</div>' +
            '<div class="flow-preview">' + flowPreviewHtml(steps) + '</div>' +
            '<form id="receiveForm" class="form-grid single" style="margin-top:12px;">' +
            '<div class="field"><label>수량</label><input type="number" name="qty" min="1" value="1" required></div>' +
            '<div class="field"><label>보관 위치</label><select name="location">' +
            LOCATIONS.map(function (l) { return '<option value="' + l.code + '" ' + (l.code === product.fromLocation ? 'selected' : '') + '>' + l.name + '</option>'; }).join('') +
            '</select></div>' +
            '<div class="field"><label>제품 표기 소비기한</label><input type="date" name="expiry"></div>' +
            '<div class="field-hint">' + (product.stage1 && product.stage1.action ? flowPreviewText(steps) + ' 순서로 진행돼요.' : '전환 없음 (소비기한만 추적)') + '</div>' +
            '<div class="modal-actions">' +
            '<button type="button" class="btn btn-ghost btn-block" data-action="close-modal">취소</button>' +
            '<button type="submit" class="btn btn-primary btn-block">입고 등록</button>' +
            '</div>' +
            '</form>' +
            '</div>';
        }

        if (state.modal.type === 'edit-product') {
          var editing = state.modal.product;
          var isNew = !editing.barcode;
          var stage1 = editing.stage1 || null;
          var stage2 = editing.stage2 || null;
          var storageOptions = STORAGE_CATS.map(function (s) { return '<option value="' + s.code + '" ' + (editing.storage === s.code ? 'selected' : '') + '>' + s.name + '</option>'; }).join('');
          var fromLocOptions = LOCATIONS.map(function (l) { return '<option value="' + l.code + '" ' + (editing.fromLocation === l.code ? 'selected' : '') + '>' + l.name + '</option>'; }).join('');
          var stage1ActionOptions = '<option value="">사용 안 함</option>' + Object.keys(STAGE1_ACTION_LABEL).map(function (k) { return '<option value="' + k + '" ' + (stage1 && stage1.action === k ? 'selected' : '') + '>' + STAGE1_ACTION_LABEL[k] + '</option>'; }).join('');
          var stage2ActionOptions = '<option value="">사용 안 함</option>' + Object.keys(STAGE2_ACTION_LABEL).map(function (k) { return '<option value="' + k + '" ' + (stage2 && stage2.action === k ? 'selected' : '') + '>' + STAGE2_ACTION_LABEL[k] + '</option>'; }).join('');
          var stage2LocOptions = LOCATIONS.map(function (l) { return '<option value="' + l.code + '" ' + ((stage2 && stage2.location === l.code) ? 'selected' : '') + '>' + l.name + '</option>'; }).join('');
          overlay.innerHTML = '' +
            '<div class="modal-box" style="max-width:480px;">' +
            '<div class="modal-title">' + (isNew ? '새 제품 등록' : '제품 수정') + '</div>' +
            (isNew ? '' : '<div class="modal-sub">' + esc(editing.productName) + ' (' + esc(editing.barcode) + ')</div>') +
            '<form id="productForm" class="form-grid">' +
            '<div class="field"><label>바코드</label><input name="barcode" value="' + esc(editing.barcode || '') + '" ' + (isNew ? '' : 'readonly') + ' required></div>' +
            '<div class="field"><label>제품명</label><input name="productName" value="' + esc(editing.productName || '') + '" required></div>' +
            '<div class="field"><label>분류</label><select name="storage">' + storageOptions + '</select></div>' +
            '<div class="field"><label>보관 위치</label><select name="fromLocation" id="fromLocationSelect">' + fromLocOptions + '</select></div>' +
            '<div class="field" style="grid-column:1/-1;"><label>1단계 전환 (개봉/소분 · 같은 위치)</label><select name="stage1Action" id="stage1ActionSelect">' + stage1ActionOptions + '</select></div>' +
            '<div class="field" id="stage1DaysField"><label>1단계 안전보관 기준일수</label><input type="number" name="stage1Days" min="1" value="' + (stage1 ? stage1.days : 3) + '"></div>' +
            '<div class="field" id="stage2ActionWrap" style="grid-column:1/-1;"><label>2단계 전환 (해동 · 위치 이동, 1단계 필요)</label><select name="stage2Action" id="stage2ActionSelect">' + stage2ActionOptions + '</select></div>' +
            '<div class="field" id="stage2LocationField"><label>해동 위치</label><select name="stage2Location">' + stage2LocOptions + '</select></div>' +
            '<div class="field" id="stage2DaysField"><label>2단계 안전보관 기준일수</label><input type="number" name="stage2Days" min="1" value="' + (stage2 ? stage2.days : 1) + '"></div>' +
            '<div id="flowPreviewBox" class="field" style="grid-column:1/-1;"><label>흐름 미리보기</label><div class="flow-preview" id="flowPreviewInner"></div></div>' +
            '<div class="field" style="grid-column:1/-1; display:flex; gap:8px;">' +
            (isNew ? '' : '<button type="button" class="btn-danger-text" data-action="delete-product-in-modal" data-barcode="' + esc(editing.barcode) + '">이 제품 삭제</button>') +
            '</div>' +
            '<div class="modal-actions" style="grid-column:1/-1;">' +
            '<button type="button" class="btn btn-ghost btn-block" data-action="close-modal">취소</button>' +
            '<button type="submit" class="btn btn-primary btn-block">저장</button>' +
            '</div>' +
            '</form>' +
            '</div>';
        }

        if (state.modal.type === 'advance-qty') {
          var aqLot = state.modal.lot;
          var aqProduct = productByBarcode(aqLot.barcode);
          var aqSteps = aqProduct ? stepsFor(aqProduct) : [];
          var aqIdx = aqSteps.findIndex(function (s) { return s.name === aqLot.status; });
          var aqNext = aqSteps[aqIdx + 1];
          var aqConflict = aqNext ? findActiveStageLot(aqLot.barcode, aqNext.name, aqLot.lotId) : null;
          var aqLocChange = aqNext && aqNext.location && aqNext.location !== aqLot.location;
          overlay.innerHTML = '' +
            '<div class="modal-box">' +
            '<div class="modal-title">' + esc(aqLot.productName) + ' · ' + esc(aqLot.status) + ' → ' + esc(aqNext ? aqNext.name : '') + '</div>' +
            '<div class="modal-sub">현재 수량 ' + aqLot.qty + '개' + (aqLocChange ? (' · ' + (locOf(aqNext.location) ? locOf(aqNext.location).name : aqNext.location) + '로 이동') : '') + (aqConflict ? (' · 진행 시 기존 ' + aqConflict.status + ' 로트(' + aqConflict.qty + '개) 자동 소진됨') : '') + '</div>' +
            '<form id="advanceQtyForm" class="form-grid single" style="margin-top:12px;">' +
            '<div class="field"><label>이동 수량 (나머지는 그대로 남아요)</label><input type="number" name="qty" min="1" max="' + aqLot.qty + '" value="' + aqLot.qty + '" required></div>' +
            '<div class="modal-actions">' +
            '<button type="button" class="btn btn-ghost btn-block" data-action="close-modal">취소</button>' +
            '<button type="submit" class="btn btn-primary btn-block">' + esc(aqNext ? (BUTTON_LABEL[aqNext.name] || aqNext.name) : '진행') + '</button>' +
            '</div>' +
            '</form>' +
            '</div>';
        }

        if (state.modal.type === 'import') {
          overlay.innerHTML = '' +
            '<div class="modal-box" style="max-width:640px;">' +
            '<div class="modal-title">제품 CSV 일괄 등록</div>' +
            '<div class="modal-sub">탭 또는 쉼표로 구분된 표를 붙여넣으세요. 첫 줄은 헤더입니다: barcode, storage, productName, fromLocation, stage1Action(OPEN/SUBDIV), stage1Days, stage2Action(THAW), stage2Location, stage2Days (2단계는 1단계가 있어야 사용 가능 · 바코드가 같으면 기존 제품을 덮어써요)</div>' +
            '<textarea id="csvInput" rows="10" style="width:100%; font-family:monospace; font-size:11.5px; border:1.5px solid var(--line); border-radius:12px; padding:10px;" placeholder="barcode&#9;storage&#9;productName&#9;fromLocation&#9;stage1Action&#9;stage1Days&#9;stage2Action&#9;stage2Location&#9;stage2Days"></textarea>' +
            '<div id="csvPreview" style="margin-top:10px; font-size:12.5px; color:var(--ink-soft); max-height:140px; overflow-y:auto;"></div>' +
            '<div class="modal-actions">' +
            '<button class="btn btn-ghost btn-block" data-action="close-modal">취소</button>' +
            '<button class="btn btn-primary btn-block" data-action="confirm-import">가져오기</button>' +
            '</div>' +
            '</div>';
        }

        if (state.modal.type === 'print-preview') {
          var segs = state.modal.segments;
          var previewText = segs.map(function (seg) {
            if (seg.type === 'barcode') return '▮▮▮ 바코드: ' + seg.code + ' ▮▮▮';
            if (seg.type === 'cut') return '· · · · · · (절단선) · · · · · ·';
            return seg.text;
          }).join('\n');
          overlay.innerHTML = '' +
            '<div class="modal-box" style="max-width:420px;">' +
            '<div class="modal-title">출력 미리보기</div>' +
            '<div class="modal-sub">' + esc(state.modal.title || '') + '</div>' +
            '<pre style="white-space:pre-wrap; word-break:break-all; font-family:monospace; font-size:12px; background:var(--bg); border:1.5px solid var(--line); border-radius:12px; padding:12px; max-height:360px; overflow-y:auto; margin:0;">' + esc(previewText) + '</pre>' +
            '<div class="modal-actions">' +
            '<button class="btn btn-ghost btn-block" data-action="close-modal">취소</button>' +
            '<button class="btn btn-primary btn-block" data-action="confirm-print">출력하기</button>' +
            '</div>' +
            '</div>';
        }

        document.body.appendChild(overlay);
        overlay.addEventListener('click', function (e) { if (e.target === overlay) { state.modal = null; overlay.remove(); } });

        var closeModalBtn = overlay.querySelector('[data-action="close-modal"]');
        if (closeModalBtn) { closeModalBtn.addEventListener('click', function () { state.modal = null; render(); }); }

        var receiveForm = document.getElementById('receiveForm');
        if (receiveForm) {
          receiveForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            var fd = new FormData(receiveForm);
            var product = state.modal.product;
            state.modal = null;
            await receiveStock(product, fd.get('qty'), fd.get('expiry'), fd.get('location'));
            render();
          });
        }

        var advanceQtyForm = document.getElementById('advanceQtyForm');
        if (advanceQtyForm) {
          advanceQtyForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            var fd = new FormData(advanceQtyForm);
            var target = state.inventory.find(function (l) { return l.lotId === state.modal.lot.lotId; });
            state.modal = null;
            if (target) {
              var result = await advanceLot(target, fd.get('qty'));
              if (result && result.receipts && result.receipts.length) {
                state.modal = { type: 'print-preview', title: target.productName + ' 처리 완료 · 라벨 출력', segments: [].concat.apply([], result.receipts) };
              }
            }
            render();
          });
        }

        var editLotForm = document.getElementById('editLotForm');
        if (editLotForm) {
          editLotForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            var fd = new FormData(editLotForm);
            var target = state.inventory.find(function (l) { return l.lotId === state.modal.lot.lotId; });
            state.modal = null;
            if (target) {
              await editLot(target, { qty: fd.get('qty'), expiry: fd.get('expiry'), status: fd.get('status') });
            }
            render();
          });
        }

        var deleteInModalBtn = overlay.querySelector('[data-action="delete-product-in-modal"]');
        if (deleteInModalBtn) {
          deleteInModalBtn.addEventListener('click', async function () {
            var bc = deleteInModalBtn.getAttribute('data-barcode');
            if (confirm('이 제품을 삭제할까요? 기존 재고 로트에는 영향이 없어요.')) {
              state.modal = null;
              await deleteProduct(bc);
              render();
            }
          });
        }

        var stage1ActionSelect = document.getElementById('stage1ActionSelect');
        var stage2ActionSelect = document.getElementById('stage2ActionSelect');
        function buildProductDraftFromForm(form) {
          var fd = new FormData(form);
          var stage1Action = fd.get('stage1Action') || '';
          var stage2Action = fd.get('stage2Action') || '';
          return {
            fromLocation: fd.get('fromLocation'),
            stage1: stage1Action ? { action: stage1Action, days: Number(fd.get('stage1Days')) || 1 } : null,
