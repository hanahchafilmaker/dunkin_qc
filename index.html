<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#2b1810">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <title>던킨 품질관리 시스템</title>
  <link rel="manifest"
    href="data:application/manifest+json,%7B%22name%22%3A%22%EB%8D%98%ED%82%A8%20%EA%B4%80%EB%A6%AC%22%2C%22short_name%22%3A%22%ED%92%88%EC%A7%88%EA%B4%80%EB%A6%AC%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%232b1810%22%2C%22theme_color%22%3A%22%232b1810%22%7D">
  <style>
    :root {
      --bg: #2b1810;
      --panel: #3a2317;
      --panel2: #452a1c;
      --panel3: #4f3220;
      --cream: #fdf3e7;
      --dim: #e9d7c2;
      --muted: #c9a98c;
      --pink: #ff5c8a;
      --orange: #ffa630;
      --mint: #4fd1c5;
      --red: #ff6b6b;
      --line: #5a3d2b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--cream);
      font-family: "Noto Sans KR", sans-serif;
      padding: 16px;
      padding-bottom: 60px;
      -webkit-tap-highlight-color: transparent;
    }

    h1 {
      font-size: 1.15rem;
      margin: 0;
    }

    h2 {
      font-size: 1rem;
      margin: 0 0 10px;
      color: var(--mint);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #00000030;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 0.75rem;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #c9a98c;
      flex-shrink: 0;
    }

    .dot.on {
      background: var(--mint);
    }

    button {
      font-family: "Noto Sans KR", sans-serif;
      cursor: pointer;
      border: none;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.9rem;
      font-weight: 700;
      background: var(--panel2);
      color: var(--cream);
      border: 1px solid var(--line);
      transition: transform .1s ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: var(--orange);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
    }

    button.primary {
      background: linear-gradient(135deg, var(--pink), var(--orange));
      color: #2b1810;
    }

    button.ghost {
      background: transparent;
    }

    button.danger {
      border-color: var(--red);
      color: var(--red);
      background: transparent;
    }

    button.small {
      padding: 7px 12px;
      font-size: 0.78rem;
      border-radius: 999px;
    }

    input,
    select,
    textarea {
      font-family: "Noto Sans KR", sans-serif;
      background: #00000030;
      color: var(--cream);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.9rem;
      width: 100%;
    }

    input::placeholder {
      color: var(--muted);
    }

    label {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
      margin: 10px 0 4px;
    }

    .field-row {
      display: flex;
      gap: 8px;
    }

    .field-row>* {
      flex: 1;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 760px;
      margin-bottom: 16px;
    }

    @media (max-width:680px) {
      .menu {
        grid-template-columns: 1fr 1fr;
      }
    }

    .menu button {
      text-align: left;
      position: relative;
      min-height: 64px;
    }

    .menu .zonelabel {
      display: block;
      font-size: 0.95rem;
    }

    .menu .zonecount {
      display: block;
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 4px;
      font-weight: 400;
    }

    .submenu {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 760px;
      margin-bottom: 22px;
    }

    @media (max-width:680px) {
      .submenu {
        grid-template-columns: 1fr 1fr;
      }
    }

    .submenu button {
      text-align: left;
      position: relative;
    }

    .badge {
      position: absolute;
      top: 8px;
      right: 10px;
      background: var(--pink);
      color: #2b1810;
      border-radius: 999px;
      font-size: 0.68rem;
      padding: 1px 7px;
      font-weight: 800;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      max-width: 760px;
      margin-bottom: 14px;
    }

    .panel h3 {
      margin: 0 0 10px;
      font-size: 0.95rem;
      color: var(--mint);
    }

    .cat-block {
      margin-bottom: 18px;
    }

    .cat-title {
      font-size: 0.82rem;
      color: var(--orange);
      font-weight: 800;
      margin: 14px 0 8px;
      letter-spacing: .02em;
    }

    .product-row {
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 8px;
    }

    .product-row .pname {
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .product-row .pname .tag {
      font-size: 0.68rem;
      color: var(--muted);
      font-weight: 400;
    }

    .safe-pill {
      display: inline-block;
      font-size: 0.72rem;
      padding: 2px 9px;
      border-radius: 999px;
      font-weight: 700;
      background: #00000030;
      color: var(--muted);
    }

    .safe-pill.ok {
      background: #1e3d33;
      color: var(--mint);
    }

    .safe-pill.warn {
      background: #4a3410;
      color: var(--orange);
    }

    .safe-pill.danger {
      background: #4a1e1e;
      color: var(--red);
    }

    /* ---- 위치별 우선순위 알림(냉장-우 FRG_R_THAW 2일 임박) 전용 강조 배지 ---- */
    .safe-pill.priority-danger {
      background: #ff2d2d;
      color: #fff;
      font-weight: 900;
      box-shadow: 0 0 0 2px #ff2d2d55;
      animation: priorityPulse 1.4s infinite;
    }

    @keyframes priorityPulse {
      0% {
        box-shadow: 0 0 0 0 #ff2d2d88;
      }

      70% {
        box-shadow: 0 0 0 8px #ff2d2d00;
      }

      100% {
        box-shadow: 0 0 0 0 #ff2d2d00;
      }
    }

    .barcode-tag {
      margin-top: 8px;
      font-size: 0.72rem;
      color: var(--muted);
      font-family: "JetBrains Mono", monospace;
      letter-spacing: .02em;
    }

    .barcode-svg {
      display: block;
      margin-top: 8px;
      max-width: 170px;
      height: 44px;
      background: #fff;
      border-radius: 4px;
      padding: 2px 4px;
    }

    .basis-now-btn {
      width: 100%;
      display: block;
      text-align: center;
      padding: 14px 12px;
      font-size: 0.95rem;
      border-radius: 12px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--pink), var(--orange));
      color: #2b1810;
      border: none;
    }

    .basis-now-btn .sub {
      display: block;
      font-size: 0.72rem;
      font-weight: 500;
      margin-top: 2px;
      opacity: .85;
    }

    .basis-now-btn.done {
      background: #1e3d33;
      color: var(--mint);
      border: 1px solid #2f5c4e;
    }

    details.basis-manual {
      margin-bottom: 10px;
    }

    details.basis-manual summary {
      cursor: pointer;
      font-size: 0.75rem;
      color: var(--muted);
      list-style: none;
      padding: 4px 2px;
    }

    details.basis-manual summary::-webkit-details-marker {
      display: none;
    }

    details.basis-manual summary::before {
      content: '✎ ';
    }

    details.basis-manual[open] summary {
      margin-bottom: 4px;
    }

    .manage-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
      cursor: grab;
    }

    .manage-row.dragging {
      opacity: .4;
    }

    .manage-row .drag-handle {
      color: var(--muted);
      font-size: 1rem;
      cursor: grab;
    }

    .manage-row .info {
      flex: 1;
      min-width: 0;
    }

    .manage-row .info .n {
      font-weight: 700;
    }

    .manage-row .info .m {
      font-size: 0.72rem;
      color: var(--muted);
    }

    .manage-row .acts {
      display: flex;
      gap: 6px;
    }

    #preview {
      background: #00000030;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
      font-size: 0.78rem;
      max-height: 400px;
      overflow: auto;
      color: var(--dim);
      margin: 0 0 14px;
    }

    #preview .chunk {
      font-family: "JetBrains Mono", monospace;
      white-space: pre-wrap;
    }

    #preview .barcode-svg {
      margin: 6px auto;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .actions button {
      flex: 1;
      min-width: 120px;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: #000000a0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
    }

    @media (min-width:680px) {
      .overlay {
        align-items: center;
      }
    }

    .sheet {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px 16px 0 0;
      padding: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 88vh;
      overflow: auto;
    }

    @media (min-width:680px) {
      .sheet {
        border-radius: 16px;
      }
    }

    .empty {
      color: var(--muted);
      font-size: 0.85rem;
      padding: 20px 4px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--mint);
      color: #1a1a1a;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }

    .toast.show {
      opacity: 1;
    }

    .search-wrap {
      max-width: 760px;
      margin-bottom: 12px;
    }

    .zone-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px;
      max-width: 760px;
    }

    .zone-tabs button {
      flex: 1;
      min-width: 70px;
      padding: 9px 8px;
      font-size: 0.82rem;
    }

    .zone-tabs button.active {
      background: linear-gradient(135deg, var(--pink), var(--orange));
      color: #2b1810;
    }

    pre#log {
      margin-top: 20px;
      max-width: 760px;
      font-size: 0.7rem;
      color: var(--muted);
      white-space: pre-wrap;
    }

    /* ---- 바코드 스캔바 ---- */
    .scanbar {
      max-width: 760px;
      margin-bottom: 14px;
      background: var(--panel3);
      border: 2px solid var(--mint);
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .scanbar .ic {
      font-size: 1.2rem;
    }

    .scanbar input {
      border: none;
      background: transparent;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .scanbar input:focus {
      outline: none;
    }

    /* ---- 스캔 매칭 시 반짝임 효과 ---- */
    .product-row.flash {
      animation: flashRow 1s ease;
    }

    @keyframes flashRow {
      0% {
        background: var(--mint);
      }

      100% {
        background: var(--panel2);
      }
    }


    /* ---- 폐기 완료 표시 & 동기화 상태 ---- */
    .product-row.discarded {
      opacity: .45;
    }

    .discard-btn {
      background: linear-gradient(135deg, var(--red), #c94848);
      color: #fff;
      border: none;
    }

    .discard-btn.done {
      background: #1e3d33;
      color: var(--mint);
      border: 1px solid #2f5c4e;
    }

    .sync-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 6px;
    }

    .sync-row .dot {
      width: 6px;
      height: 6px;
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="topbar-left">
      <button class="small ghost" id="backBtn" style="display:none;">← 뒤로</button>
      <h1 id="pageTitle">🍩 던킨 품질관리 시스템</h1>
    </div>
    <div class="status">
      <span class="dot" id="syncDot"></span>
      <span id="syncText">시트 미연결</span>
      <button class="small" id="syncBtn" style="margin-left:4px;">연동설정</button>
    </div>
    <div class="status">
      <span class="dot" id="connDot"></span>
      <span id="connText">프린터 미연결</span>
      <button class="small" id="connBtn" style="margin-left:4px;">연결</button>
    </div>
  </div>

  <div class="scanbar">
    <span class="ic">📷</span>
    <input type="text" id="globalScanInput" placeholder="바코드를 스캔하세요 (상품명·소비기한 자동 인식)" autocomplete="off">
    <button type="button" class="small" id="receiveModeBtn" style="flex:0 0 auto;">📥 빠른입고</button>
  </div>

  <main id="viewRoot"></main>
  <pre id="log"></pre>

  <div class="toast" id="toast"></div>

  <script>
    /* =========================================================
       1. 데이터 모델 & 저장소 (추후 Firebase 등으로 교체하기 쉽도록 분리)
       ========================================================= */
    const ZONES = [
      { key: 'left', label: '냉장(좌)' },
      { key: 'right', label: '냉장(우)' },
      { key: 'freezer', label: '냉동고' },
      { key: 'freezerTop', label: '대형냉동고(상)' },
      { key: 'freezerBottom', label: '대형냉동고(하)' },
      { key: 'room', label: '상온' },
    ];

    /* ---------------------------------------------------------
       1-1. 위치 마스터 코드 매핑 (dashboard_extension.js 통합)
       ZONES(key: left/right/freezer/freezerTop/freezerBottom/room)를
       백엔드(inventory_backend.gs)의 위치 코드(FRG_L_BEV 등)와
       주고받기 위한 매핑. 위치별 알림 규칙도 프론트에 함께 두어
       (백엔드 LOCATION_MASTER와 동일한 값) UI에서 즉시 표시할 수 있게 한다.
       --------------------------------------------------------- */
    const LOCATION_CODE_MAP = {
      left: 'FRG_L_BEV',
      right: 'FRG_R_THAW',
      freezer: 'FRZ_SML',
      freezerTop: 'FRZ_BIG_TOP',
      freezerBottom: 'FRZ_BIG_BOT',
      room: 'ROOM_TEMP',
    };
    const LOCATION_CODE_REVERSE = Object.fromEntries(
      Object.entries(LOCATION_CODE_MAP).map(([zoneKey, code]) => [code, zoneKey])
    );
    // 위치별 알림 규칙: FRG_R_THAW(냉장-우)는 해동/소분 집중 구역 → 48h(2일) 임박 시 적색 강조.
    // FRZ_BIG_TOP(대형냉동-상)은 입고 빈번 → 입고 시 수량 모달을 최우선으로 띄운다.
    const LOCATION_ALERT_RULES = {
      FRG_L_BEV: { warnHours: 24, priorityAlert: false, receivePriority: false },
      FRG_R_THAW: { warnHours: 48, priorityAlert: true, receivePriority: false },
      FRZ_SML: { warnHours: 24, priorityAlert: false, receivePriority: false },
      FRZ_BIG_TOP: { warnHours: 24, priorityAlert: false, receivePriority: true },
      FRZ_BIG_BOT: { warnHours: 24, priorityAlert: false, receivePriority: false },
      ROOM_TEMP: { warnHours: 24, priorityAlert: false, receivePriority: false },
    };
    function locationCodeForZone(zoneKey) { return LOCATION_CODE_MAP[zoneKey] || 'ROOM_TEMP'; }
    function zoneKeyForLocationCode(code) { return LOCATION_CODE_REVERSE[code] || 'left'; }

    const DEFAULT_CATEGORIES = ['기본 식자재', '필링/소스', '음료/베이스', '음료/토핑', '기타'];
    const BASIS = {
      subdiv: { label: '소분일 포함', dateLabel: '소분일', calc: true, track: true },
      thaw: { label: '해동일 포함', dateLabel: '해동일', calc: true, track: true },
      open: { label: '개봉일 포함', dateLabel: '개봉일', calc: true, track: true },
      openOnly: { label: '개봉일 표시', dateLabel: '개봉일', calc: false, track: true },
      expiryOnly: { label: '소비기한 표시(원팩)', dateLabel: null, calc: false, track: false },
    };
    // 위 다섯 가지 중 어디에도 안 걸리는 값(예: 예전 데이터의 'none'/'manual')이 들어왔을 때 쓸 기본값.
    // UI 선택지에는 노출되지 않고, 방어적 fallback 용도로만 사용.
    const BASIS_FALLBACK = BASIS.expiryOnly;

    // ---------------------------------------------------------
    // 소분 품목 듀얼룰(Dual-Rule) 지원 (dashboard_extension.js 통합)
    // 요구사항: 소분통 교체(7일, containerDue) 와 식품 자체 소비기한(foodExpiry)을
    // 서로 "독립적으로" 관리한다. 기존 BASIS.subdiv는 하나의 안전보관일만
    // 계산했으므로, 소분(subdiv) 품목에 한해 두 값을 모두 계산/표시하도록 확장.
    // ---------------------------------------------------------
    // product.containerCycleDays가 없으면 기본 7일 사용
    const DEFAULT_CONTAINER_CYCLE_DAYS = 7;

    // entry.baseDate(소분일)로부터 "소분통 교체 예정일" 계산 — 항상 7일(또는 품목별 지정 주기) 고정 주기
    function computeContainerDue(product, entry) {
      if (product.basis !== 'subdiv') return null;
      if (!entry || !entry.baseDate) return null;
      const base = new Date(entry.baseDate);
      if (isNaN(base)) return null;
      const cycleDays = product.containerCycleDays || DEFAULT_CONTAINER_CYCLE_DAYS;
      const due = new Date(base.getTime() + cycleDays * 86400000);
      return due.toISOString().slice(0, 16);
    }

    // 식품 자체 소비기한은 entry.expiry (또는 product.defaultExpiry)를 그대로 사용 —
    // 소분통 교체일과는 완전히 별개의 값이므로 재계산하지 않는다.
    function foodExpiryOf(product, entry) {
      return (entry && entry.expiry) || product.defaultExpiry || null;
    }

    // ---------------------------------------------------------
    // 제품 유형(원팩 / 해동형 / 개봉형) — 물리적 상태·흐름 기준 분류.
    // 별도 필드를 새로 저장하지 않고 기존 basis 코드로부터 파생시킨다.
    //   - 냉동 즉시 사용(원팩)   → basis: expiryOnly
    //   - 냉장 해동 필수(해동형) → basis: thaw

    const SheetSync = {
      url: SHEET_URL,
      connected: false,

      init() {
        this.url = SHEET_URL;
        this.updateStatusUI();
      },

      updateStatusUI() {
        const dot = document.getElementById('syncDot');
        const text = document.getElementById('syncText');
        if (!dot || !text) return;
        if (this.connected) {
          dot.classList.add('on');
          text.textContent = '시트 연결됨';
        } else {
          dot.classList.remove('on');
          text.textContent = '시트 연결안됨';
        }
      },

      async _get(params) {
        if (!this.url) return null;
        try {
          const qs = new URLSearchParams(params).toString();
          const res = await fetch(this.url + (this.url.includes('?') ? '&' : '?') + qs);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          this.connected = true;
          this.updateStatusUI();
          return data;
        } catch (e) {
          console.error('API GET 실패:', params, e);
          this.connected = false;
          this.updateStatusUI();
          return null;
        }
      },

      async _post(body) {
        if (!this.url) return null;
        try {
          const res = await fetch(this.url, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // Apps Script 프리플라이트 회피
            body: JSON.stringify(body)
          });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          this.connected = true;
          this.updateStatusUI();
          return data;
        } catch (e) {
          console.error('API POST 실패:', body, e);
          this.connected = false;
          this.updateStatusUI();
          return null;
        }
      },

      // payload 예: { barcode, action:'해동', beforeStorage:'냉동', afterStorage:'냉장', quantity:1, operator:'관리자' }
      async postQC(payload) {

       있는 래퍼를 추가한다. 백엔드(inventory_backend.gs)의 doPost 액션과 1:1 대응.

    const LocationTransition = {
      // 입고: 외부 → 창고(구역). FRZ_BIG_TOP(대형냉동-상)은 receivePriority=true를
      // 돌려받으므로, 호출부에서 이 값을 보고 수량 입력 모달을 다른 구역보다
      // 먼저(최우선으로) 띄우면 된다.
      async receive({ barcode, productName, category, zoneKey, quantity, expiryDate, operator }) {
        const res = await SheetSync._post({
          action: 'receive', barcode, productName, category,
          toLocation: locationCodeForZone(zoneKey), quantity, expiryDate, operator: operator || '관리자'
        });
        return res; // res.receivePriority === true 이면 최우선 모달 처리
      },

      // 이동: 위치 A → 위치 B
      async move({ barcode, fromZoneKey, toZoneKey, quantity, operator }) {
        return await SheetSync._post({
          action: 'move', barcode,
          fromLocation: locationCodeForZone(fromZoneKey), toLocation: locationCodeForZone(toZoneKey),
          quantity, operator: operator || '관리자'
        });
      },

      // 해동: 냉동 → FRG_R_THAW(냉장-우)
      async thaw({ barcode, fromZoneKey, quantity, operator }) {
        return await SheetSync._post({
          action: 'thaw', barcode, fromLocation: locationCodeForZone(fromZoneKey || 'freezer'),
          quantity, operator: operator || '관리자'
        });

      async subdivide({ barcode, quantity, foodExpiryDate, operator }) {

      async discard({ barcode, reason, quantity, operator }) {

    const receiveQueue = [];
    function enqueueReceive(product) {
      receiveQueue.push(product);
      receiveQueue.sort((a, b) => {
        const aPriority = LOCATION_ALERT_RULES[locationCodeForZone(a.zone)]?.receivePriority ? 0 : 1;
        const bPriority = LOCATION_ALERT_RULES[locationCodeForZone(b.zone)]?.receivePriority ? 0 : 1;
        return aPriority - bPriority; // FRZ_BIG_TOP(대형냉동-상) 품목이 먼저 오도록
      });
    }
    function nextReceiveFromQueue() { return receiveQueue.shift(); }

    /* -----------------------------------------------------------------------
       1-4. 통합 알림 조회 (백엔드 GET ?action=alerts) (dashboard_extension.js 통합)
       안전보관일(위치별 임박 기준) + 소분통 교체 + 식품 소비기한을 한 번에
       가져와 홈 화면 배지("오늘 폐기 예정" 등) 카운트에 반영할 때 사용.
       ----------------------------------------------------------------------- */
    async function fetchPriorityAlerts() {
      const r = await SheetSync._get({ action: 'alerts' });
      return (r && r.success) ? r.data : [];
    }

    // ---- 저장소 어댑터: 지금은 localStorage, 나중에 Firebase로 교체 시 이 객체만 수정 ----
    const Repo = {
      async load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            // 최초 실행: 시딩 데이터로 초기화
            const seeded = JSON.parse(JSON.stringify(SEED_DATA));
            localStorage.setItem(STORAGE_KEY, JSON.stringify(seeded));
            return seeded;
          }
          const parsed = JSON.parse(raw);
          return { products: parsed.products || [], entries: parsed.entries || {}, barcodeSeq: parsed.barcodeSeq || 0 };
        } catch (e) {
          console.error(e);
          return { products: [], entries: {}, barcodeSeq: 0 };
        }
      },
      async save(state) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        return true;
      }
    };

    let DB = { products: [], entries: {}, barcodeSeq: 0 };

    // ---------------------------------------------------------
    // 시트 헤더 ↔ 앱 내부 필드 매핑
    //
    // MASTER_PRODUCTS: barcode | productName | category | storage | ruleType | days
    //   ruleType: '해동일'|'개봉일'|'소분일' (그 외/공백 = 원팩·소비기한만 관리)
    //   days    : 안전보관일 숫자(일 단위만 지원 — 시간 단위는 시트에 없음)
    //
    // INVENTORY: barcode | productName | category | quantity | expiry | status | baseDate | safeUntil
    //   status  : '정상' | '해동중' | '개봉' | '소진'
    //   → 바코드당 1행(로트 여러 개 아님) 구조.
    // ---------------------------------------------------------
    const RULE_TYPE_TO_BASIS = { '해동일': 'thaw', '개봉일': 'open', '소분일': 'subdiv' };
    const BASIS_TO_RULE_TYPE = { thaw: '해동일', open: '개봉일', subdiv: '소분일', openOnly: '개봉일', expiryOnly: '' };
    function ruleTypeToBasis(ruleType) { return RULE_TYPE_TO_BASIS[ruleType] || 'expiryOnly'; }
    function basisToRuleType(basis) { return BASIS_TO_RULE_TYPE[basis] || ''; }

    // storage(냉동/냉장/상온) 값만으로는 좌/우 냉장 등 세부 zone까지 알 수 없으므로,
    // 기존에 로컬에 이미 배치돼 있던 zone은 그대로 유지하고, 신규 품목만 기본 zone에 배정한다.
    function defaultZoneForStorage(storage) {
      if (storage === '냉동') return 'freezer';
      if (storage === '상온') return 'room';
      return 'left'; // 냉장 기본값
    }

    // 서버 MASTER_PRODUCTS 행 배열을 로컬 DB.products로 변환.
    // 이미 로컬에 같은 바코드 품목이 있으면 zone/order/stockTracking 등 로컬 전용 값은 보존한다.
    function mapMasterProducts(rows, prevProducts) {
      return rows.map((row, idx) => {
        const prev = prevProducts.find(p => p.barcode && normalizeGtin(p.barcode) === normalizeGtin(row.barcode));
        return {
          id: prev?.id || row.barcode || uid(),
          barcode: row.barcode,
          name: row.productName || prev?.name || '',
          category: row.category || prev?.category || '기타',
          storageMethod: row.storage || prev?.storageMethod || null,
          basis: ruleTypeToBasis(row.ruleType),
          durationValue: Number(row.days) || 0,
          durationUnit: 'day',
          containerCycleDays: row.containerCycleDays || prev?.containerCycleDays || DEFAULT_CONTAINER_CYCLE_DAYS,
          zone: prev?.zone || defaultZoneForStorage(row.storage),
          order: prev?.order ?? idx,
          stockTracking: prev?.stockTracking || false,
          defaultExpiry: prev?.defaultExpiry || null
        };
      });
    }

    // 서버 INVENTORY 행(바코드당 1행) 배열 → 클라이언트 DB.entries로 변환.
    function mapInventoryToEntries(rows, products) {
      const entries = {};
      rows.forEach(row => {
        const product = products.find(p => p.barcode && normalizeGtin(p.barcode) === normalizeGtin(row.barcode));
        if (!product) return;
        entries[product.id] = {
          qty: Number(row.quantity) || 0,
          expiry: row.expiry || null,
          status: row.status || '정상',
          baseDate: row.baseDate || null,
          safeUntil: row.safeUntil || null
        };
      });
      return entries;
    }

    async function loadDB() {
      DB = await Repo.load();
      window.DB = DB;

      // 시트 연동이 설정돼 있으면 서버 데이터를 가져와 병합 시도.
      // (여러 사람이 여러 기기에서 쓰는 경우를 감안해 시트 값을 우선한다)
      SheetSync.init();
      if (SheetSync.url) {
        const products = await SheetSync.getProducts();
        if (Array.isArray(products) && products.length) {
          DB.products = mapMasterProducts(products, DB.products);
        }
        const inventory = await SheetSync.getInventory();
        if (Array.isArray(inventory)) {
          DB.entries = mapInventoryToEntries(inventory, DB.products);
        }
        await Repo.save(DB);
      }

      // 기존에 저장된 데이터 중 바코드가 없는 품목이 있으면 자동으로 코드를 발급해 채워준다
      let backfilled = false;
      DB.products.forEach(p => {
        if (!p.barcode) {
          p.barcode = generateBarcode();
          backfilled = true;
        }
        if (p.basis === 'none') {
          p.basis = 'expiryOnly';
          backfilled = true;
        } else if (p.basis === 'manual') {
          p.basis = 'openOnly';
          backfilled = true;
        }
      });
      if (backfilled) await persist();
    }

    async function persist() { window.DB = DB; await Repo.save(DB); }

    // entry 하나만 저장(로컬 + 시트 동시 반영). 기존 화면 코드에서
    // "await persist(); toast('저장됨');" 처럼 쓰던 부분을 필요시
    // "await persistEntry(pid);" 로 바꾸면 시트에도 자동 반영됩니다.
    // (바꾸지 않아도 동작에는 문제 없습니다 — 기존 persist()는 로컬만 저장)
    async function persistEntry(productId) {
      window.DB = DB;
      await Repo.save(DB);
      const entry = DB.entries[productId];
      const product = DB.products.find(p => p.id === productId);
      if (entry && product) {
        // INVENTORY 시트는 바코드당 1행이므로, 로컬에서 로트(lots)를 여러 개 쓰는 품목은
        // 합계 수량 + 가장 가까운 소비기한으로 뭉쳐서 동기화한다.
        let syncQty = entry.qty ?? 0;
        let syncExpiry = entry.expiry || null;
        if (Array.isArray(entry.lots) && entry.lots.length) {
          syncQty = entry.lots.reduce((sum, l) => sum + (Number(l.qty) || 0), 0);
          const withExpiry = entry.lots.filter(l => l.expiry).sort((a, b) => new Date(a.expiry) - new Date(b.expiry));
          syncExpiry = withExpiry[0]?.expiry || syncExpiry;
        }
        // 결과를 기다리지 않고 백그라운드로 재고 동기화 (INVENTORY 시트 헤더와 1:1 매핑)
        SheetSync.saveInventory({
          barcode: product.barcode,
          productName: product.name,
          category: product.category,
          quantity: syncQty,
          expiry: syncExpiry,
          status: entry.status || '정상',
          baseDate: entry.baseDate || null,
          safeUntil: entry.safeUntil || computeSafeDate(product, entry) || null,
          containerDue: computeContainerDue(product, entry) || null
        });
      }
    }
    async function persistProducts() {
      window.DB = DB;
      await Repo.save(DB);
      // 제품 기준 자체(MASTER_PRODUCTS 시트) 수정은 서버 쪽에 별도 저장 라우트가 필요합니다.
      // 지금 API 스펙(products/scan/inventory/qc/qcLog/receive/move/thaw/subdivide/use/discard)에는
      // 제품 기준 저장 액션으로 'saveProducts'가 추가돼 있습니다 — 필요 시 아래처럼 호출하세요:
      //   SheetSync._post({ action: 'saveProducts', barcode, productName, category, storage, ruleType, days, containerCycleDays });
    }

    function uid() {

      if (crypto.randomUUID) return crypto.randomUUID();
      return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
    }

    // segments(텍스트/바코드 배열)를 미리보기 박스에 그대로 렌더링.
    // 실제 프린터로 나가는 것과 같은 구조라서, 미리보기에서 본 그대로 인쇄된다.
    function renderReceiptPreview(container, segments) {
      container.innerHTML = '';
      segments.forEach(seg => {
        if (seg.type === 'barcode') {
          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          svg.setAttribute('class', 'barcode-svg');
          svg.dataset.code = seg.code;
          container.appendChild(svg);
        } else if (seg.type === 'cut') {
          const div = document.createElement('div');
          div.className = 'chunk';
          div.style.textAlign = 'center';
          div.style.color = 'var(--muted)';
          div.textContent = '✂ ---------- 자동 절단 ----------';
          container.appendChild(div);
        } else {
          const div = document.createElement('div');
          div.className = 'chunk';
          div.textContent = seg.text;
          container.appendChild(div);
        }
      });
      renderBarcodeSvgs(container);
    }

    // 화면에 보여줄 실물 바코드 이미지 렌더링 (인쇄용 GS k와는 별개 —
    // 이건 순전히 브라우저 화면에서 "이게 그 바코드구나" 눈으로 확인하기 위한 용도)
    function renderBarcodeSvgs(container) {
      container.querySelectorAll('.barcode-svg').forEach(svg => {
        const code = svg.dataset.code;
        if (!code) return;
        try {
          JsBarcode(svg, code, {
            format: 'CODE128',
            displayValue: false,
            fontSize: 13,
            height: 32,
            margin: 4,
            lineColor: '#000'
          });
        } catch (e) {
          // JsBarcode가 못 읽는 값(빈 문자열 등)이면 조용히 무시
        }
      });
    }

    // ---- 자체 발급 바코드 코드 ----
    // 실제 GS1 납품 바코드가 없는 자체 제조/소분 품목을 위해,
    // 매장 전용 8자리 코드(90000001, 90000002 ...)를 순번대로 발급한다.
    function generateBarcode() {
      let code;
      do {
        DB.barcodeSeq = (DB.barcodeSeq || 0) + 1;
        code = '900000' + String(DB.barcodeSeq).padStart(2, '0');
      } while (DB.products.some(p => p.barcode && normalizeGtin(p.barcode) === normalizeGtin(code)));
      return code;
    }

    /* =========================================================
       2. 날짜 / 계산 유틸
       ========================================================= */
    function pad(n) { return String(n).padStart(2, '0'); }

    function fmtDT(str) {
      if (!str) return null;
      const d = new Date(str);
      if (isNaN(d)) return null;
      return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    function fmtD(str) {
      if (!str) return null;
      const d = new Date(str);
      if (isNaN(d)) return null;
      return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}`;
    }
    // 영수증 다단 배치용 축약 날짜(연도 생략) — 해동/소분/개봉일, 안전보관일처럼
    // 당일 기준으로 확인하는 값에만 쓰고, 소비기한처럼 해가 넘어갈 수 있는
    // 값에는 쓰지 않는다.
    function fmtDTShort(str) {
      if (!str) return null;
      const d = new Date(str);
      if (isNaN(d)) return null;
      return `${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    function fmtNow() {
      const d = new Date();
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    function nowLocalInputValue() {
      const d = new Date();
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    function todayDateOnly() {
      const d = new Date();
      return new Date(d.getFullYear(), d.getMonth(), d.getDate());
    }
    function dateOnlyOf(str) {
      const d = new Date(str);
      return new Date(d.getFullYear(), d.getMonth(), d.getDate());
    }
    function isToday(str) {
      if (!str) return false;
      const d = dateOnlyOf(str);
      if (isNaN(d)) return false;
      return +d === +todayDateOnly();
    }
    function lastDayOfMonth(year, month1to12) {
      // month1to12: 1~12
      return new Date(year, month1to12, 0).getDate();
    }

    // 관리기준 + 보관기간으로 안전보관일 계산
    function computeSafeDate(product, entry) {
      if (!entry) return null;
      const basis = BASIS[product.basis] || BASIS_FALLBACK;
      if (!basis.calc) return null;
      if (!entry.baseDate) return null;
      const base = new Date(entry.baseDate);
      if (isNaN(base)) return null;
      const val = Number(product.durationValue) || 0;
      const ms = product.durationUnit === 'day' ? val * 86400000 : val * 3600000;
      return new Date(base.getTime() + ms).toISOString().slice(0, 16);
    }

    /* ---------------------------------------------------------------------
       안전보관일 상태(정상/임박/위험) 판정용 (dashboard_extension.js 통합 — 교체됨)
       기존 함수는 24시간 고정 임박 기준이었다. 냉장(우)=FRG_R_THAW는 해동/소분이
       집중되는 구역이라 "2일(48h) 임박 시 적색 강조"가 필요하므로, zoneKey를
       받아 위치별 warnHours를 적용하도록 확장한다. zoneKey를 생략하면 기존과
       동일하게 24h 기준(ROOM_TEMP 규칙)으로 동작한다.
       --------------------------------------------------------------------- */
    function safeStatus(safeDateStr, zoneKey) {
      if (!safeDateStr) return 'none';
      const safe = new Date(safeDateStr);
      const now = new Date();
      const diffH = (safe - now) / 3600000;
      const rule = LOCATION_ALERT_RULES[locationCodeForZone(zoneKey)] || { warnHours: 24 };
      if (diffH <= 0) return 'danger';
      if (diffH <= rule.warnHours) return rule.priorityAlert ? 'priority-danger' : 'warn';
      return 'ok';
    }

    // 소비기한(날짜) 상태(정상/임박/위험) 판정용
    function expiryStatus(expiryDateStr) {
      if (!expiryDateStr) return 'none';
      const exp = dateOnlyOf(expiryDateStr);
      if (isNaN(exp)) return 'none';
      const today = todayDateOnly();
      const diffDays = (exp - today) / 86400000;
      if (diffDays <= 0) return 'danger';
      if (diffDays <= 1) return 'warn';
      return 'ok';
    }

    // priority-danger 상태도 danger 계열 배지 CSS 클래스로 매핑하기 위한 헬퍼
    // (renderDualRuleBadges 등에서 safeStatus의 4가지 반환값을 실제 .safe-pill 클래스로 변환)
    function pillClassFor(status) {
      if (status === 'priority-danger') return 'priority-danger';
      if (status === 'danger') return 'danger';
      if (status === 'warn') return 'warn';
      if (status === 'ok') return 'ok';
      return '';
    }

    // 소분 품목용 상태 배지 2개(통 교체 / 식품 소비기한)를 함께 렌더링하는 헬퍼.
    // renderProductList()에서 basis === 'subdiv'이고 재고관리(stockTracking) 대상이
    // 아닌 품목의 배지 렌더링에 사용한다.
    function renderDualRuleBadges(product, entry) {
      const containerDue = computeContainerDue(product, entry);
      const foodExpiry = foodExpiryOf(product, entry);
      const containerStatus = containerDue ? safeStatus(containerDue, product.zone) : 'none';
      const expiryStatusVal = foodExpiry ? expiryStatus(foodExpiry) : 'none';
      return `
        <span class="safe-pill ${pillClassFor(containerStatus)}" title="소분통 교체(${product.containerCycleDays || DEFAULT_CONTAINER_CYCLE_DAYS}일 고정)">
          🧴 통교체 ${containerDue ? fmtDT(containerDue) : '미입력'}
        </span>
        <span class="safe-pill ${pillClassFor(expiryStatusVal)}" title="식품 자체 소비기한">
          🥫 식품기한 ${foodExpiry ? fmtD(foodExpiry) : '미입력'}
        </span>
      `;
    }

    /* =========================================================
       3. 완성형 한글(CP949) 인코딩 — SRP-350III 출력용
       TextEncoder는 UTF-8만 지원하여 한글이 깨지므로,
